<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabinet — 批奏折</title>
<style>
  :root {
    --bg: #14161a; --bg-2: #1a1d23; --bg-3: #21252c; --bg-4: #272c34;
    --line: #2b3038; --line-2: #343a43;
    --fg: #d7dce3; --fg-dim: #8b939f; --fg-faint: #5f6874;
    --accent: #6ea8fe; --danger: #e5534b; --warn: #d9a441; --ok: #57ab5a;
    --purple: #b392f0;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--bg-2); border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  .meta { color: var(--fg-faint); font-size: 11px; }
  .spacer { flex: 1; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
         background: var(--ok); margin-right: 5px; }
  .dot.off { background: var(--danger); }
  button {
    background: var(--bg-3); border: 1px solid var(--line); color: var(--fg);
    border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: #2b3038; border-color: #3a4048; }
  button.primary { background: #24384f; border-color: #33506f; color: #b9d4f5; }
  button.primary:hover { background: #2b4561; }
  button.danger { background: #43241f; border-color: #5f3129; color: #f0b3ac; }
  button.danger:hover { background: #522b25; }
  button:disabled { opacity: .4; cursor: default; }
  button.sm { padding: 2px 7px; font-size: 11px; }
  input, textarea, select {
    background: var(--bg-3); border: 1px solid var(--line); color: var(--fg);
    border-radius: 4px; padding: 4px 8px; font-size: 12px; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  /* ---------- 三栏 ---------- */
  main { flex: 1; display: grid; grid-template-columns: 250px minmax(0,1fr) 300px; min-height: 0; }
  section { min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  section:last-child { border-right: 0; }
  .sec-head {
    flex: 0 0 auto; padding: 7px 12px; font-size: 11px; font-weight: 600;
    letter-spacing: .6px; color: var(--fg-faint); background: var(--bg-2);
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px;
  }
  .sec-head .count { color: var(--fg-dim); font-weight: 400; letter-spacing: 0; }
  .scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; }
  .scroll::-webkit-scrollbar { width: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: #31363e; border-radius: 5px; }

  /* ---------- 状态徽章 ---------- */
  .badge {
    font-size: 10px; padding: 0 5px; border-radius: 3px; white-space: nowrap;
    border: 1px solid; line-height: 15px; font-family: var(--mono); display: inline-block;
  }
  .badge.inbox { color: var(--fg-dim); border-color: #333941; background: #22262c; }
  .badge.awaiting_plan { color: var(--warn); border-color: #4a3a1c; background: #2e2617; }
  .badge.ready { color: #8fd0ff; border-color: #24405f; background: #1a2836; }
  .badge.queued { color: var(--fg-dim); border-color: #333941; background: #22262c; }
  .badge.running { color: var(--accent); border-color: #24405f; background: #1a2836; }
  .badge.review { color: var(--warn); border-color: #4a3a1c; background: #2e2617; }
  .badge.done { color: var(--ok); border-color: #2b432c; background: #1b291c; }
  .badge.failed { color: var(--danger); border-color: #4d2925; background: #2c1d1b; }
  .badge.rejected, .badge.interrupted { color: var(--fg-faint); border-color: #333941; background: #1e2228; }
  .badge.pri { color: var(--purple); border-color: #3d3352; background: #241f30; }

  /* ---------- 左：树 ---------- */
  .tree-item {
    padding: 6px 12px; cursor: pointer; border-left: 2px solid transparent;
    display: flex; align-items: center; gap: 6px; font-size: 12px;
  }
  .tree-item:hover { background: #1b1f25; }
  .tree-item.sel { background: #1e2833; border-left-color: var(--accent); }
  .tree-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-item .badge { flex: 0 0 auto; }
  .tree-item .n { flex: 0 0 auto; }
  .tree-item.child { padding-left: 26px; font-size: 11.5px; color: var(--fg-dim); }
  .tree-item .n { color: var(--fg-faint); font-size: 10.5px; font-family: var(--mono); }
  .tree-label {
    padding: 8px 12px 4px; font-size: 10px; letter-spacing: .7px; color: var(--fg-faint);
    text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---------- 中间 ---------- */
  .detail { padding: 14px 18px; }
  .detail h2 { font-size: 15px; margin: 0 0 6px; font-weight: 600; line-height: 1.4; }
  .detail .sub { color: var(--fg-faint); font-size: 11px; font-family: var(--mono); margin-bottom: 10px; }
  .kv { display: grid; grid-template-columns: 76px 1fr; gap: 3px 10px; margin: 10px 0; font-size: 12px; }
  .kv dt { color: var(--fg-faint); font-family: var(--mono); font-size: 11px; padding-top: 1px; }
  .kv dd { margin: 0; color: var(--fg-dim); word-break: break-all; font-family: var(--mono); font-size: 11px; }
  .actions { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; align-items: center; }
  .actions input { flex: 1; min-width: 100px; }
  .actions input[type=number] { flex: 0 0 auto; width: 64px; min-width: 0; }

  /* 依赖 */
  .deps { margin: 10px 0; display: flex; flex-direction: column; gap: 3px; }
  .dep { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--fg-dim); }
  .dep .dot2 { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 auto; }
  .dep.waiting { color: var(--warn); }
  .dep.ok .dot2 { background: var(--ok); }
  .dep.waiting .dot2 { background: var(--warn); }

  /* 群消息流 */
  .msgstream { margin-top: 14px; }
  .msg-head {
    font-size: 11px; color: var(--fg-faint); letter-spacing: .5px; padding: 6px 0;
    border-bottom: 1px solid var(--line); margin-bottom: 8px; display: flex; gap: 8px; align-items: center;
  }
  .msg {
    padding: 6px 10px; margin-bottom: 6px; border-radius: 5px; font-size: 12px;
    border-left: 2px solid var(--line-2); background: var(--bg-2); cursor: pointer;
  }
  .msg:hover { background: #1e2229; }
  .msg.human { border-left-color: var(--accent); background: #1a2029; }
  .msg.session { border-left-color: var(--purple); }
  .msg.system { border-left-color: #3a4048; color: var(--fg-dim); }
  .msg .who { font-size: 10px; color: var(--fg-faint); font-family: var(--mono); margin-bottom: 2px; }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .msg .jump { color: var(--accent); font-size: 10px; font-family: var(--mono); }

  /* 时间线 */
  .tl { margin-top: 14px; }
  .tl-item {
    display: flex; gap: 8px; font-size: 11.5px; padding: 3px 0; color: var(--fg-dim);
    border-left: 1px solid var(--line); padding-left: 10px; margin-left: 3px;
  }
  .tl-item .when { color: var(--fg-faint); font-family: var(--mono); font-size: 10.5px; flex: 0 0 62px; }
  .tl-item .act { color: var(--fg); font-family: var(--mono); font-size: 10.5px; flex: 0 0 96px; }

  /* code */
  pre {
    background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 10px; font-family: var(--mono); font-size: 11px; color: var(--fg-dim);
    white-space: pre-wrap; word-break: break-word; margin: 6px 0; max-height: 300px; overflow: auto;
  }

  /* ---------- 右：待办 ---------- */
  .todo {
    padding: 8px 12px; border-bottom: 1px solid #23272e; cursor: pointer;
    border-left: 2px solid var(--warn);
  }
  .todo:hover { background: #1b1f25; }
  .todo.plan_review { border-left-color: var(--accent); }
  .todo .tt { font-size: 12px; margin-bottom: 2px; }
  .todo .td { font-size: 11px; color: var(--fg-faint); overflow: hidden;
              text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2;
              -webkit-box-orient: vertical; }
  .todo .ta { margin-top: 5px; display: flex; gap: 4px; }
  .empty { padding: 24px 16px; color: var(--fg-faint); font-size: 12px; text-align: center; }

  /* ---------- 新建任务 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 20;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 8px;
    width: min(560px, 92vw); padding: 18px 20px;
  }
  .modal h3 { margin: 0 0 12px; font-size: 14px; }
  .modal .field { margin-bottom: 10px; }
  .modal label { display: block; font-size: 11px; color: var(--fg-faint); margin-bottom: 3px; }
  .modal input, .modal textarea { width: 100%; }
  .modal textarea { min-height: 84px; resize: vertical; font-family: inherit; }
  .modal .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #2b3038; border: 1px solid #3c434c; color: var(--fg);
    padding: 7px 14px; border-radius: 5px; font-size: 12px; opacity: 0;
    transition: opacity .18s; pointer-events: none; z-index: 30;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: #5f3129; color: #f0b3ac; }
</style>
</head>
<body>

<header>
  <h1>Cabinet</h1>
  <span class="meta"><span class="dot" id="connDot"></span><span id="connText">连接中</span></span>
  <span class="meta" id="hubMeta"></span>
  <span class="spacer"></span>
  <button class="primary" id="btnNew">+ 新任务</button>
</header>

<main>
  <section>
    <div class="sec-head">任务 <span class="count" id="taskCount"></span></div>
    <div class="scroll" id="tree"><div class="empty">还没任务</div></div>
  </section>

  <section>
    <div class="sec-head">详情 <span class="count" id="detailId"></span></div>
    <div class="scroll" id="detail"><div class="empty">左边选一个任务</div></div>
  </section>

  <section>
    <div class="sec-head">等你处理 <span class="count" id="todoCount"></span></div>
    <div class="scroll" id="todos"><div class="empty">没有待办</div></div>
  </section>
</main>

<div class="modal-mask" id="modal">
  <div class="modal">
    <h3>新建任务</h3>
    <div class="field">
      <label>要做什么</label>
      <input id="fTitle" placeholder="一句话说清">
    </div>
    <div class="field">
      <label>细节（可选）</label>
      <textarea id="fBody" placeholder="补充说明、验收标准…"></textarea>
    </div>
    <div class="field">
      <label>工作目录</label>
      <input id="fCwd" value="D:/WorkFiles/code/04_own_github/han_kl">
    </div>
    <div class="btns">
      <button id="btnCancel">取消</button>
      <button class="primary" id="btnCreate">创建</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const S = {
  tasks: [], todos: [], groups: [], projects: [], stats: null,
  selected: null, detail: null,
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let toastTimer = null;
function toast(msg, isErr) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 2200);
}

function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const p = (n) => String(n).padStart(2, '0');
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtDur(ms) {
  if (ms == null) return '-';
  if (ms < 1000) return Math.round(ms) + 'ms';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  const m = Math.floor(s / 60);
  return m + 'm' + Math.round(s % 60) + 's';
}
function badge(st) {
  return '<span class="badge ' + esc(st) + '">' + esc(st) + '</span>';
}

function buttonHtml(label, cls, pre, id, post) {
  return '<button class="' + cls + '" onclick="' + pre + esc(id) + post + '">' + label + '</button>';
}

const STATUS_ORDER = ['running', 'review', 'ready', 'awaiting_plan', 'queued',
                      'inbox', 'done', 'failed', 'rejected', 'interrupted'];

/* ---------------- 拉数据 ---------------- */

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

async function loadState() {
  try {
    const d = await api('/api/tasks/state');
    S.tasks = d.tasks || [];
    S.todos = d.todos || [];
    S.groups = d.groups || [];
    S.projects = d.projects || [];
    S.stats = d.stats || null;
    $('connDot').className = 'dot';
    $('connText').textContent = '已连接';
    if (S.stats) {
      $('hubMeta').textContent = '共 ' + S.stats.total + ' 个任务 · ' +
        (S.stats.running || 0) + ' 个在跑';
    }
    renderTree();
    renderTodos();
  } catch (err) {
    $('connDot').className = 'dot off';
    $('connText').textContent = '断开';
  }
}

async function loadDetail(id) {
  if (!id) return;
  try {
    const d = await api('/api/tasks/' + encodeURIComponent(id) + '?messages=200');
    S.detail = d;
    renderDetail();
  } catch (err) {
    toast('读详情失败: ' + err.message, true);
  }
}

/* ---------------- 左：任务树 ---------------- */

function renderTree() {
  const root = $('tree');
  $('taskCount').textContent = S.tasks.length ? '(' + S.tasks.length + ')' : '';

  if (S.tasks.length === 0) {
    root.innerHTML = '<div class="empty">还没任务<br><br>' +
      '点右上角「+ 新任务」，<br>或在飞书发一句话</div>';
    return;
  }

  // 按项目分组；无项目归到「未分组」
  const byProject = new Map();
  for (const t of S.tasks) {
    const pid = t.project_id || '_none';
    if (!byProject.has(pid)) byProject.set(pid, []);
    byProject.get(pid).push(t);
  }

  let html = '';
  for (const [pid, list] of byProject) {
    const proj = S.projects.find((p) => p.id === pid);
    const name = proj ? proj.name : '未分组';
    // 只显示顶层任务，子任务挂到下面
    const tops = list.filter((t) => !t.parent_id);
    const kids = new Map();
    for (const t of list) {
      if (!t.parent_id) continue;
      if (!kids.has(t.parent_id)) kids.set(t.parent_id, []);
      kids.get(t.parent_id).push(t);
    }

    html += '<div class="tree-label">' + esc(name) + '</div>';
    const ordered = tops.sort((a, b) => {
      const d = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
      return d !== 0 ? d : b.priority - a.priority;
    });
    for (const t of ordered) {
      html += taskRow(t, false);
      for (const c of (kids.get(t.id) || [])) html += taskRow(c, true);
    }
  }
  root.innerHTML = html;

  root.querySelectorAll('.tree-item').forEach((el) => {
    el.onclick = () => select(el.dataset.id);
  });
}

function taskRow(t, isChild) {
  const sel = S.selected === t.id ? ' sel' : '';
  const cls = 'tree-item' + sel + (isChild ? ' child' : '');
  const pri = t.priority > 0 ? '<span class="badge pri">P' + t.priority + '</span>' : '';
  const wait = t.depsWaiting > 0 ? '<span class="n">等' + t.depsWaiting + '</span>' : '';
  return '<div class="' + cls + '" data-id="' + esc(t.id) + '">' +
    '<span class="t">' + esc(t.title) + '</span>' +
    pri + wait + badge(t.status) +
    '</div>';
}

function select(id) {
  S.selected = id;
  renderTree();
  $('detailId').textContent = id.slice(0, 12);
  $('detail').innerHTML = '<div class="empty">读取中…</div>';
  loadDetail(id);
}

/* ---------------- 中：详情 ---------------- */

function renderDetail() {
  const d = S.detail;
  const root = $('detail');
  if (!d || !d.task) { root.innerHTML = '<div class="empty">左边选一个任务</div>'; return; }
  const t = d.task;

  let h = '<div class="detail">';
  h += '<h2>' + esc(t.title) + '</h2>';
  h += '<div class="sub">' + esc(t.id) + ' · ' + esc(t.source || '-') + ' · ' + fmtTime(t.created_at) + '</div>';

  h += '<div class="kv">';
  h += '<dt>状态</dt><dd>' + badge(t.status) +
       (t.status === 'running' ? ' <span class="badge">第' + (t.attempt || 1) + '次</span>' : '') + '</dd>';
  h += '<dt>agent</dt><dd>' + esc(t.agent || '-') + (t.model ? ' · ' + esc(t.model) : '') + '</dd>';
  h += '<dt>cwd</dt><dd>' + esc(t.cwd || '-') + '</dd>';
  if (t.effect) h += '<dt>副作用</dt><dd>' + esc(t.effect) + '</dd>';
  if (t.session_id) h += '<dt>会话</dt><dd>' + esc(t.session_id) + '</dd>';
  h += '<dt>耗时</dt><dd>' + fmtDur(t.duration_ms) + '</dd>';
  if (t.attempt > 0) h += '<dt>尝试</dt><dd>' + t.attempt + ' / ' + t.max_attempts + '</dd>';
  h += '</div>';

  // 依赖
  if (t.deps && t.deps.length) {
    h += '<div style="font-size:11px;color:var(--fg-faint);margin-top:10px">前置依赖</div>';
    h += '<div class="deps">';
    for (const dp of t.deps) {
      const ok = dp.status === 'done';
      h += '<div class="dep ' + (ok ? 'ok' : 'waiting') + '">' +
        '<span class="dot2"></span>' + esc(dp.title) + ' · ' + esc(dp.status) + '</div>';
    }
    h += '</div>';
  }

  // 子任务
  if (t.children && t.children.length) {
    h += '<div style="font-size:11px;color:var(--fg-faint);margin-top:10px">子任务</div>';
    for (const c of t.children) {
      h += '<div class="tree-item" style="padding-left:2px" onclick="select(\'' + esc(c.id) + '\')">' +
        '<span class="t">' + esc(c.title) + '</span>' + badge(c.status) + '</div>';
    }
  }

  // 验收标准
  if (t.done_when) {
    h += '<div style="font-size:11px;color:var(--fg-faint);margin-top:12px">验收标准</div>';
    h += '<pre>' + esc(t.done_when) + '</pre>';
  }

  // 结论 / 错误
  if (t.run && t.run.last_message) {
    h += '<div style="font-size:11px;color:var(--fg-faint);margin-top:12px">结论</div>';
    h += '<pre>' + esc(t.run.last_message) + '</pre>';
  }
  if (t.run && t.run.error) {
    h += '<div style="font-size:11px;color:var(--danger);margin-top:12px">错误</div>';
    h += '<pre style="border-color:#4d2925">' + esc(t.run.error) + '</pre>';
  }

  // 操作
  h += '<div class="actions">';
  if (t.status === 'review') {
    h += '<input id="noteInput" placeholder="批注（可选）">';
    h += '<button class="primary" onclick="act(\'' + esc(t.id) + '\',\'approve\')">确认完成</button>';
    h += '<button class="danger" onclick="act(\'' + esc(t.id) + '\',\'reject\')">驳回</button>';
  }
  if (t.status === 'awaiting_plan') {
    h += buttonHtml('放行这个拆解', 'primary', "planAct('", t.id, "','approve')");
    h += buttonHtml('整个驳回', 'danger', "planAct('", t.id, "','reject')");
  }
  if (['failed', 'rejected', 'interrupted', 'done'].includes(t.status)) {
    h += '<button onclick="act(\'' + esc(t.id) + '\',\'rerun\')">重跑</button>';
  }
  h += '<span style="font-size:11px;color:var(--fg-faint)">优先级</span>';
  h += '<input id="priInput" type="number" value="' + (t.priority || 0) + '" style="width:64px">';
  h += '<button class="sm" onclick="setPri(\'' + esc(t.id) + '\')">改</button>';
  h += '</div>';

  // 群消息流
  if (d.groups && d.groups.length) {
    for (const g of d.groups) {
      if (!g.messages || g.messages.length === 0) continue;
      h += '<div class="msgstream">';
      h += '<div class="msg-head">' + esc(g.name) + ' <span style="color:var(--fg-faint)">' +
           g.messages.length + ' 条</span></div>';
      for (const m of g.messages) {
        h += '<div class="msg ' + esc(m.sender_kind) + '" onclick="jumpRun(\'' +
             esc(m.run_id || '') + '\')">';
        h += '<div class="who">' + esc(senderName(m)) + ' · ' + fmtTime(m.created_at) + '</div>';
        h += '<div class="body">' + esc(m.body) + '</div>';
        h += '</div>';
      }
      h += '<div class="actions"><input id="msgInput" placeholder="往这个群说一句…">' +
           '<button class="sm" onclick="sendMsg(\'' + esc(g.id) + '\')">发送</button></div>';
      h += '</div>';
    }
  }

  // 时间线
  if (t.timeline && t.timeline.length) {
    h += '<div class="tl"><div class="msg-head">时间线</div>';
    for (const e of t.timeline) {
      h += '<div class="tl-item"><span class="when">' + fmtTime(e.at) + '</span>' +
           '<span class="act">' + esc(e.action) + '</span>' +
           '<span style="flex:1">' + esc(String(e.detail || '').slice(0, 120)) + '</span></div>';
    }
    h += '</div>';
  }

  // 日志路径
  if (t.log_path) {
    h += '<div style="font-size:11px;color:var(--fg-faint);margin-top:12px">日志</div>';
    h += '<pre>' + esc(t.log_path) + '</pre>';
  }

  h += '</div>';
  root.innerHTML = h;
}

function senderName(m) {
  if (m.sender_kind === 'human') return '我';
  if (m.sender_kind === 'system') return '系统';
  return '会话 ' + String(m.sender_id || '').slice(0, 8);
}

/* ---------------- 右：待办 ---------------- */

function renderTodos() {
  const root = $('todos');
  $('todoCount').textContent = S.todos.length ? '(' + S.todos.length + ')' : '';
  if (S.todos.length === 0) {
    root.innerHTML = '<div class="empty">没有待办<br><br>Agent 需要你拍板时会出现在这里</div>';
    return;
  }
  let h = '';
  for (const t of S.todos) {
    const kindCls = t.kind === 'failed' ? ' failed' : (t.kind === 'plan_review' ? ' plan_review' : '');
    const kindName = { decision: '等决策', failed: '失败了', plan_review: '等审拆解',
                       approval: '等审批' }[t.kind] || t.kind;
    h += '<div class="todo' + kindCls + '">';
    h += '<div class="tt">' + esc(t.title) + '</div>';
    h += '<div class="td">' + esc(kindName) + (t.detail ? ' · ' + esc(String(t.detail).slice(0, 80)) : '') + '</div>';
    h += '<div class="ta">';
    if (t.kind === 'decision' || t.kind === 'plan_review') {
      h += '<button class="primary sm" onclick="todoAct(\'' + esc(t.id) + '\',\'' +
           esc(t.task_id || '') + '\',\'approve\')">通过</button>';
      h += '<button class="danger sm" onclick="todoAct(\'' + esc(t.id) + '\',\'' +
           esc(t.task_id || '') + '\',\'reject\')">驳回</button>';
    }
    if (t.task_id) {
      h += '<button class="sm" onclick="select(\'' + esc(t.task_id) + '\')">去看看</button>';
    }
    h += '</div></div>';
  }
  root.innerHTML = h;
}

async function todoAct(todoId, taskId, verb) {
  try {
    if (taskId) {
      await api('/api/tasks/' + encodeURIComponent(taskId) + '/' + verb, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ note: '面板操作' }),
      });
    }
    await api('/api/todos/' + encodeURIComponent(todoId) + '/resolve', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ resolution: verb }),
    }).catch(() => null);
    toast(verb === 'approve' ? '已通过' : '已驳回');
    await loadState();
    if (S.selected) await loadDetail(S.selected);
  } catch (err) {
    toast(err.message, true);
  }
}

/* ---------------- 操作 ---------------- */

async function act(taskId, verb) {
  const noteEl = $('noteInput');
  const note = noteEl ? noteEl.value : '';
  try {
    await api('/api/tasks/' + encodeURIComponent(taskId) + '/' + verb, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ note: note || null }),
    });
    toast('已' + ({ approve: '确认', reject: '驳回', rerun: '重跑' }[verb] || verb));
    await loadState();
    await loadDetail(taskId);
  } catch (err) {
    toast(err.message, true);
  }
}

async function planAct(taskId, verb) {
  try {
    await api('/api/tasks/' + encodeURIComponent(taskId) + '/plan/' + verb, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({}),
    });
    toast(verb === 'approve' ? '已放行' : '已驳回');
    await loadState();
    await loadDetail(taskId);
  } catch (err) { toast(err.message, true); }
}

async function setPri(taskId) {
  const el = $('priInput');
  if (!el) return;
  try {
    await api('/api/tasks/' + encodeURIComponent(taskId) + '/priority', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ priority: Number(el.value) || 0 }),
    });
    toast('优先级已改');
    await loadState();
    await loadDetail(taskId);
  } catch (err) {
    toast(err.message, true);
  }
}

async function sendMsg(groupId) {
  const el = $('msgInput');
  if (!el || !el.value.trim()) return;
  try {
    await api('/api/groups/' + encodeURIComponent(groupId) + '/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ body: el.value.trim() }),
    });
    el.value = '';
    toast('已发送');
    if (S.selected) await loadDetail(S.selected);
  } catch (err) {
    toast(err.message, true);
  }
}

function jumpRun(runId) {
  if (!runId) return;
  toast('这条消息来自 ' + runId.slice(0, 14));
}

/* ---------------- 新建任务 ---------------- */

$('btnNew').onclick = () => {
  $('modal').className = 'modal-mask show';
  setTimeout(() => $('fTitle').focus(), 50);
};
$('btnCancel').onclick = () => { $('modal').className = 'modal-mask'; };
$('modal').onclick = (e) => {
  if (e.target === $('modal')) $('modal').className = 'modal-mask';
};
$('btnCreate').onclick = async () => {
  const title = $('fTitle').value.trim();
  if (!title) { toast('说说要干什么', true); return; }
  try {
    const d = await api('/api/tasks', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        title: title,
        body: $('fBody').value.trim() || null,
        cwd: $('fCwd').value.trim() || null,
      }),
    });
    $('modal').className = 'modal-mask';
    $('fTitle').value = '';
    $('fBody').value = '';
    toast('任务已创建');
    await loadState();
    if (d.id) select(d.id);
  } catch (err) {
    toast(err.message, true);
  }
};

/* ---------------- 轮询 ---------------- */

let pollTimer = null;
async function poll() {
  await loadState();
  if (S.selected) await loadDetail(S.selected);
}

loadState().then(() => {
  if (S.tasks.length > 0 && !S.selected) select(S.tasks[0].id);
});
pollTimer = setInterval(poll, 3000);
</script>
</body>
</html>
