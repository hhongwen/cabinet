appId: app.cabinet.task-inbox
productName: Cabinet
directories:
  output: release
files:
  - electron/**
  - task-inbox/**/*.mjs
  - "!task-inbox/test-*.mjs"
  - "!task-inbox/style-audit.mjs"
  - task-inbox/board.html
  - task-inbox/manifest.json
  - task-inbox/icons/**
  - package.json
asar: true
extraResources:
  - from: task-inbox/icons
    to: icons
win:
  target:
    - nsis
  icon: task-inbox/icons/cabinet-dark.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
  icon: task-inbox/icons/cabinet-1024.png
  category: public.app-category.productivity
