<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务看板</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --card:#1e222b; --card-hover:#242935;
    --text:#e6e8ee; --muted:#8b93a7; --line:#262b36;
    --p0:#ef4444; --p1:#f59e0b; --p2:#3b82f6; --p3:#64748b;
    --todo:#60a5fa; --doing:#fbbf24; --done:#4ade80; --p4:#4b5563;
    --cap-w: 340px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --card:#fff; --card-hover:#f9fafb;
           --text:#111827; --muted:#6b7280; --line:#e5e7eb; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); overflow:hidden;
    font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }

  /* ---------- 整体：左看板 + 分隔条 + 右随手记 ---------- */
  .app{display:flex; height:100vh; overflow:hidden}

  .board-area{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden}

  .splitter{
    flex:0 0 6px; cursor:col-resize; position:relative; background:transparent;
    transition:background .12s;
  }
  .splitter::after{
    content:''; position:absolute; left:2px; top:0; bottom:0; width:2px;
    background:var(--line); transition:background .12s;
  }
  .splitter:hover::after, .splitter.dragging::after{background:var(--todo)}
  .splitter.dragging{background:rgba(96,165,250,.08)}

  .capture{
    flex:0 0 var(--cap-w); width:var(--cap-w); min-width:0;
    display:flex; flex-direction:column; overflow:hidden;
    background:var(--panel); border-left:1px solid var(--line);
    transition:flex-basis .16s ease, width .16s ease;
  }
  .app.resizing .capture{transition:none}
  .app.collapsed .capture{flex-basis:0; width:0; border-left:none}
  .app.collapsed .splitter{flex-basis:0; cursor:default; pointer-events:none}
  .app.collapsed .splitter::after{display:none}

  .cap-head{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:12px 14px 10px; border-bottom:1px solid var(--line);
  }
  .cap-head b{font-size:13px; font-weight:600}
  .cap-head .dot{width:7px;height:7px;border-radius:50%;background:var(--todo)}
  .cap-head .spacer{flex:1}
  .icon-btn{
    border:1px solid var(--line); background:transparent; color:var(--muted);
    border-radius:7px; width:26px; height:26px; display:grid; place-items:center;
    cursor:pointer; font-size:13px; padding:0; line-height:1;
  }
  .icon-btn:hover{color:var(--text); background:var(--card-hover)}

  .cap-body{flex:1; display:flex; flex-direction:column; gap:9px; padding:12px 14px; min-height:0}
  .cap-body textarea{
    flex:1; width:100%; min-height:80px; resize:none;
    font:inherit; font-size:14px; line-height:1.55; color:var(--text);
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; outline:none;
  }
  .cap-body textarea:focus{border-color:var(--todo)}
  .cap-body textarea::placeholder{color:var(--muted); opacity:.7}

  .thumbs{display:flex; gap:7px; flex-wrap:wrap; flex:0 0 auto}
  .thumb{position:relative; width:52px; height:52px; border-radius:7px; overflow:hidden; border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{
    position:absolute; top:2px; right:2px; width:15px; height:15px; border-radius:50%;
    border:0; background:rgba(0,0,0,.65); color:#fff; font-size:10px; line-height:1;
    cursor:pointer; padding:0; display:grid; place-items:center;
  }

  .cap-row{display:flex; gap:6px; align-items:center; flex:0 0 auto; flex-wrap:wrap}
  .cap-row select, .cap-row input[type=text]{
    font:inherit; font-size:12px; color:var(--text); background:var(--bg);
    border:1px solid var(--line); border-radius:7px; padding:5px 7px; cursor:pointer;
    min-width:0;
  }
  .cap-row input[type=text]{cursor:text; width:78px}
  .cap-row select{flex:1}
  .cap-row .go{
    font:inherit; font-size:12.5px; font-weight:600; color:#0b1020; background:var(--todo);
    border:0; border-radius:7px; padding:7px 14px; cursor:pointer; white-space:nowrap;
  }
  .cap-row .go:disabled{opacity:.4; cursor:default}
  .cap-msg{font-size:11.5px; min-height:15px; color:var(--muted); flex:0 0 auto}
  .cap-msg.ok{color:var(--done)}
  .cap-msg.err{color:var(--p0)}

  /* 收起后的悬浮按钮 */
  .reopen{
    position:fixed; right:10px; bottom:14px; z-index:60;
    display:none; align-items:center; gap:5px;
    font:inherit; font-size:12.5px; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:999px; padding:7px 13px;
    cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.22);
  }
  .reopen:hover{background:var(--card-hover)}
  .app.collapsed ~ .reopen{display:inline-flex}

  /* ---------- 看板 ---------- */
  header.top{
    flex:0 0 auto; background:var(--bg);
    border-bottom:1px solid var(--line); padding:14px 18px 10px;
  }
  .top-line{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  h1{font-size:15.5px; margin:0; font-weight:600; letter-spacing:.2px}
  .count{color:var(--muted); font-size:12px}
  .spacer{flex:1}
  .filters{display:flex; gap:7px; flex-wrap:wrap; margin-top:11px}
  select,button{font-family:inherit}
  .filters select{
    font-size:12.5px; color:var(--text); background:var(--panel);
    border:1px solid var(--line); border-radius:7px; padding:5px 9px; cursor:pointer;
  }
  .filters select:hover{background:var(--card-hover)}

  .board-scroll{flex:1; overflow:auto; padding:14px 18px 32px}
  .board{display:grid; grid-template-columns:repeat(3,minmax(240px,1fr)); gap:14px; align-items:start}
  @media (max-width:820px){ .board{grid-template-columns:1fr} }

  .col{background:var(--panel); border:1px solid var(--line); border-radius:11px; display:flex; flex-direction:column; min-height:110px}
  .col-head{display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line)}
  .col .dot{width:7px;height:7px;border-radius:50%}
  .col-title{font-size:12.5px; font-weight:600}
  .col-num{margin-left:auto; font-size:11.5px; color:var(--muted); background:var(--card); border-radius:999px; padding:1px 7px}
  .col-body{padding:9px; display:flex; flex-direction:column; gap:7px; min-height:54px}
  .col.drag-over .col-body{background:rgba(96,165,250,.07); border-radius:0 0 11px 11px}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:9px 10px 8px 13px; cursor:grab; position:relative; overflow:hidden;
    transition:background .12s, transform .08s;
  }
  .card:hover{background:var(--card-hover)}
  .card:active{cursor:grabbing; transform:scale(.995)}
  .card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--bar,var(--p3))}
  .card .t{font-size:13px; line-height:1.45; word-break:break-word}
  .card.done .t{color:var(--muted); text-decoration:line-through; text-decoration-color:rgba(139,147,167,.5)}
  .meta{display:flex; align-items:center; gap:5px; margin-top:6px; flex-wrap:wrap}
  .tag{font-size:10.5px; padding:1px 6px; border-radius:999px; background:rgba(139,147,167,.14); color:var(--muted)}
  .tag.cat{color:var(--text); background:rgba(96,165,250,.14)}
  .kind{font-size:10.5px; color:var(--muted); opacity:.8}
  .time{font-size:10.5px; color:var(--muted); opacity:0; transition:opacity .12s; margin-left:auto}
  .card:hover .time{opacity:.75}
  .empty{color:var(--muted); font-size:12px; text-align:center; padding:14px 0; opacity:.7}

  .thumb.file{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); gap:1px; position:relative;
  }
  .thumb.file .fext{font-size:9.5px; font-weight:700; color:var(--muted); letter-spacing:.4px}
  .thumb.file small{font-size:9px; color:var(--muted); opacity:.8}
  .tag.pending{color:var(--doing); background:rgba(251,191,36,.15)}
  .tag.failed{color:var(--p0); background:rgba(239,68,68,.15)}
  .files{font-size:10.5px; color:var(--muted); margin-top:6px; opacity:.85}

  .shots{display:flex; gap:5px; margin-top:7px; flex-wrap:wrap}
  .shots img{width:50px;height:50px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
  .shots img:hover{outline:1px solid var(--todo)}

  .dlg h2{margin:0 0 14px; font-size:15px; font-weight:600}
  .dlg .field{margin-bottom:12px}
  .dlg .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  .dlg select,.dlg input[type=text],.dlg input:not([type]){
    width:100%; font:inherit; font-size:13px; color:var(--text); background:var(--bg);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  }
  .dlg .hint{font-size:11px; color:var(--muted); margin-top:5px; line-height:1.5}
  .dlg .dlg-foot{display:flex; gap:8px; justify-content:flex-end; margin-top:16px}
  .dlg button{font:inherit; font-size:13px; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:7px 15px; cursor:pointer}
  .dlg button.primary{background:var(--todo); color:#0b1020; border-color:transparent; font-weight:600}
  #cfg{border:1px solid var(--line); background:var(--panel); color:var(--text);
    border-radius:14px; padding:0; width:min(400px,92vw)}
  #cfg::backdrop{background:rgba(0,0,0,.5)}
  .badge-need{font-size:10.5px; padding:1px 6px; border-radius:999px;
    background:rgba(245,158,11,.18); color:var(--doing); cursor:pointer}
  .proj-list{max-height:240px; overflow:auto; border:1px solid var(--line); border-radius:9px; margin-bottom:10px}
  .proj-row{display:flex; align-items:center; gap:8px; padding:9px 10px; border-bottom:1px solid var(--line); cursor:pointer}
  .proj-row:last-child{border-bottom:none}
  .proj-row:hover{background:var(--card-hover)}
  .proj-row .pn{font-size:13px}
  .proj-row .pc{margin-left:auto; font-size:11px; color:var(--muted)}
  .proj-row .dirs{font-size:10.5px; color:var(--muted); margin-top:2px}
  .proj-edit{border:1px solid var(--line); border-radius:9px; padding:10px; margin-bottom:10px}
  .dir-row{display:flex; gap:6px; align-items:center; margin-bottom:6px}
  .dir-row input{flex:1; min-width:0}
  .dir-row .rm{border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:13px}
  .mini{font-size:11.5px; border:1px dashed var(--line); background:transparent;
    color:var(--muted); border-radius:7px; padding:5px 9px; cursor:pointer; width:100%}
  .mini:hover{color:var(--text); border-color:var(--todo)}
  #lightbox{position:fixed; inset:0; background:rgba(0,0,0,.82); display:none; place-items:center; z-index:99; cursor:zoom-out}
  #lightbox.on{display:grid}
  #lightbox img{max-width:92vw; max-height:92vh; border-radius:8px}

  .toast{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(8px);
    background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:8px 15px; font-size:12.5px; opacity:0; pointer-events:none; transition:.18s; z-index:80;
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

  .drop{position:fixed; inset:0; background:rgba(96,165,250,.12); border:2px dashed var(--todo);
        display:none; place-items:center; font-size:14.5px; z-index:90}
  .drop.on{display:grid}

  /* 单独打开随手记时（?solo=1）：隐藏看板 */
  body.solo .board-area{display:none}
  body.solo .splitter{display:none}
  body.solo .capture{flex:1; width:auto; border-left:none}
  body.solo .cap-head .collapse{display:none}
  body.solo .reopen{display:none !important}
</style>
</head>
<body>

<div class="app" id="app">

  <main class="board-area">
    <header class="top">
      <div class="top-line">
        <h1>全部任务</h1>
        <span class="count" id="total"></span>
        <span class="spacer"></span>
        <button class="icon-btn" id="settingsBtn" title="设置">⚙</button>
        <button class="icon-btn" id="focusCapture" title="记一条（n）">+</button>
      </div>
      <div class="filters">
        <select id="project"><option value="">全部项目</option></select>
        <select id="priority">
          <option value="">全部优先级</option>
          <option value="p0">紧急重要</option>
          <option value="p1">重要</option>
          <option value="p2">紧急</option>
          <option value="p3">普通</option>
        </select>
        <select id="category"><option value="">全部类别</option></select>
      </div>
    </header>

    <div class="board-scroll">
      <div class="board" id="board"></div>
    </div>
  </main>

  <div class="splitter" id="splitter" title="拖动调整宽度 · 双击复位"></div>

  <aside class="capture" id="capture">
    <div class="cap-head">
      <span class="dot"></span>
      <b>随手记</b>
      <span class="spacer"></span>
      <button class="icon-btn collapse" id="collapseBtn" title="收起">»</button>
    </div>
    <div class="cap-body">
      <textarea id="text" placeholder="想到什么丢进来，截图、文件、链接都行&#10;Enter 存下 · Shift+Enter 换行"></textarea>
      <div class="thumbs" id="thumbs"></div>
      <div class="cap-row">
        <span class="spacer"></span>
        <button class="icon-btn" id="attachBtn" title="添加附件">📎</button>
        <button class="go" id="go" disabled>存下</button>
      </div>
      <div class="cap-msg" id="msg"></div>
      <input type="file" id="fileInput" multiple hidden>
    </div>
  </aside>
</div>

<button class="reopen" id="reopen">📝 随手记</button>

<dialog id="cfg">
  <form class="dlg" id="cfgForm" method="dialog">
    <h2>设置</h2>

    <div class="field">
      <label>模型通道</label>
      <select id="c-backend">
        <option value="auto">自动（magpie → alma → cli）</option>
        <option value="magpie">magpie 网关</option>
        <option value="alma">Alma</option>
        <option value="opencode">opencode CLI</option>
        <option value="codex">codex CLI</option>
      </select>
      <div class="hint" id="backendHint"></div>
    </div>

    <div class="field">
      <label>模型</label>
      <input id="c-model" list="modelList" placeholder="auto/deepseek-v4.1-flash" autocomplete="off">
      <datalist id="modelList"></datalist>
      <div class="hint" id="modelHint"></div>
    </div>

    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="c-classify" style="width:auto">
        收下时自动判断类型和优先级
      </label>
    </div>

    <div class="field">
      <label>项目</label>
      <div class="proj-list" id="projList"></div>
      <button type="button" class="mini" id="newProjectBtn">+ 新建项目</button>
    </div>

    <div class="dlg-foot">
      <button type="button" id="cfgCancel">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="projDlg">
  <form class="dlg" id="projForm" method="dialog">
    <h2 id="projTitle">项目</h2>

    <div class="field">
      <label>名称</label>
      <input id="p-name" placeholder="诺华-数据分析平台" autocomplete="off">
    </div>

    <div class="field">
      <label>别名（逗号分隔，用于自动判断）</label>
      <input id="p-aliases" placeholder="诺华, novartis, NVRP" autocomplete="off">
    </div>

    <div class="field">
      <label>源目录</label>
      <div id="dirList"></div>
      <button type="button" class="mini" id="addDir">+ 添加目录</button>
    </div>

    <div class="dlg-foot">
      <button type="button" id="projDelete" style="margin-right:auto;color:var(--p0)">删除</button>
      <button type="button" id="projCancel">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<div id="lightbox"><img alt=""></div>
<div class="drop" id="drop">松手就收进来</div>
<div class="toast" id="toast"></div>

<script>
const COLS = [
  { key:'todo',  label:'未开始', color:'var(--todo)' },
  { key:'doing', label:'进行中', color:'var(--doing)' },
  { key:'done',  label:'已完成', color:'var(--done)' }
];
const PRI_LABEL = { p0:'P0 阻塞', p1:'P1 紧急', p2:'P2 常规', p3:'P3 低', p4:'P4 待定' };
const PRI_COLOR = { p0:'var(--p0)', p1:'var(--p1)', p2:'var(--p2)', p3:'var(--p3)', p4:'var(--p4)' };
const KIND_LABEL = { text:'文字', image:'图片', image_text:'图文', link:'链接', file:'附件', mixed:'混合' };
const KIND_ICON = { text:'', image:'🖼', image_text:'🖼', link:'🔗', file:'📎', mixed:'📎' };

const SOLO = new URLSearchParams(location.search).has('solo');
const LS_W = 'ti.captureWidth';
const LS_C = 'ti.captureCollapsed';

let store = { projects:['默认'], tasks:[], counts:{}, total:0 };
let filters = { project:'', priority:'', category:'' };
let collapsed = false;

const $ = s => document.querySelector(s);

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));
}

function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 1600);
}

function ago(iso){
  if(!iso) return '';
  const d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60) + ' 分钟前';
  if (d < 86400) return Math.floor(d/3600) + ' 小时前';
  if (d < 86400*30) return Math.floor(d/86400) + ' 天前';
  return new Date(iso).toLocaleDateString();
}

function imgUrl(p){
  if (!p) return '';
  if (/^https?:/i.test(p)) return p;
  const name = String(p).split(/[\\/]/).pop();
  return '/images/' + encodeURIComponent(name);
}

/* ---------------- 布局：宽度 / 收起 ---------------- */

function applyWidth(px){
  const max = Math.max(260, Math.round(window.innerWidth * 0.6));
  const w = Math.min(Math.max(240, px), max);
  document.documentElement.style.setProperty('--cap-w', w + 'px');
  return w;
}

function initLayout(){
  if (SOLO) { document.body.classList.add('solo'); return; }

  const savedW = Number(localStorage.getItem(LS_W));
  if (savedW > 0) applyWidth(savedW);

  collapsed = localStorage.getItem(LS_C) === '1';
  $('#app').classList.toggle('collapsed', collapsed);

  const splitter = $('#splitter');
  let dragging = false;

  const onMove = (e) => {
    if (!dragging) return;
    const x = e.clientX ?? e.touches?.[0]?.clientX;
    if (x == null) return;
    const w = applyWidth(window.innerWidth - x);
    localStorage.setItem(LS_W, String(w));
  };
  const stop = () => {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    $('#app').classList.remove('resizing');
    document.body.style.cursor = '';
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', stop);
  };

  splitter.addEventListener('mousedown', (e) => {
    if (collapsed) return;
    e.preventDefault();
    dragging = true;
    splitter.classList.add('dragging');
    $('#app').classList.add('resizing');
    document.body.style.cursor = 'col-resize';
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', stop);
  });

  splitter.addEventListener('dblclick', () => {
    applyWidth(340);
    localStorage.setItem(LS_W, '340');
    toast('宽度已复位');
  });

  window.addEventListener('resize', () => {
    const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cap-w'), 10);
    if (cur > 0) applyWidth(cur);
  });
}

function setCollapsed(v){
  collapsed = v;
  $('#app').classList.toggle('collapsed', v);
  localStorage.setItem(LS_C, v ? '1' : '0');
  if (!v) setTimeout(() => $('#text')?.focus(), 180);
}

/* ---------------- 看板 ---------------- */

function matches(t){
  if (filters.project && t.project !== filters.project) return false;
  if (filters.priority && t.priority !== filters.priority) return false;
  if (filters.category && t.category !== filters.category) return false;
  return true;
}

function cardHTML(t){
  const meta = [];
  meta.push(`<span class="tag" style="color:${PRI_COLOR[t.priority] || 'var(--muted)'};background:${(PRI_COLOR[t.priority]||'#666')}22">${PRI_LABEL[t.priority] || '普通'}</span>`);
  if (t.category) meta.push(`<span class="tag cat">${esc(t.category)}</span>`);
  if (t.project && t.project !== '默认') meta.push(`<span class="tag">${esc(t.project)}</span>`);
  if (t.kind && t.kind !== 'text') meta.push(`<span class="kind">${KIND_LABEL[t.kind] || ''}</span>`);
  const shots = (t.payload && t.payload.images && t.payload.images.length)
    ? '<div class="shots">' + t.payload.images.slice(0, 4).map(src => `<img src="${esc(imgUrl(src))}" alt="" loading="lazy">`).join('') + '</div>'
    : '';
  const fileCount = (t.payload && t.payload.files && t.payload.files.length) || 0;
  const fileRow = fileCount
    ? `<div class="files">📎 ${fileCount} 个附件</div>` : '';
  const cls = t.classify_state === 'pending'
    ? '<span class="tag pending">判断中…</span>'
    : t.classify_state === 'failed'
      ? `<span class="tag failed" title="${esc(t.classify_reason||'')}">未判断</span>` : '';
  const needProj = t.needs_project
    ? '<span class="badge-need" data-assign="' + t.id + '">选项目</span>' : '';
  return `
    <div class="card ${t.status === 'done' ? 'done' : ''}" draggable="true" data-id="${t.id}"
         style="--bar:${PRI_COLOR[t.priority] || 'var(--p3)'}">
      <div class="t">${esc(t.title)}</div>
      <div class="meta">${meta.join('')}${needProj}${cls}<span class="time">${ago(t.created_at)}</span></div>
      ${shots}${fileRow}
    </div>`;
}

function render(){
  const board = $('#board');
  board.innerHTML = COLS.map(col => {
    const items = store.tasks.filter(t => t.status === col.key && matches(t));
    return `
      <section class="col" data-col="${col.key}">
        <div class="col-head">
          <span class="dot" style="background:${col.color}"></span>
          <span class="col-title">${col.label}</span>
          <span class="col-num">${items.length}</span>
        </div>
        <div class="col-body">
          ${items.length ? items.map(cardHTML).join('') : '<div class="empty">空</div>'}
        </div>
      </section>`;
  }).join('');

  $('#total').textContent = store.total ? `${store.total} 条` : '';
  bindDrag();
}

function bindDrag(){
  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', el.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      el.style.opacity = '.4';
    });
    el.addEventListener('dragend', () => { el.style.opacity = ''; });
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', async e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const status = col.dataset.col;
      if (!id) return;
      try {
        await api('POST', `/api/tasks/${encodeURIComponent(id)}/move`, { status });
        await refresh();
        toast(status === 'done' ? '完成' : status === 'doing' ? '进行中' : '已挪回未开始');
      } catch (err) { toast('失败：' + err.message); }
    });
  });
}

async function api(method, url, body){
  const res = await fetch(url, {
    method,
    headers: body ? { 'content-type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

async function refresh(){
  store = await api('GET', '/api/state');
  syncFilters();
  render();
}

function syncFilters(){
  const proj = $('#project');
  const keep = proj.value;
  proj.innerHTML = '<option value="">全部项目</option>' +
    store.projects.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
  const names = store.projects.map(p => p.name);
  if (names.includes(keep)) proj.value = keep;

  const cats = [...new Set(store.tasks.map(t => t.category).filter(Boolean))].sort();
  const cat = $('#category');
  const keepCat = cat.value;
  cat.innerHTML = '<option value="">全部类别</option>' +
    cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if (cats.includes(keepCat)) cat.value = keepCat;


}

/* ---------------- 随手记 ---------------- */

let images = [];   // {path,url,name}
let files = [];    // {path,name,original,size}
let pending = 0;

function say(t, cls){ const el = $('#msg'); el.textContent = t; el.className = 'cap-msg ' + (cls||''); }

function refreshGo(){
  $('#go').disabled = (! $('#text').value.trim()) && !images.length && !files.length;
}

function humanSize(n){
  if (n < 1024) return n + 'B';
  if (n < 1024*1024) return Math.round(n/1024) + 'KB';
  return (n/1024/1024).toFixed(1) + 'MB';
}

function renderThumbs(){
  const parts = [];
  images.forEach((im, k) => {
    parts.push(`<div class="thumb"><img src="${esc(im.url)}" alt="">
      <button data-k="img" data-i="${k}" title="移除">✕</button></div>`);
  });
  files.forEach((f, k) => {
    parts.push(`<div class="thumb file" title="${esc(f.original || f.name)}">
      <span class="fext">${esc((f.original||'').split('.').pop()?.slice(0,4) || 'FILE')}</span>
      <small>${esc(humanSize(f.size||0))}</small>
      <button data-k="file" data-i="${k}" title="移除">✕</button></div>`);
  });
  $('#thumbs').innerHTML = parts.join('');
  $('#thumbs').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.k === 'img') images.splice(+b.dataset.i, 1);
      else files.splice(+b.dataset.i, 1);
      renderThumbs(); refreshGo();
    });
  });
  refreshGo();
}

function readAsDataUrl(f){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.readAsDataURL(f);
  });
}

// 图片走 /api/upload（会自动落到 images/），其他文件带 filename
async function uploadFile(f){
  pending++;
  try {
    const dataUrl = await readAsDataUrl(f);
    const isImage = f.type.startsWith('image/');
    const body = isImage ? { dataUrl } : { dataUrl, filename: f.name };
    const d = await api('POST', '/api/upload', body);
    if (isImage) images.push({ path: d.path, url: d.url, name: f.name });
    else files.push({ path: d.path, name: d.name, original: d.original || d.name, size: d.size || f.size });
    renderThumbs();
    return true;
  } catch (e) {
    say('上传失败：' + e.message, 'err');
    return false;
  } finally {
    pending--;
  }
}

async function submit(){
  const text = $('#text').value.trim();
  if (!text && !images.length && !files.length) return;
  if (pending) { say('还有文件正在上传…', 'err'); return; }

  // 类型和优先级都交给模型判断，这里只给个兜底标题
  const fallback = text || (images.length ? '截图' : files[0]?.original || '附件');

  const body = {
    title: fallback.split('\n')[0].slice(0, 120),
    text: text || null,
    images: images.map(i => i.path),
    files: files.map(f => f.path),
    source: 'quick'
  };

  $('#go').disabled = true;
  try {
    const t = await api('POST', '/api/tasks', body);
    $('#text').value = '';
    images = [];
    files = [];
    renderThumbs();
    refreshGo();
    say('已收下，正在判断…', 'ok');
    $('#text').focus();
    await refresh();
    watchClassify(t.id);
  } catch (err) {
    say(err.message, 'err');
    refreshGo();
  }
}

// 盯着这一条，分类完成后刷新看板
async function watchClassify(id){
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 700));
    const t = store.tasks.find(x => x.id === id);
    if (!t) { await refresh(); continue; }
    if (t.classify_state && t.classify_state !== 'pending') {
      await refresh();
      const now = store.tasks.find(x => x.id === id);
      if (now) say((PRI_LABEL[now.priority] || '') + ' · ' + (now.category || '未分类'), 'ok');
      return;
    }
  }
}

/* ---------------- 事件绑定 ---------------- */

initLayout();

$('#collapseBtn')?.addEventListener('click', () => setCollapsed(true));
$('#reopen')?.addEventListener('click', () => setCollapsed(false));
$('#focusCapture')?.addEventListener('click', () => {
  if (collapsed) setCollapsed(false);
  setTimeout(() => $('#text')?.focus(), 200);
});

$('#text').addEventListener('input', refreshGo);
$('#text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
$('#text').addEventListener('paste', async e => {
  const items = [...(e.clipboardData?.items || [])];
  const imgs = items.filter(i => i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
  const otherFiles = [...(e.clipboardData?.files || [])].filter(f => !f.type.startsWith('image/'));
  if (!imgs.length && !otherFiles.length) return;
  e.preventDefault();
  for (const f of [...imgs, ...otherFiles]) await uploadFile(f);
});
$('#go').addEventListener('click', submit);

/* ---------------- 设置面板 ---------------- */

let backendStatus = null;

async function openSettings(){
  try {
    const cfg = await api('GET', '/api/settings');
    $('#c-backend').value = cfg.backend || 'auto';
    $('#c-model').value = cfg.model || '';
    $('#c-classify').checked = cfg.classify !== false;
  } catch (e) {
    toast('读设置失败：' + e.message);
  }

  // 通道可用性
  try {
    backendStatus = await api('GET', '/api/backend');
    const up = Object.entries(backendStatus).filter(([, v]) => v).map(([k]) => k);
    $('#backendHint').textContent = up.length
      ? '当前可用：' + up.join(' · ')
      : '四条通道都不可用，任务仍能收下，但不会自动判断';
  } catch {
    $('#backendHint').textContent = '探测失败';
  }

  // 模型清单
  try {
    const m = await api('GET', '/api/models');
    const list = (m.data || []).slice();
    list.sort((a, b) => String(a.id).localeCompare(String(b.id)));
    $('#modelList').innerHTML = list
      .map((x) => `<option value="${esc(x.id)}">${esc(x.name || '')}${x.vision ? ' · 支持图片' : ''}</option>`)
      .join('');
    $('#modelHint').textContent = m.data?.length
      ? `来自 ${m.from}，共 ${m.data.length} 个模型`
      : '没有拉到模型清单';
  } catch {
    $('#modelHint').textContent = '没有拉到模型清单';
  }

  renderProjList();
  $('#cfg').showModal();
}

/* ---------------- 项目管理 ---------------- */

let editingProjectId = null;

function renderProjList(){
  const host = $('#projList');
  if (!host) return;
  host.innerHTML = (store.projects || []).map(p => {
    const dirs = (p.dirs || []).map(d => {
      const base = String(d.path || '').split(/[\\/]/).filter(Boolean).pop() || d.path;
      return base + (d.note ? '（' + d.note + '）' : '');
    }).join('、');
    return `<div class="proj-row" data-pid="${p.id}">
      <div>
        <div class="pn">${esc(p.name)}</div>
        ${dirs ? `<div class="dirs">${esc(dirs)}</div>` : ''}
      </div>
      <span class="pc">${p.taskCount || 0}</span>
    </div>`;
  }).join('') || '<div class="proj-row"><div class="pn" style="color:var(--muted)">还没有项目</div></div>';

  host.querySelectorAll('.proj-row[data-pid]').forEach(row => {
    row.addEventListener('click', () => openProjectEditor(row.dataset.pid));
  });
}

function dirRow(d = {}){
  const wrap = document.createElement('div');
  wrap.className = 'dir-row';
  wrap.innerHTML = `
    <input class="dp" placeholder="D:\\WorkFiles\\code\\xxx" value="${esc(d.path || '')}">
    <input class="dn" placeholder="说明（可选）" value="${esc(d.note || '')}" style="max-width:120px">
    <select class="dm" style="max-width:76px">
      <option value="">副</option>
      <option value="1" ${d.primary ? 'selected' : ''}>主要</option>
    </select>
    <button type="button" class="rm" title="移除">✕</button>
  `;
  wrap.querySelector('.rm').addEventListener('click', () => wrap.remove());
  return wrap;
}

function openProjectEditor(id){
  editingProjectId = id || null;
  const p = id ? (store.projects || []).find(x => x.id === id) : null;

  $('#projTitle').textContent = p ? '编辑项目' : '新建项目';
  $('#p-name').value = p?.name || '';
  $('#p-aliases').value = (p?.aliases || []).join(', ');
  $('#projDelete').style.display = p ? '' : 'none';

  const list = $('#dirList');
  list.innerHTML = '';
  const dirs = (p?.dirs || []);
  if (dirs.length) dirs.forEach(d => list.appendChild(dirRow(d)));
  else list.appendChild(dirRow({}));

  $('#projDlg').showModal();
  setTimeout(() => $('#p-name').focus(), 40);
}

$('#newProjectBtn')?.addEventListener('click', () => openProjectEditor(null));

$('#addDir')?.addEventListener('click', () => $('#dirList').appendChild(dirRow({})));
$('#projCancel')?.addEventListener('click', () => $('#projDlg').close());

$('#projForm')?.addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#p-name').value.trim();
  if (!name) { toast('项目名不能为空'); return; }

  const aliases = $('#p-aliases').value.split(',').map(x => x.trim()).filter(Boolean);
  const dirs = [...$('#dirList').querySelectorAll('.dir-row')].map(row => ({
    path: row.querySelector('.dp').value.trim(),
    note: row.querySelector('.dn').value.trim(),
    primary: row.querySelector('.dm').value === '1'
  })).filter(d => d.path);

  try {
    if (editingProjectId) await api('PATCH', '/api/projects/' + encodeURIComponent(editingProjectId), { name, aliases, dirs });
    else await api('POST', '/api/projects', { name, aliases, dirs });

    $('#projDlg').close();
    await refresh();
    renderProjList();
    toast('项目已保存');
  } catch (err) {
    toast('保存失败：' + err.message);
  }
});

$('#projDelete')?.addEventListener('click', async () => {
  if (!editingProjectId) return;
  if (!confirm('删除这个项目？它的任务会移到别的项目。')) return;
  try {
    await api('DELETE', '/api/projects/' + encodeURIComponent(editingProjectId));
    $('#projDlg').close();
    await refresh();
    renderProjList();
    toast('已删除');
  } catch (err) {
    toast('删除失败：' + err.message);
  }
});

$('#settingsBtn').addEventListener('click', openSettings);
$('#cfgCancel').addEventListener('click', () => $('#cfg').close());

$('#cfgForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    await api('POST', '/api/settings', {
      backend: $('#c-backend').value,
      model: $('#c-model').value.trim(),
      classify: $('#c-classify').checked
    });
    $('#cfg').close();
    toast('已保存，下一条任务就用新设置');
    await refresh();
  } catch (err) {
    toast('保存失败：' + err.message);
  }
});

$('#attachBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', async e => {
  for (const f of [...e.target.files]) await uploadFile(f);
  e.target.value = '';
});

$('#project').addEventListener('change', e => { filters.project = e.target.value; render(); });
$('#priority').addEventListener('change', e => { filters.priority = e.target.value; render(); });
$('#category').addEventListener('change', e => { filters.category = e.target.value; render(); });

document.addEventListener('click', async e => {
  const assign = e.target.closest('[data-assign]');
  if (assign) {
    e.stopPropagation();
    const id = assign.dataset.assign;
    const names = (store.projects || []).map(p => p.name);
    const pick = prompt('选项目（输入名字）\n可选：' + names.join('、') + '\n\n直接输入新项目名也可以：');
    if (!pick) return;
    try {
      const hit = (store.projects || []).find(p => p.name === pick || (p.aliases||[]).includes(pick));
      const body = hit ? { project_id: hit.id, project: hit.name } : { project: pick.trim(), needs_project: false };
      if (!hit) {
        const np = await api('POST', '/api/projects', { name: pick.trim() });
        body.project_id = np.id;
        body.project = np.name;
      }
      await api('PATCH', '/api/tasks/' + encodeURIComponent(id), { ...body, needs_project: false });
      await refresh();
      toast('已归到 ' + pick.trim());
    } catch (err) { toast('失败：' + err.message); }
    return;
  }

  const img = e.target.closest('.shots img');
  if (img) {
    const lb = $('#lightbox');
    lb.querySelector('img').src = img.src;
    lb.classList.add('on');
  }
});
$('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('on'));

// 拖图进窗口
let dragDepth = 0;
document.addEventListener('dragenter', e => {
  if (e.dataTransfer?.types?.includes('Files')) { e.preventDefault(); dragDepth++; $('#drop').classList.add('on'); }
});
document.addEventListener('dragleave', e => {
  if (e.dataTransfer?.types?.includes('Files')) { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); } }
});
document.addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
document.addEventListener('drop', async e => {
  const dropped = [...(e.dataTransfer?.files || [])];
  if (!dropped.length) return;
  e.preventDefault();
  dragDepth = 0;
  $('#drop').classList.remove('on');
  if (collapsed) setCollapsed(false);
  for (const f of dropped) await uploadFile(f);
});

// 快捷键
document.addEventListener('keydown', e => {
  const typing = /input|textarea|select/i.test(document.activeElement.tagName);

  if (e.key === 'Escape') { $('#lightbox').classList.remove('on'); return; }

  if (e.key === '[' && !typing && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); setCollapsed(!collapsed); return;
  }
  if (e.key === ',' && !typing && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); openSettings(); return;
  }
  if (e.key === 'n' && !typing && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    if (collapsed) setCollapsed(false);
    setTimeout(() => $('#text')?.focus(), 200);
  }
});

refresh().catch(err => {
  document.body.insertAdjacentHTML('afterbegin',
    `<div style="padding:18px;color:#ef4444">连不上任务服务：${esc(err.message)}</div>`);
});
setInterval(() => { refresh().catch(() => {}); }, 3000);
</script>
