<script>
const COLS = [
  { key:'todo',  label:'未开始', color:'var(--todo)' },
  { key:'doing', label:'进行中', color:'var(--doing)' },
  { key:'done',  label:'已完成', color:'var(--done)' }
];
const PRI_LABEL = { p0:'P0 阻塞', p1:'P1 紧急', p2:'P2 常规', p3:'P3 低', p4:'P4 待定' };
const PRI_COLOR = { p0:'var(--p0)', p1:'var(--p1)', p2:'var(--p2)', p3:'var(--p3)', p4:'var(--p4)' };
const KIND_LABEL = { text:'文字', image:'图片', image_text:'图文', link:'链接', file:'附件', mixed:'混合' };
const STATUS_LABEL = { todo:'未开始', doing:'进行中', done:'已完成' };


const SOLO = new URLSearchParams(location.search).has('solo');
const LS_W = 'ti.captureWidth';

let store = { projects:['默认'], tasks:[], counts:{}, total:0 };
// 项目筛选只有一份状态（navProject）。filters 里不放 project ——
// 两份状态一定会出现「侧栏高亮 A、下拉写着 B」。
let filters = { priority:'', category:'' };

const $ = s => document.querySelector(s);

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));
}

function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 1600);
}

function ago(iso){
  if(!iso) return '';
  const d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60) + ' 分钟前';
  if (d < 86400) return Math.floor(d/3600) + ' 小时前';
  if (d < 86400*30) return Math.floor(d/86400) + ' 天前';
  return new Date(iso).toLocaleDateString();
}

function imgUrl(p){
  if (!p) return '';
  if (/^https?:/i.test(p)) return p;
  const name = String(p).split(/[\\/]/).pop();
  return '/images/' + encodeURIComponent(name);
}

/* ---------------- 左下角状态条 ----------------
   以前这里是 150px 高的卡：标题、大号文案、模型名、七段进度条、整行设置按钮。
   三件事都在重复 navMenu 已经说过的数字（待办/进行中/总数），进度条在
   13 条任务时只有 2 段亮着，看不出任何趋势。现在压成一条：
   状态灯 + 一句话 + 齿轮。信息没丢（数字在导航行上），纵向省下约 110px。 */

let backendName = '';

async function refreshSystemBox(){
  const set = (id, v) => { const el = $('#' + id); if (el) el.textContent = v; };

  // 状态灯 + 一句话。文案只保留「现在要不要动手」这一层判断。
  // 数字从 sidebarCounts() 来，和上面导航行是同一份 —— 以前这里读后端的
  // store.counts，于是底部写「2 待办」而导航行写「9」，同一个面板两个答案。
  const sc = sidebarCounts();
  const state = $('#sysState');
  const sum = $('#sysSum');
  const todo = sc.counts.todo, doing = sc.counts.doing;
  if (state) state.textContent = todo ? 'ACTIVE' : 'READY';
  if (sum) {
    if (todo || doing) {
      sum.textContent = (todo ? todo + ' 待办' : '')
        + (todo && doing ? ' · ' : '')
        + (doing ? doing + ' 进行中' : '');
    } else sum.textContent = '收件箱已清空';
  }

  // 模型通道：探一次就缓存。它现在只在 tooltip 里出现 ——
  // 侧栏那行宽度放不下「backend · model」，硬塞会把汇总挤掉
  if (!backendName) {
    try {
      const b = await api('GET', '/api/backend');
      const up = Object.entries(b || {}).filter(([, v]) => v).map(([k]) => k);
      backendName = up.length ? up[0] : 'none';
    } catch { backendName = 'unknown'; }
  }
  const st = store.settings || {};
  const model = String(st.model || '').replace(/^auto\//, '');
  if (sum) sum.title = model ? (backendName + ' · ' + model) : backendName;

  // 底部只留版本号。
  // 以前写的是「26 条任务 / SQLite」：条数在「全部任务」那行已经有同一个数字，
  // 存储引擎是实现细节 —— 两样都是给开发者看的，不该占用户的位置。
  // 版本号本身有用：看到 v0.2.0 就知道装的是哪一版，排查时第一个问的就是它。
  const fp = $('#sideFootPath');
  if (fp) {
    const v = String(store.build?.version || '').trim();
    fp.textContent = v ? 'v' + v : '';
  }
}

/* ---------------- 侧栏收起 ---------------- */

const LS_SIDE = 'ti.sideCollapsed';
let collapsedSide = false;

function setSidebar(collapsed){
  collapsedSide = !!collapsed;
  $('#app').classList.toggle('side-collapsed', collapsedSide);
  localStorage.setItem(LS_SIDE, collapsedSide ? '1' : '0');
  const btn = $('#sideToggle');
  if (btn) btn.title = collapsedSide ? '展开侧栏' : '收起侧栏';
}

$('#sideToggle')?.addEventListener('click', () => setSidebar(!collapsedSide));

/* ---------------- 侧栏：状态导航 / 项目导航 ---------------- */

/* 视图轴：一条流水线，不是两个并列维度（见 ISSUES.md「共用判断 2」）
     board    → 看板三列（未开始 / 进行中 / 已完成）
     clarify  → 待澄清，单列
     archived → 归档，单列
   navProject 只在 board 视图里有意义；「默认」是一个特殊项目 = 未分配收件筐。 */
let navView = 'board';        // board | clarify | archived
let navFilter = 'all';        // board 视图内部：all | todo | doing | done
let navProject = '';          // 项目名，空表示全部；'默认' = 未分配筐
const INBOX = '默认';          // 收件筐的项目名（后端 core.mjs 同一个常量）

/* 组内重复出现的项目名：'默认' 走收件筐语义，其余按名字比对。
   放在一处，免得过滤、计数、徽章三处各写一遍判断。 */
function isInbox(p){ return p === INBOX; }

/* 按流水线判定一条任务属于哪个视图。顺序即优先级，命中即停：
   归档 → 待澄清 → 未分配 → 看板列。
   被合并的卡（merged_into 非空）在最前面就排掉：它已经是历史记录，
   不删不归档，但绝不占看板 —— 否则合并完旧卡还杵在那儿，等于没合并。
   唯一的入口是【合】徽章的浮层（relPicker）。

   opt 用来「按另一个视图算一遍」，侧栏计数就靠它：
   传 {view:'board', project:'诺华'} 就能得到「点开诺华会看到什么」。
   不传就用当前的全局状态。**不要**另写一份过滤 —— 那就是
   「侧栏 9、列头 2」的成因。 */
function inView(t, opt){
  const view = opt?.view ?? navView;
  const proj = opt?.project ?? navProject;

  if (t.merged_into) return false;                       // 被合并的：只看得到，不占位
  if (view === 'archived') return !!t.archived_at;
  if (t.archived_at) return false;                       // 归档的只在归档视图出现
  if (view === 'clarify') return t.dev_ready === false;
  if (t.dev_ready === false) return false;               // 待澄清的不进看板

  const inbox = isInbox(t.project);
  // 「默认」筐：只有点它的时候才看得到内容；看板三列里一条都不留
  if (isInbox(proj)) return inbox;
  if (inbox) return false;

  /* 点某个项目 = 只看这个项目。
     这一行以前**不存在** —— 侧栏点击只改了高亮、标题和面包屑，
     卡片始终是全部任务的。于是「点项目没反应」看起来像筛选坏了，
     其实是压根没筛。 */
  if (proj && t.project !== proj) return false;
  return true;
}

/* 侧栏那五个数字。口径直接调 inView()，所以永远等于「点进去能看到的」。
   选了项目就只数这个项目 —— 否则又是一屏两套账。 */
function sidebarCounts(){
  const tasks = store.tasks || [];
  const n = (view, status, proj) => tasks.filter(t => inView(t, { view, project: proj })
    && (!status || t.status === status)).length;
  const c = {
    todo: n('board', 'todo', navProject),
    doing: n('board', 'doing', navProject),
    done: n('board', 'done', navProject)
  };
  // 「待澄清」和「归档」是流水线之外的独立视图，永远是全量：
  // 点它们会清掉项目筛选（见 bindNavViews），所以数字也必须按全量算，
  // 否则「侧栏写 2、点进去看到 6」——又是那种对不上的账。
  return {
    counts: c,
    total: c.todo + c.doing + c.done,
    draft: n('clarify', null, ''),
    archived: n('archived', null, '')
  };
}

function renderSidebar(){
  // 全部数字都由 sidebarCounts() 现算，口径就是 inView()。
  // 以前这里读 store.counts（后端另算的一份），两份口径迟早会分叉 ——
  // 「侧栏写 9、列头写 2」就是这么来的。
  const sc = sidebarCounts();
  const tasks = store.tasks || [];
  const set = (id, v) => { const el = $('#' + id); if (el) el.textContent = v; };
  set('cntAll', sc.total);
  set('cntTodo', sc.counts.todo);
  set('cntDoing', sc.counts.doing);
  set('cntDone', sc.counts.done);
  // 待澄清 / 归档：各是一个独立视图，跟着当前项目一起收窄
  set('cntDraft', sc.draft);
  set('cntArchNum', sc.archived);

  // 状态高亮。以前 `&& !navProject` 让「选了项目就谁都不高亮」——
  // 项目行自己有一份高亮，状态行不该因为项目被选中就集体熄灭。
  document.querySelectorAll('#navMenu .nav-link').forEach(el => {
    const isView = el.dataset.view === 'clarify';
    el.classList.toggle('active',
      isView ? navView === 'clarify'
             : navView === 'board' && el.dataset.filter === navFilter);
  });
  $('#cntArch')?.classList.toggle('active', navView === 'archived');

  // 项目列表
  const host = $('#navProjects');
  if (!host) return;
  const projects = store.projects || [];
  host.innerHTML = projects.map(p => {
    const inbox = isInbox(p.name);
    // 计数 = 点进这个项目**能看到几张卡**。直接问 inView，不另写条件 ——
    // 以前这里自己写了一套（只排归档），于是侧栏写 13、点进去只有 6。
    const n = tasks.filter(t => inView(t, { view: 'board', project: p.name })).length;
    const active = navProject === p.name ? ' active' : '';
    const initial = (p.name || '?').trim().slice(0, 1).toUpperCase();
    // 「默认」用收件筐图标，不用文件夹 —— 它不是一个装文件的目录
    const ico = inbox
      ? '<svg class="ico-folder" fill="none" stroke="currentColor" viewBox="0 0 24 24">'
        + '<path d="M3 13h4l1.5 2.5h7L17 13h4"/><path d="M5.2 5.6h13.6l2.2 7.4v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4z"/></svg>'
      : '<svg class="ico-folder" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
    const sub = inbox ? '<span class="nav-sub">未分配</span>' : '';
    // 「默认」不可拖：它永远是第一位，是流水线的最后一道落点
    return `<div class="nav-link${active}${inbox ? ' nav-link--inbox proj-fixed' : ''}"`
      + ` data-proj="${esc(p.name)}" data-pid="${esc(p.id)}" title="${esc(inbox ? '未分配收件筐：还没定项目的任务落在这里' : p.name)}"`
      + (inbox ? '' : ' draggable="true"') + `>
      <span class="name">
        ${ico}
        <span class="ico-initial">${esc(initial)}</span>
        <span class="ico-text">${esc(p.name)}</span>${sub}
      </span>
      <span class="cnt">${n}</span>
    </div>`;
  }).join('') || '<div class="nav-link" style="color:var(--text-3)">（暂无项目）</div>';

  host.querySelectorAll('[data-proj]').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.dataset.proj;
      navProject = navProject === name ? '' : name;
      navView = 'board';
      navFilter = navProject ? 'all' : navFilter;
      syncFilterUI();
      render();
      renderSidebar();
    });
  });

  bindProjectDrag();
}

/* ---------------- 侧栏项目拖拽排序 ----------------
   和看板卡片是两个手势：项目行点一下是筛选，按住拖才是排序。
   所以 mousedown 之后移动超过 4px 才算拖拽 —— 没有这个阈值，
   点一下就触发一次 reorder（SIDE-1 明确提过）。 */
const PROJ_DRAG_SLOP = 4;
let projDrag = null;

function bindProjectDrag(){
  const host = $('#navProjects');
  if (!host) return;

  host.querySelectorAll('[data-proj][draggable="true"]').forEach(el => {
    el.addEventListener('mousedown', e => {
      // 只认左键；按下时的坐标留着，mousemove 里量位移
      if (e.button !== 0) return;
      projDrag = { el, x: e.clientX, y: e.clientY, id: el.dataset.pid, armed: false };
    });
    el.addEventListener('dragstart', e => {
      // 阈值必须由 mousemove 来判，不能在这量：
      // Chrome 的 dragstart 里 clientX/Y 恒为 0，拿它算位移永远是 0，
      // 于是 armed 永远置不上、每条拖拽都被 preventDefault 掉 —— 拖不动。
      if (!projDrag || projDrag.el !== el || !projDrag.armed) { e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', el.dataset.pid);
      e.dataTransfer.effectAllowed = 'move';
      el.classList.add('proj-drag');
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('proj-drag');
      clearProjDrop();
      projDrag = null;
    });
  });

  // 位移超过阈值才把这次按下列为「拖拽」，否则算点击（点一下是筛选）。
  // 挂 document 上而不是行上：手指/鼠标可能在按下的那一刻就已经离开那一行了。
  if (!bindProjectDrag.bound) {
    bindProjectDrag.bound = true;
    document.addEventListener('mousemove', e => {
      if (!projDrag || projDrag.armed) return;
      if (Math.hypot(e.clientX - projDrag.x, e.clientY - projDrag.y) > PROJ_DRAG_SLOP) {
        projDrag.armed = true;
      }
    });
    document.addEventListener('mouseup', () => {
      // 拖拽中松手由 dragend 收尾；这里只负责清掉「按了没动」的状态
      if (projDrag && !projDrag.armed) projDrag = null;
    });
  }

  host.querySelectorAll('[data-proj]').forEach(el => {
    const fixed = el.classList.contains('proj-fixed');

    el.addEventListener('dragover', e => {
      // 「默认」不接受插入：它永远在第一位，落点画在它上面会让人以为可以
      if (fixed) { e.dataTransfer.dropEffect = 'none'; return; }
      if (!projDrag?.armed) return;              // 没真在拖就什么都不画
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      clearProjDrop();
      const r = el.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      el.classList.add('proj-drop');
      el.dataset.drop = after ? 'after' : 'before';
    });
    el.addEventListener('dragleave', () => {
      el.classList.remove('proj-drop');
      delete el.dataset.drop;
    });
    el.addEventListener('drop', async e => {
      if (fixed) return;
      const movedId = e.dataTransfer.getData('text/plain') || projDrag?.id;
      if (!movedId) return;
      e.preventDefault();
      const r = el.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      clearProjDrop();
      await reorderProject(movedId, el.dataset.pid, after);
    });
  });

  host.addEventListener('mouseup', () => { projDrag = null; });
}

function clearProjDrop(){
  document.querySelectorAll('#navProjects .proj-drop').forEach(el => {
    el.classList.remove('proj-drop');
    delete el.dataset.drop;
  });
}

/* 先改本地顺序并重绘，再提交。等请求回来才动的话，拖完会有一次可见的跳回。 */
async function reorderProject(movedId, targetId, after){
  const list = (store.projects || []).slice();
  const from = list.findIndex(p => p.id === movedId);
  if (from < 0) return;
  const [moved] = list.splice(from, 1);
  let to = list.findIndex(p => p.id === targetId);
  if (to < 0) return;
  if (after) to += 1;
  list.splice(to, 0, moved);
  // 「默认」固定第一位，前端自己也不许把它挪下来
  list.sort((a, b) => (isInbox(a.name) ? -1 : 0) - (isInbox(b.name) ? -1 : 0));
  store.projects = list;
  renderSidebar();

  try {
    const r = await api('POST', '/api/projects/reorder',
      { ids: list.filter(p => !isInbox(p.name)).map(p => p.id) });
    if (r.projects) { store.projects = r.projects; renderSidebar(); }
  } catch (e) {
    toast('排序没存上：' + e.message);
    await refresh();                    // 服务端才是真的，拉回来对齐
  }
}

/* ---------------- 项目选择浮层 ----------------
   原来这里是 prompt()：系统对话框做不了搜索、带不了任务数、也长不出「新建」那一行。
   现在复用 .sel-menu 的玻璃材质 + .sel-opt 的行，只多一个过滤框 —— 项目超过
   十来个的时候就该能搜，而不是让人在滚动条里找。 */
let pickerEl = null;
let pickerTaskId = null;

// 名字比较要先归一：尾随空格 / 大小写 / 别名都算命中，
// 否则「cabinet 」会走去新建，后端回一句「项目已存在」，人只看到一句失败。
function normName(s){ return String(s == null ? '' : s).trim().toLowerCase(); }

function findProjectByName(name){
  const k = normName(name);
  if (!k) return null;
  return (store.projects || []).find(p =>
    normName(p.name) === k || (p.aliases || []).some(a => normName(a) === k)) || null;
}

function closePicker(){
  if (pickerEl) { pickerEl.remove(); pickerEl = null; }
  pickerTaskId = null;
}

function projectPicker(taskId, anchor){
  closePicker();
  pickerTaskId = taskId;

  const wrap = document.createElement('div');
  wrap.className = 'sel-menu picker';
  wrap.innerHTML = '<input class="picker-in" placeholder="搜项目，或输入新名字回车新建" '
    + 'autocomplete="off" spellcheck="false" aria-label="选项目">'
    + '<div class="picker-list" role="listbox"></div>';
  document.body.appendChild(wrap);
  pickerEl = wrap;

  const input = wrap.querySelector('.picker-in');
  const list = wrap.querySelector('.picker-list');
  let hot = 0;

  function rows(){
    const q = normName(input.value);
    const items = (store.projects || [])
      .filter(p => !q || normName(p.name).includes(q) || (p.aliases || []).some(a => normName(a).includes(q)))
      .map(p => ({ name: p.name, count: Number(p.taskCount || 0) }));
    return items;
  }

  function newName(){ return input.value.trim(); }

  function render(){
    const items = rows();
    const nn = newName();
    // 「新建」只在名字真的要新建时才出现：已经存在就变灰，不发出去让后端报错
    const exists = !!findProjectByName(nn);
    const html = items.map((p, i) =>
      '<div class="sel-opt' + (i === hot ? ' hot' : '') + '" role="option" data-name="'
      + esc(p.name) + '"><span>' + esc(p.name) + '</span><span class="sub">'
      + p.count + '</span></div>').join('')
      + (items.length ? '' : '<div class="sel-empty">没有匹配的项目</div>')
      + (nn && !exists
        ? '<div class="sel-opt picker-new" role="option" data-new="1"><span>+ 新建「'
          + esc(nn) + '」</span></div>'
        : '');
    list.innerHTML = html;
    hot = Math.min(hot, Math.max(0, items.length - 1));
  }

  function move(d){
    // 只在真项目之间移动；「新建」靠「没有匹配项时它自动成为唯一选项」来选
    const n = rows().length;
    if (!n) return;
    hot = (hot + d + n) % n;
    render();
    list.querySelector('.sel-opt.hot')?.scrollIntoView({ block: 'nearest' });
  }

  async function choose(name){
    const nn = String(name || '').trim();
    if (!nn) return;
    const hit = findProjectByName(nn);
    try {
      let body;
      if (hit) body = { project_id: hit.id, project: hit.name };
      else {
        const np = await api('POST', '/api/projects', { name: nn });
        body = { project_id: np.id, project: np.name };
      }
      await api('PATCH', '/api/tasks/' + encodeURIComponent(pickerTaskId),
        { ...body, needs_project: false });
      closePicker();
      await refresh();
      toast('已归到 ' + body.project);
    } catch (e) { toast('失败：' + e.message); }
  }

  input.addEventListener('input', () => { hot = 0; render(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const items = rows();
      const nn = newName();
      if (items.length) choose(items[Math.min(hot, items.length - 1)].name);
      else if (nn && !findProjectByName(nn)) choose(nn);
    } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePicker(); }
  });
  list.addEventListener('click', e => {
    const opt = e.target.closest('.sel-opt');
    if (!opt) return;
    if (opt.dataset.new) choose(newName());
    else choose(opt.dataset.name);
  });

  render();

  // 贴着徽章放，但要留在视口里 —— 900px 宽时往右铺会出屏
  const r = anchor.getBoundingClientRect();
  wrap.style.left = Math.max(8, Math.min(r.left, window.innerWidth - wrap.offsetWidth - 8)) + 'px';
  const below = r.bottom + 6;
  wrap.style.top = (below + wrap.offsetHeight > window.innerHeight - 8
    ? Math.max(8, r.top - wrap.offsetHeight - 6) : below) + 'px';
  input.focus();
}

/* ---------------- 关系浮层（【合】/【拆】徽章）----------------
   合并完的旧卡在看板上不占位（inView 排掉了），所以这块浮层是它们唯一的入口 ——
   它是「历史记录的入口」，不是导航。材质和层级复用 .picker：
   都是挂在 body 上的玻璃层、都要盖住抽屉。
   分组按「我从哪来 / 我拆出了什么」：合并卡看到的是 asFrom 的 merge_parent，
   被拆的原卡看到的是 asFrom 的 split_of；反方向的边（谁合并了我）不列，
   因为它只出现在旧卡上，而旧卡不进看板。 */
let relEl = null;

function closeRel(){
  if (relEl) { relEl.remove(); relEl = null; }
  document.querySelectorAll('.tag.rel.open').forEach(el => el.classList.remove('open'));
}

const REL_KIND_LABEL = { merge_parent: '合并来源', split_of: '拆出去的', parent: '子项', depends_on: '依赖' };

/* side: 'from' = 我指向的那一端（看 to），'to' = 指向我的那一端（看 from）。
   不传 side 就按「另一端是谁」自己判断 —— 两边都列的时候不用调用方操心。 */
function relRowsHTML(links, selfId){
  // 同一个 kind 归一组；组间保持后端返回的顺序（created_at）——
  // 那正好是「先合并的先列出」，读起来是时间顺序
  const byKind = new Map();
  for (const l of links) {
    if (!byKind.has(l.kind)) byKind.set(l.kind, []);
    byKind.get(l.kind).push(l);
  }
  const out = [];
  for (const [kind, list] of byKind) {
    out.push('<div class="link-cap">' + esc(REL_KIND_LABEL[kind] || kind) + ' ' + list.length + '</div>');
    for (const l of list) {
      // 对端 = 两端里不是自己的那一个
      const other = (l.from_id === selfId ? l.to : l.from) || {};
      out.push('<div class="sel-opt" role="option" tabindex="0" data-goto="' + esc(other.id) + '">'
        + '<span>' + esc(other.title || other.id) + '</span>'
        + '<span class="sub">' + esc(STATUS_LABEL[other.status] || other.status || '') + '</span></div>');
    }
  }
  return out.join('');
}

async function relPicker(taskId, anchor){
  closeRel();
  closePicker();
  const wrap = document.createElement('div');
  wrap.className = 'sel-menu links-pick';
  wrap.innerHTML = '<div class="link-list"><div class="sel-empty">读取中…</div></div>';
  document.body.appendChild(wrap);
  relEl = wrap;
  anchor.classList.add('open');

  let data;
  try {
    data = await api('GET', '/api/tasks/' + encodeURIComponent(taskId) + '/links');
  } catch (e) {
    wrap.querySelector('.link-list').innerHTML = '<div class="sel-empty">读不到：' + esc(e.message) + '</div>';
    return;
  }

  // asFrom 是「我指向谁」——合并卡看旧卡、被拆的原卡看子卡；
  // asTo 是「谁指向我」，也一并列出（比如一张卡既是合并产物又被拆过）
  const list = wrap.querySelector('.link-list');
  const html = relRowsHTML(data.asFrom || [], taskId) + relRowsHTML(data.asTo || [], taskId);
  list.innerHTML = html || '<div class="sel-empty">没有关系记录</div>';

  list.addEventListener('click', e => {
    const row = e.target.closest('[data-goto]');
    if (!row) return;
    closeRel();
    drOpen(row.dataset.goto);
  });
  list.addEventListener('keydown', e => {
    const row = e.target.closest('[data-goto]');
    if (!row) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      closeRel();
      drOpen(row.dataset.goto);
    }
  });

  // 贴着徽章放，留在视口里 —— 和 .picker 同一套算法
  const r = anchor.getBoundingClientRect();
  wrap.style.left = Math.max(8, Math.min(r.left, window.innerWidth - wrap.offsetWidth - 8)) + 'px';
  const below = r.bottom + 6;
  wrap.style.top = (below + wrap.offsetHeight > window.innerHeight - 8
    ? Math.max(8, r.top - wrap.offsetHeight - 6) : below) + 'px';
}

/* 导航点击：视图切换是纯本地操作，不打服务端 */
function bindNavViews(){
  document.querySelectorAll('#navMenu .nav-link[data-view]').forEach(el => {
    el.addEventListener('click', () => {
      navView = el.dataset.view;
      navProject = '';                  // 视图切换退出项目筛选，否则会看到空列表
      syncFilterUI();
      render();
      renderSidebar();
    });
  });
  $('#cntArch')?.addEventListener('click', e => {
    e.stopPropagation();
    navView = navView === 'archived' ? 'board' : 'archived';
    navProject = '';
    syncFilterUI();
    render();
    renderSidebar();
  });
}

/* ---------------- 自定义下拉 ----------------
   原生 select 保留为状态源（.sel-native，视觉隐藏），
   上面盖一层 .sel：自定义按钮 + 玻璃菜单，样式可控、键盘可用。 */

const selList = [];

// root 默认是 document；动态生成还没插进文档的片段要传自己的容器，
// 否则 querySelectorAll 找不到里面的 select（目录行就踩过这个坑）。
function buildSels(root = document){
  // 筛选条用紧凑档；data-sel="field" 表单档；data-sel="inline" 行内小号。
  // 幂等：已经包过的跳过，这样动态新增的 select 可以再调一次。
  root.querySelectorAll('select.sel-native').forEach(native => {
    if (native.previousElementSibling?.classList?.contains('sel')) return;
    const wrap = document.createElement('div');
    const mode = native.dataset.sel || '';
    wrap.className = 'sel' + (mode === 'field' ? ' sel--field' : mode === 'inline' ? ' sel--inline' : '');
    wrap.innerHTML =
      '<button type="button" class="sel-btn" aria-haspopup="listbox" aria-expanded="false">'
        + '<span class="lbl"></span>'
        + '<svg class="carw" viewBox="0 0 12 12" fill="none" aria-hidden="true">'
        + '<path d="M2.6 4.6L6 8l3.4-3.4" stroke="currentColor" stroke-width="1.5" '
        + 'stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '</button>'
      + '<div class="sel-menu" role="listbox" tabindex="-1"></div>';
    native.parentNode.insertBefore(wrap, native);
    native.setAttribute('tabindex', '-1');
    native.setAttribute('aria-hidden', 'true');

    const btn = wrap.querySelector('.sel-btn');
    const menu = wrap.querySelector('.sel-menu');
    const rec = { native, wrap, btn, menu, hot: -1 };
    selList.push(rec);

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = wrap.classList.contains('open');
      closeAllSels();
      if (!open) openSel(rec);
    });
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault(); openSel(rec); focusHot(rec, 0);
      }
    });
    menu.addEventListener('click', (e) => {
      const opt = e.target.closest('.sel-opt');
      if (opt) pickSel(rec, opt.dataset.value);
    });
    wrap.addEventListener('keydown', (e) => {
      if (!wrap.classList.contains('open')) return;
      if (e.key === 'Escape') { e.preventDefault(); closeAllSels(); btn.focus(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); focusHot(rec, rec.hot + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); focusHot(rec, rec.hot - 1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        const opt = menu.querySelectorAll('.sel-opt')[rec.hot];
        if (opt) pickSel(rec, opt.dataset.value);
      }
    });
    native.addEventListener('change', () => selSync());
  });

  // 全局收起只挂一次：buildSels 会被目录行重复调用，
  // 每次都加一对 document 监听就是内存泄漏（还会让 Escape 逻辑跑 N 遍）。
  if (!buildSels.bound) {
    buildSels.bound = true;
    document.addEventListener('click', closeAllSels);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAllSels();
    });
  }
}

function selSync(){
  selList.forEach(rec => {
    const { native, wrap, btn, menu } = rec;
    const val = native.value;
    const opts = [...native.options];
    const hit = opts.find(o => o.value === val);
    btn.querySelector('.lbl').textContent = hit ? hit.textContent : (opts[0]?.textContent || '');
    // 只有筛选条那档才有"已筛选"高亮；表单/行内档永远有值，高亮反而像报错
    const isCompact = !wrap.classList.contains('sel--field') && !wrap.classList.contains('sel--inline');
    wrap.classList.toggle('on', isCompact && !!val && !!hit && hit.value !== '');
    menu.innerHTML = opts.length
      ? opts.map(o => {
          const sel = o.value === val ? 'true' : 'false';
          return '<div class="sel-opt" role="option" aria-selected="' + sel
            + '" data-value="' + esc(o.value) + '"><span>' + esc(o.textContent) + '</span></div>';
        }).join('')
      : '<div class="sel-empty">没有可选项</div>';
    if (rec.hot >= opts.length) rec.hot = opts.length - 1;
  });
}

function openSel(rec){
  closeAllSels();
  rec.wrap.classList.add('open');
  rec.btn.setAttribute('aria-expanded', 'true');
  const sel = [...rec.menu.querySelectorAll('.sel-opt')]
    .findIndex(o => o.getAttribute('aria-selected') === 'true');
  rec.hot = sel;
  // 菜单超出视口右边就翻到右侧对齐
  rec.menu.style.left = '0';
  rec.menu.style.right = 'auto';
  requestAnimationFrame(() => {
    const r = rec.menu.getBoundingClientRect();
    if (r.right > window.innerWidth - 8) {
      rec.menu.style.left = 'auto';
      rec.menu.style.right = '0';
      rec.menu.style.transformOrigin = 'top right';
    }
  });
}

function closeAllSels(){
  selList.forEach(rec => {
    rec.wrap.classList.remove('open');
    rec.btn.setAttribute('aria-expanded', 'false');
    rec.menu.querySelectorAll('.hot').forEach(el => el.classList.remove('hot'));
  });
}

function focusHot(rec, i){
  const opts = [...rec.menu.querySelectorAll('.sel-opt')];
  if (!opts.length) return;
  rec.hot = Math.max(0, Math.min(i, opts.length - 1));
  opts.forEach((el, k) => el.classList.toggle('hot', k === rec.hot));
  const el = opts[rec.hot];
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function pickSel(rec, value){
  rec.native.value = value;
  rec.native.dispatchEvent(new Event('change', { bubbles: true }));
  closeAllSels();
  rec.btn.focus();
}

/* ---------------- 模型选择：可搜索组合框 ----------------
   原来是一个 input + <datalist>，弹出层是浏览器原生的，
   跟页面材质完全不搭（灰底、无圆角、条目挤成一行）。
   现在自己渲染菜单：输入即过滤，上下键选，Enter 确认，也允许自由输入。 */

let modelItems = [];        // [{ id, name, vision }]
let modelHot = -1;
let modelOpen = false;

function modelFilter(q){
  const s = String(q || '').trim().toLowerCase();
  if (!s) return modelItems;
  return modelItems.filter(m =>
    String(m.id).toLowerCase().includes(s) || String(m.name || '').toLowerCase().includes(s));
}

function renderModelMenu(q){
  const menu = $('#modelMenu');
  if (!menu) return;
  const list = modelFilter(q);
  if (!modelItems.length) {
    menu.innerHTML = '<div class="sel-empty">没有拉到模型清单</div>';
    return;
  }
  if (!list.length) {
    menu.innerHTML = '<div class="sel-empty">没有匹配的模型，回车就用你输入的这句</div>';
    return;
  }
  const cur = $('#c-model').value.trim();
  menu.innerHTML = list.map((m, i) => {
    const sel = m.id === cur ? 'true' : 'false';
    const sub = m.vision ? '<span class="sub">图片</span>' : '';
    return '<div class="sel-opt" role="option" aria-selected="' + sel
      + '" data-idx="' + i + '"><span>' + esc(m.id) + '</span>' + sub + '</div>';
  }).join('');
  modelHot = Math.min(Math.max(modelHot, 0), list.length - 1);
  markModelHot();
}

function markModelHot(){
  const opts = [...document.querySelectorAll('#modelMenu .sel-opt')];
  opts.forEach((el, k) => el.classList.toggle('hot', k === modelHot));
  const el = opts[modelHot];
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function openModelMenu(q){
  const wrap = $('#modelCombo');
  if (!wrap) return;
  modelOpen = true; modelHot = 0;
  wrap.classList.add('open');
  $('#c-model').setAttribute('aria-expanded', 'true');
  renderModelMenu(q);
}

function closeModelMenu(){
  const wrap = $('#modelCombo');
  if (!wrap) return;
  modelOpen = false;
  wrap.classList.remove('open');
  $('#c-model').setAttribute('aria-expanded', 'false');
}

function pickModel(id){
  $('#c-model').value = id;
  closeModelMenu();
  $('#c-model').focus();
}

function wireModelCombo(){
  const wrap = $('#modelCombo');
  const input = $('#c-model');
  const menu = $('#modelMenu');
  if (!wrap || !input || !menu) return;

  input.addEventListener('focus', () => openModelMenu(input.value));
  input.addEventListener('input', () => { modelHot = 0; openModelMenu(input.value); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!modelOpen) return openModelMenu(input.value);
      modelHot = Math.min(modelHot + 1, modelFilter(input.value).length - 1);
      markModelHot();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      modelHot = Math.max(modelHot - 1, 0);
      markModelHot();
    } else if (e.key === 'Enter') {
      const list = modelFilter(input.value);
      if (modelOpen && list[modelHot]) { e.preventDefault(); pickModel(list[modelHot].id); }
      else closeModelMenu();
    } else if (e.key === 'Escape') {
      closeModelMenu();
    }
  });

  $('#modelToggle')?.addEventListener('click', (e) => {
    e.preventDefault();
    if (modelOpen) closeModelMenu();
    else { input.focus(); openModelMenu(''); }
  });

  menu.addEventListener('click', (e) => {
    const opt = e.target.closest('.sel-opt');
    if (!opt) return;
    const m = modelFilter(input.value)[Number(opt.dataset.idx)];
    if (m) pickModel(m.id);
  });

  // 点别处收起
  document.addEventListener('click', (e) => {
    if (!modelOpen) return;
    if (!wrap.contains(e.target)) closeModelMenu();
  });
}

function syncFilterUI(){
  const proj = $('#project');
  if (proj) proj.value = navProject;
  // 选中的筛选项高亮，未选中的低调。项目那格看 navProject ——
  // 项目筛选只有一个来源，filters.project 那一路已经删掉了
  [['#project', navProject], ['#priority', filters.priority], ['#category', filters.category]]
    .forEach(([sel, val]) => { const el = $(sel); if (el) el.classList.toggle('on', !!val); });
  selSync();
  const reset = $('#fltReset');
  if (reset) reset.hidden = !(navProject || filters.priority || filters.category);
  const crumb = $('#crumbView');
  // 面包屑跟着视图走：它回答「我现在在哪一层」，不是装饰
  const VIEW_CRUMB = { clarify: 'CLARIFY', archived: 'ARCHIVED' };
  if (crumb) {
    crumb.textContent = navProject
      ? (isInbox(navProject) ? 'INBOX' : navProject.toUpperCase())
      : (VIEW_CRUMB[navView] || 'OVERVIEW');
  }
  const h1 = document.querySelector('header.top h1');
  if (h1) {
    const map = { all: '全部任务', todo: '未开始', doing: '进行中', done: '已完成',
      clarify: '待澄清', archived: '归档' };
    // 「默认」是收件筐，标题不能只写「默认」两个字 —— 那看起来像个普通项目
    const projName = isInbox(navProject) ? '未分配' : navProject;
    // 项目和状态是两个独立的维度，可以叠加。堆着的时候标题必须两个都说，
    // 否则「诺华 + 未开始」会写成「未开始」，看着像项目筛选丢了。
    const statusName = navFilter && navFilter !== 'all' ? map[navFilter] : '';
    h1.textContent = (projName && statusName) ? (projName + ' · ' + statusName)
      : (projName || (navView === 'board'
        ? (map[navFilter] || '全部任务')
        : (map[navView] || '全部任务')));
  }
}

/* 顶部状态导航（全部 / 未开始 / 进行中 / 已完成）
   这里以前有 `navProject = ''` —— 点一下「未开始」，刚选的项目就被清掉了，
   于是「选了项目再点状态」等于两件事互相取消。项目和状态本来可以叠加：
   留项目、换状态；再点一次当前状态 = 退回「全部」。
   「全部任务」这一行仍然清空项目（它的语义就是"什么都别筛"）。 */
document.querySelectorAll('#navMenu .nav-link[data-filter]').forEach(el => {
  el.addEventListener('click', () => {
    const next = el.dataset.filter;
    navFilter = (next !== 'all' && navFilter === next) ? 'all' : next;
    navView = 'board';
    if (navFilter === 'all') navProject = '';
    syncFilterUI();
    render();
    renderSidebar();
  });
});

/* ---------------- 布局：底栏收起 / 自动撑高 ---------------- */

const LS_C = 'ti.dockCollapsed';
let collapsed = false;

function autoGrow(){
  const ta = $('#text');
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
}

function initLayout(){
  if (SOLO) { document.body.classList.add('solo'); return; }

  if (localStorage.getItem(LS_SIDE) === '1') setSidebar(true);

  collapsed = localStorage.getItem(LS_C) === '1';
  $('#app').classList.toggle('collapsed', collapsed);

  autoGrow();
  $('#text').addEventListener('input', autoGrow);
  window.addEventListener('resize', autoGrow);
}

function setCollapsed(v){
  collapsed = v;
  $('#app').classList.toggle('collapsed', v);
  localStorage.setItem(LS_C, v ? '1' : '0');
  if (!v) setTimeout(() => { autoGrow(); $('#text')?.focus(); }, 60);
}

/* ---------------- 看板 ---------------- */

/* 视图内部还要过的两道门：状态列（只在 board 有意义）+ 顶部筛选条的优先级 / 类别。
   项目筛选不在这里 —— 它已经由 inView() 按「默认」的收件筐语义处理过了。 */
function matches(t){
  if (navView === 'board' && navFilter !== 'all' && t.status !== navFilter) return false;
  if (filters.priority && t.priority !== filters.priority) return false;
  if (filters.category && t.category !== filters.category) return false;
  return true;
}

/* 当前视图里该看见的任务。归档视图按 done_at 倒序 —— 那是个"翻旧账"的清单，
   新的在上面才符合直觉。 */
function visibleTasks(){
  const list = (store.tasks || []).filter(t => inView(t) && matches(t));
  if (navView === 'archived') {
    list.sort((a, b) => String(b.done_at || b.archived_at || '')
      .localeCompare(String(a.done_at || a.archived_at || '')));
  }
  return list;
}

/* 单列铺开：待澄清 / 归档 / 未分配筐都不是流水线三列，只是一串任务 */
function singleColumn(){
  if (navView === 'clarify') return { key: 'clarify', label: '待澄清', color: 'var(--draft-ink)' };
  if (navView === 'archived') return { key: 'archived', label: '归档', color: 'var(--text-3)' };
  if (isInbox(navProject)) return { key: 'inbox', label: '未分配', color: 'var(--neutral-ink)' };
  return null;
}

/* 折叠状态：只记「被折叠掉的」id 集合，默认展开。
   存 localStorage 而不是 store —— 它是纯视觉偏好，库里不该有它。
   子项内容另存一份缓存：卡片渲染是同步的，而 /children 要发请求，
   所以由 refresh() 拉一次全量后填空，渲染时只读缓存。 */
const LS_FOLD = 'ti.fold';
let folded = new Set();
try { folded = new Set(JSON.parse(localStorage.getItem(LS_FOLD) || '[]')); } catch { folded = new Set(); }
const childrenCache = {};

function saveFold(){
  try { localStorage.setItem(LS_FOLD, JSON.stringify([...folded])); } catch { /* 隐私模式写不了，忽略 */ }
}

/* 折叠只重画看板，不重新拉数据 —— 它是纯视觉开关。 */
function toggleFold(id){
  if (folded.has(id)) folded.delete(id); else folded.add(id);
  saveFold();
  render();
}

/* 一次性把「有子项的卡」的子项都拉下来。张数很少（多数卡没有子项），
   所以并发几条就够，不做队列。失败就当没有子项 —— 卡片少一行比打不开强。 */
async function loadChildren(){
  const parents = (store.tasks || []).filter(t => t.has_children);
  await Promise.all(parents.map(async (p) => {
    if (childrenCache[p.id]) return;
    try {
      const r = await api('GET', '/api/tasks/' + encodeURIComponent(p.id) + '/children');
      childrenCache[p.id] = r.children || [];
    } catch { childrenCache[p.id] = []; }
  }));
  // 子项的状态变了要重拉：只按「父卡有没有子项」缓存会读到过期状态
  for (const k of Object.keys(childrenCache)) {
    if (!parents.some(p => p.id === k)) delete childrenCache[k];
  }
}

function cardHTML(t){
  const meta = [];
  const isDraft = t.dev_ready === false;
  const isArch = !!t.archived_at;
  meta.push(`<span class="tag" style="color:${PRI_COLOR[t.priority] || 'var(--text-3)'};background:${(PRI_COLOR[t.priority]||'var(--text-3)')}22">${PRI_LABEL[t.priority] || '普通'}</span>`);
  if (t.category) meta.push(`<span class="tag cat">${esc(t.category)}</span>`);
  if (t.project && !isInbox(t.project)) meta.push(`<span class="tag">${esc(t.project)}</span>`);
  if (t.kind && t.kind !== 'text') meta.push(`<span class="kind">${KIND_LABEL[t.kind] || ''}</span>`);
  // 待澄清：淡紫标签。它表示"卡住了等人"，不是待办也不是完成
  if (isDraft) meta.push('<span class="tag draft">待澄清</span>');
  // 关系徽章：能点，点开是关系浮层（合并来源 / 拆出去的子卡）。
  // 这两个都是「历史事实」，可读不可改 —— 所以是标签而不是按钮。
  const nMerge = Number(t.link_counts?.merge_parent || 0);
  const nSplit = Number(t.link_counts?.split_of || 0);
  if (t.has_merge) meta.push('<span class="tag rel merge" role="button" tabindex="0"'
    + ' data-rel="' + esc(t.id) + '" title="合并自 ' + nMerge + ' 张卡，点开看原始记录">【合】</span>');
  if (t.has_split) meta.push('<span class="tag rel split" role="button" tabindex="0"'
    + ' data-rel="' + esc(t.id) + '" title="拆出 ' + nSplit + ' 条，点开看子卡">【拆】</span>');
  // 依赖徽章：还欠着前置。数字 = 没做完的前置条数，点开看是哪几条。
  // 和【合】【拆】同一套材质（.tag.rel），只换配色 —— 三者都是"关于这张卡的
  // 一条事实"，区别只在事实的种类。
  const nWait = Number(t.waiting_count || 0);
  if (t.blocked && nWait > 0) {
    meta.push('<span class="tag rel dep" role="button" tabindex="0"'
      + ' data-blocked="' + esc(t.id) + '" title="还等 ' + nWait + ' 条前置做完，点开看">【等 ' + nWait + '】</span>');
  }
  const shots = (t.payload && t.payload.images && t.payload.images.length)
    ? '<div class="shots">' + t.payload.images.slice(0, 4).map(src => `<img src="${esc(imgUrl(src))}" alt="" loading="lazy">`).join('') + '</div>'
    : '';
  const fileCount = (t.payload && t.payload.files && t.payload.files.length) || 0;
  const fileRow = fileCount
    ? `<div class="files">📎 ${fileCount} 个附件</div>` : '';
  const cls = t.classify_state === 'pending'
    ? '<span class="tag pending">判断中…</span>'
    : t.classify_state === 'failed'
      ? `<span class="tag failed" title="${esc(t.classify_reason||'')}">未判断</span>` : '';
  /* 项目入口：两种状态都要有，位置也必须在同一处。
     - 模型判不出项目（needs_project）→ 橙色「选项目」，是"来处理一下"
     - 明确归到「默认」但没标 needs_project → 灰色「默认」，是"记着它未分配"
     待澄清的卡片不给这个入口：它还没到分项目那一步，给出来会让人以为能跳过澄清。 */
  let projBadge = '';
  if (!isDraft && !isArch) {
    if (t.needs_project) projBadge = '<span class="badge-need" data-assign="' + t.id + '">选项目</span>';
    else if (isInbox(t.project)) projBadge = '<span class="badge-default" data-assign="' + t.id + '" title="它还在未分配筐里，点一下归到真项目">默认</span>';
  }
  // 归档视图里唯一要干的事就是取回。单独一行 —— meta 行是 nowrap+18px 定高，
  // 塞进去会被 overflow 裁掉，正好落在"最该点的按钮点不到"这个坑里
  const act = isArch
    ? '<div class="card-foot"><button type="button" class="card-act" data-unarchive="'
      + esc(t.id) + '" title="取回：回到已完成列">取回</button></div>'
    : '';
  // 待澄清卡片：只露第一条缺什么，其余去抽屉里看。整串塞进卡片会把高度撑爆
  const gap = (isDraft && t.dev_gaps && t.dev_gaps.length)
    ? `<div class="card-gap" title="${esc(t.dev_gaps.join('；'))}">还缺：${esc(t.dev_gaps[0])}${t.dev_gaps.length > 1 ? ' …' : ''}</div>`
    : '';
  // 前置断了的提示：和「还缺：…」同一行位置、同一字号，只是颜色不同。
  // 它是「人得回来看一眼」的东西，只藏在抽屉里等于没有 —— 抽屉要专门点开。
  const warnLine = t.link_warn
    ? `<div class="card-warn" title="${esc(t.link_warn)}">${esc(t.link_warn.split('\n')[0])}</div>`
    : '';
  const klass = ['card', t.status === 'done' ? 'done' : '', isArch ? 'archived' : '',
    t.merged_into ? 'merged' : '']
    .filter(Boolean).join(' ');
  // 归档 / 被合并的卡都不可拖：它们已经出了流水线，要回去得显式操作
  const draggable = (isArch || t.merged_into) ? 'false' : 'true';

  /* 有子项的卡：标题前一个折叠箭头 + 「3/5」进度。
     折叠展开的不是树 —— 看板是三列，父子很可能跨列，缩进树在这里没意义。
     展开的是**就地一张子清单**（最多 6 条），点一条跳过去。 */
  const kids = t.has_children ? (childrenCache[t.id] || []) : [];
  const sub = t.subtree || { total: 0, done: 0 };
  const foldOpen = !folded.has(t.id);
  const foldHead = t.has_children
    ? `<div class="card-kids-h" role="button" tabindex="0" data-fold="${esc(t.id)}" title="展开/收起子项">
         <span class="card-fold">${foldOpen ? '▾' : '▸'}</span>
         <span>子项 ${sub.done}/${sub.total}</span>
       </div>`
    : '';
  const foldBody = (t.has_children && foldOpen)
    ? '<div class="card-kids">'
      + (kids.length
        ? kids.slice(0, 6).map(k =>
            '<div class="card-kid" role="button" tabindex="0" data-goto="' + esc(k.id) + '">'
            + '<span>' + esc(k.title) + '</span>'
            + '<span class="sub">' + esc(STATUS_LABEL[k.status] || '') + '</span></div>').join('')
          + (kids.length > 6 ? '<div class="card-kid-more">还有 ' + (kids.length - 6) + ' 条</div>' : '')
        : '<div class="card-kid-more">子项在别的视图里，点箭头展开看</div>')
      + '</div>'
    : '';

  return `
    <div class="${klass}" draggable="${draggable}" data-id="${esc(t.id)}"
         style="--bar:${PRI_COLOR[t.priority] || 'var(--p3)'}">
      <div class="t">${esc(t.title)}</div>
      ${gap}${warnLine}
      <div class="meta">${meta.join('')}${projBadge}${cls}<span class="time">${ago(t.created_at)}</span></div>
      ${foldHead}${foldBody}
      ${shots}${fileRow}${act}
    </div>`;
}

function render(){
  const board = $('#board');
  const one = singleColumn();
  board.classList.toggle('board--single', !!one);
  // 表格视图：整块换成一张表，但**数据源和过滤完全一样**
  // （可见行仍然来自 visibleTasks()，点行仍然开 drOpen）
  board.classList.toggle('board--table', viewMode === 'table');
  // 滚动容器的顶部内边距只在表格模式下归零 —— 表头 sticky 会停在那条
  // padding 里，padding 区不裁剪，滚过去的行就从表头上方露出来（见 CSS 注释）
  board.closest('.board-scroll')?.classList.toggle('has-table', viewMode === 'table');

  if (viewMode === 'table') {
    board.innerHTML = tableHTML();
  } else if (one) {
    const items = visibleTasks();
    board.innerHTML = `
      <section class="col c-${one.key}" data-col="${one.key}">
        <div class="col-head">
          <span class="dot" style="background:${one.color}"></span>
          <span class="col-title">${one.label}</span>
          <span class="col-num">${items.length}</span>
        </div>
        <div class="col-body">
          ${items.length ? items.map(cardHTML).join('') : `<div class="empty">${emptyHint()}</div>`}
        </div>
      </section>`;
  } else {
    board.innerHTML = COLS.map(col => {
      const items = store.tasks.filter(t => t.status === col.key && inView(t) && matches(t));
      return `
        <section class="col c-${col.key}" data-col="${col.key}">
          <div class="col-head">
            <span class="dot" style="background:${col.color}"></span>
            <span class="col-title">${col.label}</span>
            <span class="col-num">${items.length}</span>
          </div>
          <div class="col-body">
            ${items.length ? items.map(cardHTML).join('') : '<div class="empty">' + emptyHint() + '</div>'}
          </div>
        </section>`;
    }).join('');
  }

  // 计数只报「这个视图里看得见多少条」，不是全库总数 —— 后者在归档视图里会吓人
  const shown = visibleTasks().length;
  $('#total').textContent = shown ? `${shown} 条` : '';
  bindDrag();
  renderSidebar();
  refreshSystemBox();
}

function emptyHint(){
  if (navView === 'clarify') return '都澄清完了';
  if (navView === 'archived') return '还没有归档的任务';
  if (isInbox(navProject)) return '筐是空的';
  // 项目 + 状态叠着筛出 0 条时，光写「空」会让人以为筛选坏了
  if (navProject && navFilter !== 'all') return '这个项目里没有这一档';
  return '空';
}

/* ==========================================================================
   表格视图
   --------------------------------------------------------------------------
   它是**同一份数据的第二种渲染**，不是新页面。三条硬规则：

     1. 数据源就是 store.tasks，该看见哪些行由 visibleTasks() 说了算 ——
        筛选条、项目、待澄清 / 归档 / 未分配这些视图全部沿用，这里不另起过滤。
     2. 点一行 → drOpen(id)，还是那一个抽屉，不另做编辑面板。
     3. 折叠只影响渲染（folded 集合是第 3 步就有的），不改数据。

   和看板共用的部分（一处都不重写）：
     visibleTasks() / inView() / matches() / emptyHint() / folded + toggleFold /
     drOpen() / api() / refresh() / syncFilterUI() 的标题与面包屑
   ========================================================================== */

const LS_VIEW = 'ti.viewMode';
let viewMode = localStorage.getItem(LS_VIEW) === 'table' ? 'table' : 'board';

/* 排序：默认 seq_no 升序。只存内存 —— 刷新页面回到默认，
   否则「我明明设过默认排序」这种状态过一次就找不回来了。 */
let tableSort = { key: 'seq_no', dir: 'asc' };
let tableSortedOnce = false;   // 用户手动点过表头（用来决定默认箭头要不要显示）

const STATUS_ORDER = ['todo', 'doing', 'done'];
const PRI_ORDER = ['p0', 'p1', 'p2', 'p3', 'p4'];

/* 关系列的小徽章：和卡片上那一排**同一套材质、同一套事件**
   （data-rel / data-blocked 由 document 那个浮层处理器接），
   所以表格里的【合】点开也是同一个关系浮层。 */
function tableRels(t){
  const out = [];
  if (t.has_merge) {
    out.push('<span class="tag rel merge" role="button" tabindex="0" data-rel="' + esc(t.id)
      + '" title="合并自 ' + Number(t.link_counts?.merge_parent || 0) + ' 张卡，点开看原始记录">【合】</span>');
  }
  if (t.has_split) {
    out.push('<span class="tag rel split" role="button" tabindex="0" data-rel="' + esc(t.id)
      + '" title="拆出 ' + Number(t.link_counts?.split_of || 0) + ' 条，点开看子卡">【拆】</span>');
  }
  const nWait = Number(t.waiting_count || 0);
  if (t.blocked && nWait > 0) {
    out.push('<span class="tag rel dep" role="button" tabindex="0" data-blocked="' + esc(t.id)
      + '" title="还等 ' + nWait + ' 条前置做完，点开看">【等 ' + nWait + '】</span>');
  }
  return out.length ? '<div class="tbl-rels">' + out.join('') + '</div>'
    : '<span class="tbl-dim">—</span>';
}

/* 可编辑格子。空的画一个「—」，点下去仍然是同一个输入框 ——
   空态不该变成点不动的地方（那正是「填工时」最常发生的位置）。 */
function editCell(t, field, cls){
  const v = t[field];
  const shown = (v === null || v === undefined || v === '')
    ? '<span class="tbl-dim">—</span>'
    : esc(v);
  return '<td class="tbl-edit' + (cls ? ' ' + cls : '') + '" data-edit="' + field + '">' + shown + '</td>';
}

/* 列定义。`sort` 为空的列（关系）不可排序：它没有单一可比的值，
   点了只会让顺序看着随机。 */
const TABLE_COLS = [
  {
    key: 'seq_no', label: '编号',
    sort: (t) => (t.seq_no === null || t.seq_no === undefined ? null : t.seq_no),
    cell: (t) => '<td class="tbl-mono tbl-dim">' + esc(t.no || '') + '</td>'
  },
  {
    key: 'title', label: '名称',
    sort: (t) => t.title || '',
    cell: (t, r) => '<td><div class="tbl-name" style="--depth:' + Number(r.depth || 0) + '">'
      + (r.children > 0
        ? '<span class="tbl-fold" role="button" tabindex="0" data-fold="' + esc(t.id)
          + '" title="展开/收起子项">' + (folded.has(t.id) ? '▸' : '▾') + '</span>'
        : '<span class="tbl-fold" aria-hidden="true"></span>')
      + '<span class="tbl-title">' + esc(t.title) + '</span></div></td>'
  },
  {
    key: 'status', label: '状态',
    sort: (t) => STATUS_ORDER.indexOf(t.status),
    cell: (t) => '<td>' + esc(STATUS_LABEL[t.status] || t.status || '') + '</td>'
  },
  {
    key: 'priority', label: '优先级',
    sort: (t) => PRI_ORDER.indexOf(t.priority),
    cell: (t) => '<td>' + esc(PRI_LABEL[t.priority] || '') + '</td>'
  },
  {
    key: 'project', label: '项目',
    sort: (t) => (isInbox(t.project) ? '未分配' : (t.project || '')),
    // 「默认」这个内部名字对用户是一句黑话，界面上一直叫「未分配」
    cell: (t) => '<td>' + esc(isInbox(t.project) ? '未分配' : (t.project || '')) + '</td>'
  },
  {
    key: 'owner', label: '负责人',
    sort: (t) => t.owner || null,
    cell: (t) => editCell(t, 'owner')
  },
  {
    key: 'estimate_hours', label: '预估工时',
    sort: (t) => (t.estimate_hours === null || t.estimate_hours === undefined ? null : t.estimate_hours),
    cell: (t) => editCell(t, 'estimate_hours', 'tbl-num tbl-mono')
  },
  {
    key: 'actual_hours', label: '实际工时',
    sort: (t) => (t.actual_hours === null || t.actual_hours === undefined ? null : t.actual_hours),
    cell: (t) => editCell(t, 'actual_hours', 'tbl-num tbl-mono')
  },
  {
    key: 'plan_start_at', label: '计划开始',
    sort: (t) => t.plan_start_at || null,
    cell: (t) => editCell(t, 'plan_start_at', 'tbl-mono')
  },
  {
    key: 'plan_end_at', label: '计划结束',
    sort: (t) => t.plan_end_at || null,
    cell: (t) => editCell(t, 'plan_end_at', 'tbl-mono')
  },
  {
    key: 'rels', label: '关系', sort: null,
    cell: (t) => '<td>' + tableRels(t) + '</td>'
  }
];

/* 当前排序的比较器。null / 空串一律排最后（不管升还是降）——
   把「没填工时」的行顶到最上面，看排序时第一屏就是一堆空，没有意义。 */
function tableCmp(){
  const col = TABLE_COLS.find((c) => c.key === tableSort.key);
  const val = col && col.sort ? col.sort : TABLE_COLS[0].sort;
  const dir = tableSort.dir === 'desc' ? -1 : 1;
  const empty = (v) => v === null || v === undefined || v === '';
  return (a, b) => {
    const va = val(a);
    const vb = val(b);
    if (empty(va)) return empty(vb) ? 0 : 1;
    if (empty(vb)) return -1;
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
    return String(va).localeCompare(String(vb), 'zh-CN') * dir;
  };
}

/**
 * 当前视图里该画的行，带缩进深度。
 *
 * 层级只在**当前视图内部**成立：父卡不在这一屏，子卡就当根行排 ——
 * 否则会冒出一堆从第 2 层开始的孤儿缩进，看着像表格坏了。
 *
 * 排序作用在**同级之间**，不打散树：按负责人排的时候，
 * 「子项跟着它的父卡走」比「全表按人名重排」更接近人看需求的方式。
 */
function tableRows(){
  const all = visibleTasks();
  const shown = new Set(all.map((t) => t.id));
  const kids = new Map();
  const roots = [];
  for (const t of all) {
    const pid = t.parent_id;
    if (pid && pid !== t.id && shown.has(pid)) {
      if (!kids.has(pid)) kids.set(pid, []);
      kids.get(pid).push(t);
    } else {
      roots.push(t);
    }
  }

  const cmp = tableCmp();
  const rows = [];
  const seen = new Set();
  // 折叠掉的子孙也要记进 seen：它们「在树里但被藏起来了」，
  // 不是「成环漏掉的」。不区分的话，下面那个兜底会把它们当成孤儿行
  // 重新平铺出来 —— 折叠箭头变成了纯装饰（实测过）。
  const markHidden = (list) => {
    for (const t of list) {
      if (seen.has(t.id)) continue;
      seen.add(t.id);
      markHidden(kids.get(t.id) || []);
    }
  };
  const walk = (list, depth) => {
    for (const t of list.slice().sort(cmp)) {
      if (seen.has(t.id)) continue;      // 脏数据成环时兜底，别死循环
      seen.add(t.id);
      const ch = kids.get(t.id) || [];
      rows.push({ t, depth, children: ch.length });
      if (!ch.length) continue;
      if (folded.has(t.id)) markHidden(ch);   // 藏起来但记账
      else walk(ch, depth + 1);
    }
  };
  walk(roots, 0);

  // 成环的卡（A 的父是 B、B 的父是 A）两边都不是根，上面一轮会漏掉它们。
  // 兜底补成根行 —— 表格可以显示得"平"，但不能把行弄丢。
  if (rows.length < all.length) {
    for (const t of all.filter((x) => !seen.has(x.id)).sort(cmp)) {
      seen.add(t.id);
      rows.push({ t, depth: 0, children: 0 });
    }
  }
  return rows;
}

function tableHTML(){
  const rows = tableRows();
  if (!rows.length) return '<div class="empty">' + emptyHint() + '</div>';

  const head = TABLE_COLS.map((c) => {
    if (!c.sort) return '<th class="tbl-th">' + esc(c.label) + '</th>';
    const on = tableSortedOnce && tableSort.key === c.key;
    const arw = on && tableSort.dir === 'desc' ? '▼' : '▲';
    return '<th' + (on ? ' class="on"' : '') + '>'
      + '<button type="button" class="tbl-sort" data-sort="' + c.key + '"'
      + ' title="按' + esc(c.label) + '排序">' + esc(c.label)
      + '<span class="arw">' + arw + '</span></button></th>';
  }).join('');

  const body = rows.map((r) => {
    const cls = r.t.status === 'done' ? ' class="done"' : '';
    return '<tr' + cls + ' data-id="' + esc(r.t.id) + '">'
      + TABLE_COLS.map((c) => c.cell(r.t, r)).join('') + '</tr>';
  }).join('');

  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + head
    + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

/* ---------------- 行内编辑 ----------------
   五个可编辑列（负责人 / 预估工时 / 实际工时 / 计划开始 / 计划结束）点格子
   变成输入框，blur 或 Enter 提交 PATCH，Esc 放弃。其余列只读 ——
   改它们要开抽屉（那里有完整的上下文和对话）。

   归一化全在后端：这里把用户敲的原文原样送上去，
   '' / 'abc' / 负数存 NULL、日期非法抛错，都是 core.patch 的事 ——
   前端各写一份就一定会和后端分叉。 */
function tableOpenEdit(td){
  if (td.querySelector('input')) return;
  const tr = td.closest('tr');
  const field = td.dataset.edit;
  if (!tr || !field) return;
  const t = (store.tasks || []).find((x) => x.id === tr.dataset.id);
  if (!t) return;

  const isDate = field === 'plan_start_at' || field === 'plan_end_at';
  const isNum = field === 'estimate_hours' || field === 'actual_hours';
  const cur = t[field];
  const before = (cur === null || cur === undefined) ? '' : String(cur);

  td.innerHTML = '<input class="tbl-in" type="' + (isDate ? 'date' : 'text') + '"'
    + (isNum ? ' inputmode="decimal"' : '')
    + ' value="' + esc(before) + '">';
  const inp = td.querySelector('input');
  let closed = false;

  inp.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      ev.stopPropagation();
      inp.blur();                      // 提交统一走 blur，只有一条路径
    } else if (ev.key === 'Escape') {
      ev.preventDefault();
      ev.stopPropagation();
      closed = true;
      render();                        // 放弃：直接用库里的值重画
    }
  });

  inp.addEventListener('blur', () => {
    if (closed) return;
    closed = true;
    const raw = inp.value;
    if (raw === before) { render(); return; }   // 没改就别发请求
    tableCommit(t.id, field, raw);
  });

  inp.focus();
  if (!isDate) {
    // 光标落在末尾：多数情况是「在已有值后面补一点」
    try { inp.setSelectionRange(before.length, before.length); } catch { /* 某些类型不支持 */ }
  }
}

async function tableCommit(id, field, raw){
  try {
    await api('PATCH', '/api/tasks/' + encodeURIComponent(id), { [field]: raw });
    await refresh();                    // 后端归一化过的值才是真值（'' → NULL）
  } catch (e) {
    toast('改不了：' + e.message);
    render();                           // 失败就把格子恢复成库里的值
  }
}

/* ---------------- 视图切换 ---------------- */
function syncViewSwitch(){
  document.querySelectorAll('#viewSwitch [data-view]').forEach((b) => {
    b.classList.toggle('on', b.dataset.view === viewMode);
  });
}

function setViewMode(m){
  viewMode = m === 'table' ? 'table' : 'board';
  try { localStorage.setItem(LS_VIEW, viewMode); } catch { /* 隐私模式写不了，忽略 */ }
  syncViewSwitch();
  render();
}

$('#viewSwitch')?.addEventListener('click', (e) => {
  const b = e.target.closest('[data-view]');
  if (b) setViewMode(b.dataset.view);
});

/* 表格滚动时切 .is-scrolled：表头的上圆角只在贴顶时收起来
   （否则它圆掉的角会露出后面滚过去的白行，见 CSS 里那段说明）。
   整段只绑一次 —— .board-scroll 不在 render 里重建。 */
(function bindTableScroll(){
  const sc = document.querySelector('.board-scroll');
  if (!sc || bindTableScroll.done) return;
  bindTableScroll.done = true;
  const sync = () => sc.classList.toggle('is-scrolled', sc.scrollTop > 0);
  sc.addEventListener('scroll', sync, { passive: true });
})();

/* 表格里的事件都用委托：整张表每次 render 都重建，
   逐行绑监听会漏、也会越绑越多（看板那边是逐卡绑的，但它一次只有几十张卡）。 */
$('#board').addEventListener('click', (e) => {
  if (viewMode !== 'table') return;

  const sortBtn = e.target.closest('[data-sort]');
  if (sortBtn) {
    const key = sortBtn.dataset.sort;
    if (tableSort.key === key) {
      tableSort.dir = tableSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      tableSort = { key, dir: 'asc' };
    }
    tableSortedOnce = true;
    render();
    return;
  }

  const fold = e.target.closest('[data-fold]');
  if (fold) {
    e.stopPropagation();
    toggleFold(fold.dataset.fold);      // 第 3 步就有的集合，表格和看板共用
    return;
  }

  // 关系徽章交给 document 上那个浮层处理器，这里不抢
  if (e.target.closest('[data-rel]') || e.target.closest('[data-blocked]')) return;

  const td = e.target.closest('td[data-edit]');
  if (td) {
    e.stopPropagation();
    tableOpenEdit(td);
    return;
  }
  if (e.target.closest('input')) return;

  const tr = e.target.closest('tr[data-id]');
  if (tr) drOpen(tr.dataset.id);        // 同一个抽屉，没有第二套编辑面板
});

function bindDrag(){
  document.querySelectorAll('.card').forEach(el => {
    // 归档 / 被合并的卡片不可拖：它们已经出了流水线，回去要显式操作
    if (el.getAttribute('draggable') === 'false') {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.shots img') || e.target.closest('[data-unarchive]')
          || e.target.closest('[data-rel]') || e.target.closest('[data-blocked]')) return;
        drOpen(el.dataset.id);
      });
      return;
    }
    el.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', el.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      el.style.opacity = '.4';
    });
    el.addEventListener('dragend', () => { el.style.opacity = ''; });
    el.addEventListener('click', (e) => {
      // 折叠箭头和子项行有自己的行为，别抢
      const fold = e.target.closest('[data-fold]');
      if (fold) { toggleFold(fold.dataset.fold); return; }
      const kid = e.target.closest('.card-kids [data-goto]');
      if (kid) { drOpen(kid.dataset.goto); return; }
      // 缩略图、徽章（选项目 / 合 / 拆 / 等 N）、取回按钮有自己的行为，别抢
      if (e.target.closest('.shots img') || e.target.closest('[data-assign]')
        || e.target.closest('[data-unarchive]') || e.target.closest('[data-rel]')
        || e.target.closest('[data-blocked]')) return;
      drOpen(el.dataset.id);
    });
  });

  // 单列视图（待澄清 / 归档 / 未分配）没有「列」可落，就不绑 dragover/drop
  if (navView !== 'board' || isInbox(navProject)) return;
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', async e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const status = col.dataset.col;
      if (!id || !status) return;
      const t = store.tasks.find(x => x.id === id);
      // 待澄清的任务还没到能开工那一步：拖到进行中/已完成一律不动
      if (t && t.dev_ready === false) { toast('先去「待澄清」确认可以开工'); return; }
      if (t && t.archived_at) return;
      // 有子项的卡状态由子项派生，拖不动 —— 否则会拖出一个和子项矛盾的父卡
      if (t && t.has_children) {
        toast('这张卡有 ' + (t.child_count || 0) + ' 个子项，状态由它们决定');
        return;
      }
      // 前置没做完就不能往前推。后端也会拒（core.applyStatus），
      // 这里拦只是省一次往返 + 说清楚是哪几条 —— 不是唯一的关卡。
      // 标题要再问一次 /blocked：state 里只带条数，不带标题（那会让每张卡的
      // 返回体都挂一串对象），而被拦的时候只有这一次额外请求，很划算。
      if (t && t.blocked && (status === 'doing' || status === 'done')) {
        toast(await blockedText(t));
        return;
      }
      try {
        await api('POST', `/api/tasks/${encodeURIComponent(id)}/move`, { status });
        await refresh();
        toast(status === 'done' ? '完成' : status === 'doing' ? '进行中' : '已挪回未开始');
      } catch (err) { toast('失败：' + err.message); }
    });
  });
}

async function api(method, url, body){
  const res = await fetch(url, {
    method,
    headers: body ? { 'content-type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

// 轮询带 since=上次的 revision。库里没变时后端只回几十字节，
// 前端直接跳过 —— 不做 syncFilters/render，滚动位置也就不会被重置。
//
// 全量一次拿（include_archived=1），视图过滤全在前端做：轮询只发一条请求，
// 切视图是纯本地操作，不用来回打服务端。只有这一个 URL，所以 since 逻辑不会串。
async function refresh(opts){
  const since = opts && opts.poll ? store.revision : null;
  const qs = ['include_archived=1'];
  if (since) qs.push('since=' + encodeURIComponent(since));
  const url = '/api/state?' + qs.join('&');
  const next = await api('GET', url);
  if (next.unchanged) {
    // 库没变，但 build 信息可能变了（比如磁盘代码被改了）——顺手更新一下
    if (next.build) store.build = next.build;
    return false;
  }
  store = next;
  syncFilters();
  syncFilterUI();
  // 有子项的卡要先把子项拉下来，卡片渲染是同步的、读的是 childrenCache。
  // 拉失败就当没子项（卡片少一行，比整块打不开强），所以 catch 在这里吞掉。
  await loadChildren().catch(() => {});
  render();
  return true;
}

function syncFilters(){

  proj.innerHTML = '<option value="">全部项目</option>' +
    store.projects.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
  const names = store.projects.map(p => p.name);
  if (names.includes(keep)) proj.value = keep;

  const cats = [...new Set(store.tasks.map(t => t.category).filter(Boolean))].sort();
  const cat = $('#category');
  const keepCat = cat.value;
  cat.innerHTML = '<option value="">全部类别</option>' +
    cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if (cats.includes(keepCat)) cat.value = keepCat;


}

let images = [];   // {path,url,name}
let files = [];    // {path,name,original,size}
let pending = 0;

// 提示只活 6 秒。以前只写不清，判完那条「P2 常规 · 工作」会一直卡在底栏，
// 看着像默认标签 —— 其实它是上一次判断的回声（DOCK-1）。
const SAY_TTL = 6000;
function say(t, cls){
  const el = $('#msg');
  el.textContent = t;
  el.className = 'cap-msg ' + (cls||'');
  clearTimeout(say._t);
  if (!t) return;
  say._t = setTimeout(() => {
    // 只清自己写的那句：这 6 秒里可能又有新提示写进来了，别把新的抹掉
    if (el.textContent === t) { el.textContent = ''; el.className = 'cap-msg'; }
  }, SAY_TTL);
}

function refreshGo(){
  $('#go').disabled = (! $('#text').value.trim()) && !images.length && !files.length;
}

function humanSize(n){
  if (n < 1024) return n + 'B';
  if (n < 1024*1024) return Math.round(n/1024) + 'KB';
  return (n/1024/1024).toFixed(1) + 'MB';
}

function renderThumbs(){
  const parts = [];
  images.forEach((im, k) => {
    parts.push(`<div class="thumb"><img src="${esc(im.url)}" alt="">
      <button data-k="img" data-i="${k}" title="移除">✕</button></div>`);
  });
  files.forEach((f, k) => {
    parts.push(`<div class="thumb file" title="${esc(f.original || f.name)}">
      <span class="fext">${esc((f.original||'').split('.').pop()?.slice(0,4) || 'FILE')}</span>
      <small>${esc(humanSize(f.size||0))}</small>
      <button data-k="file" data-i="${k}" title="移除">✕</button></div>`);
  });
  $('#thumbs').innerHTML = parts.join('');
  $('#thumbs').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.k === 'img') images.splice(+b.dataset.i, 1);
      else files.splice(+b.dataset.i, 1);
      renderThumbs(); refreshGo();
    });
  });
  refreshGo();
}

function readAsDataUrl(f){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.readAsDataURL(f);
  });
}

// 图片走 /api/upload（会自动落到 images/），其他文件带 filename
async function uploadFile(f){
  pending++;
  try {
    const dataUrl = await readAsDataUrl(f);
    const isImage = f.type.startsWith('image/');
    const body = isImage ? { dataUrl } : { dataUrl, filename: f.name };
    const d = await api('POST', '/api/upload', body);
    if (isImage) images.push({ path: d.path, url: d.url, name: f.name });
    else files.push({ path: d.path, name: d.name, original: d.original || d.name, size: d.size || f.size });
    renderThumbs();
    return true;
  } catch (e) {
    say('上传失败：' + e.message, 'err');
    return false;
  } finally {
    pending--;
  }
}

async function submit(){
  const text = $('#text').value.trim();
  if (!text && !images.length && !files.length) return;
  if (pending) { say('还有文件正在上传…', 'err'); return; }

  // 类型和优先级都交给模型判断，这里只给个兜底标题
  const fallback = text || (images.length ? '截图' : files[0]?.original || '附件');

  const body = {
    title: fallback.split('\n')[0].slice(0, 120),
    text: text || null,
    images: images.map(i => i.path),
    files: files.map(f => f.path),
    source: 'quick'
  };

  $('#go').disabled = true;
  try {
    const t = await api('POST', '/api/tasks', body);
    $('#text').value = '';
    images = [];
    files = [];
    renderThumbs();
    autoGrow();
    refreshGo();
    say('已收下，正在判断…', 'ok');
    $('#text').focus();
    await refresh();
    watchClassify(t.id);
  } catch (err) {
    say(err.message, 'err');
    refreshGo();
  }
}

// 盯着这一条，分类完成后刷新看板
async function watchClassify(id){
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 700));
    const t = store.tasks.find(x => x.id === id);
    if (!t) { await refresh(); continue; }
    if (t.classify_state && t.classify_state !== 'pending') {
      await refresh();
      const now = store.tasks.find(x => x.id === id);
      if (now) say((PRI_LABEL[now.priority] || '') + ' · ' + (now.category || '未分类'), 'ok');
      return;
    }
  }
}

let drTaskId = null;
let drBusy = false;
// 当前抽屉里这张卡的关系。和 /api/tasks/:id 分两次拉：
// 只读卡片（没人点开）不该为关系多付一次查询，而关系区的数据要能单独刷新。
let drLinks = { asFrom: [], asTo: [] };

function drOpen(id){

/* 上次拖出来的宽度要留着 —— 每次打开都退回 480px，等于让用户重调一遍。 */
function drRestoreWidth(){
  const el = $('#drawer');
  if (!el) return;
  const v = Number(localStorage.getItem(LS_DRV));
  if (Number.isFinite(v) && v >= drWidthMin()) {
    el.style.setProperty('--dr-w', Math.min(v, drWidthMax()) + 'px');
  }
}

function drClose(){
  drTaskId = null;
  drLinks = { asFrom: [], asTo: [] };

async function drLoad(){

    const r = await api('GET', '/api/tasks/' + encodeURIComponent(id));

    drLinks = await api('GET', '/api/tasks/' + encodeURIComponent(id) + '/links')
      .catch(() => ({ asFrom: [], asTo: [] }));

  } catch (e) {

  }
