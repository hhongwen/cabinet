/* ---------------- 文档预览栏 ----------------
   为什么要有：抽屉里那块 44vh 的详情区，一条需求只能露出三分之一。
   这里给一份占满高度的阅读窗，左栏留着改字段和对话。

   宽度只有一个来源：--dr-pane-w（左栏）。整条抽屉 = 左栏 + 分隔条 + 预览，
   所以改左栏宽度就等于改预览宽度，不需要第二个变量跟着同步。 */

const LS_DRW = 'ti.drPaneW';
const LS_DRV = 'ti.drawerW';    // 抽屉本体的宽度（没开预览栏时那档）
let drDocMode = 'brief';        // brief | raw
let docDrag = null;
let drGripDrag = null;

/* 抽屉宽度：没开预览栏时由 --dr-w 决定；开了预览栏由 --dr-wide-w 决定
   （左栏 + 分隔条 + 预览，见下面的 drDocFit）。两处是不同变量，
   所以拖左边缘时要先看现在是哪种形态，再去改对应的那个。 */
function drWidthMin(){ return 380; }
function drWidthMax(){ return Math.min(1180, Math.round(window.innerWidth * 0.94)); }

function drApplyWidth(w){
  const el = $('#drawer');
  if (!el) return;
  const v = Math.max(drWidthMin(), Math.min(drWidthMax(), Math.round(w)));
  if (el.classList.contains('doc-on')) el.style.setProperty('--dr-wide-w', v + 'px');
  else el.style.setProperty('--dr-w', v + 'px');
  return v;
}

function drDocPaneW(){
  const v = Number(localStorage.getItem(LS_DRW));
  return Number.isFinite(v) && v >= 360 ? v : 460;
}

/* 视口太窄就不并排了：两栏各剩不到 400，左右都难受。
   这时让预览铺满整条抽屉（.doc-full），左栏暂时收起。 */
function drDocFit(){
  const el = $('#drawer');
  if (!el?.classList.contains('doc-on')) return;
  const vw = window.innerWidth;
  const full = vw < 1080;
  el.classList.toggle('doc-full', full);
  if (full) return;
  const total = Math.min(1180, vw - 24);
  const pane = Math.min(drDocPaneW(), Math.max(360, total - 380));
  el.style.setProperty('--dr-wide-w', total + 'px');
  el.style.setProperty('--dr-pane-w', pane + 'px');
}

function drDocOpen(mode){
  drDocMode = mode || 'brief';
  const el = $('#drawer');
  if (!el) return;
  el.classList.add('doc-on');
  drDocFit();
  drDocSyncTabs();
  drDocRender();
}

function drDocClose(){
  const el = $('#drawer');
  if (!el) return;
  el.classList.remove('doc-on', 'doc-full');
  el.style.removeProperty('--dr-wide-w');
  el.style.removeProperty('--dr-pane-w');
}

function drDocSyncTabs(){
  $('#drDocTabs')?.querySelectorAll('.doc-tab').forEach(b => {
    b.classList.toggle('on', b.dataset.doc === drDocMode);
  });
}

function drDocSource(t){
  const task = t || drTask;
  if (!task) return '';
  if (drDocMode === 'raw') {
    const parts = [];
    if (task.payload?.text) parts.push(String(task.payload.text));
    if (task.payload?.urls?.length) parts.push('链接：\n' + task.payload.urls.join('\n'));
    return parts.join('\n\n');
  }
  return String(task.brief || '');
}

function drDocRender(){
  const host = $('#drDocBody');
  if (!host || !$('#drawer')?.classList.contains('doc-on')) return;
  const src = drDocSource();
  host.innerHTML = src ? '<div class="doc-md">' + mdToHtml(src) + '</div>' : '';
  host.scrollTop = 0;
}

$('#drDocClose')?.addEventListener('click', drDocClose);
$('#drDocTabs')?.addEventListener('click', (e) => {
  const btn = e.target.closest('.doc-tab');
  if (!btn) return;
  drDocMode = btn.dataset.doc;
  drDocSyncTabs();
  drDocRender();
});
$('#drDocCopy')?.addEventListener('click', async () => {
  const src = drDocSource();
  if (!src) { toast('没有内容可复制'); return; }
  try {
    await navigator.clipboard.writeText(src);
    toast('已复制 markdown 原文');
  } catch {
    toast('复制失败：浏览器不给剪贴板权限');
  }
});

/* 拖动分隔条。宽度在 pointermove 里就写进 --dr-pane-w：
   等到 pointerup 才算的话，整个拖动过程没有反馈，像卡住了。 */
$('#drSplit')?.addEventListener('pointerdown', (e) => {
  const el = $('#drawer');
  if (!el?.classList.contains('doc-on') || el.classList.contains('doc-full')) return;
  docDrag = { left: el.getBoundingClientRect().left, max: el.getBoundingClientRect().width - 340 };
  e.target.setPointerCapture?.(e.pointerId);
  e.target.classList.add('hot');
  e.preventDefault();
});

$('#drSplit')?.addEventListener('pointermove', (e) => {
  if (!docDrag) return;
  const w = Math.max(360, Math.min(docDrag.max, e.clientX - docDrag.left));
  $('#drawer').style.setProperty('--dr-pane-w', Math.round(w) + 'px');
});

$('#drSplit')?.addEventListener('pointerup', (e) => {
  if (!docDrag) return;
  docDrag = null;
  e.target.classList.remove('hot');
  const w = parseInt(getComputedStyle($('#drawer')).getPropertyValue('--dr-pane-w'), 10);
  if (Number.isFinite(w)) localStorage.setItem(LS_DRW, String(w));
  drDocFit();
});

$('#drSplit')?.addEventListener('pointercancel', () => {
  docDrag = null;
  $('#drSplit').classList.remove('hot');
});

/* 抽屉左边缘拖宽。方向是反的：鼠标往左走，抽屉变宽。
   所以算的是「视口右边 − 指针 x」，不是指针的绝对位置。 */
$('#drGrip')?.addEventListener('pointerdown', (e) => {
  const el = $('#drawer');
  if (!el) return;
  drGripDrag = { right: window.innerWidth, w: el.getBoundingClientRect().width };
  e.currentTarget.setPointerCapture?.(e.pointerId);
  e.currentTarget.classList.add('hot');
  document.body.classList.add('col-resizing');
  e.preventDefault();
});

$('#drGrip')?.addEventListener('pointermove', (e) => {
  if (!drGripDrag) return;
  drApplyWidth(drGripDrag.right - e.clientX);
});

$('#drGrip')?.addEventListener('pointerup', (e) => {
  if (!drGripDrag) return;
  drGripDrag = null;
  e.currentTarget.classList.remove('hot');
  document.body.classList.remove('col-resizing');
  const el = $('#drawer');
  const w = Math.round(el.getBoundingClientRect().width);
  // 开预览栏时宽度归 --dr-wide-w 管，那份已经由 drDocFit 记住；这里只存窄档
  if (!el.classList.contains('doc-on')) localStorage.setItem(LS_DRV, String(w));
});

$('#drGrip')?.addEventListener('pointercancel', () => {
  drGripDrag = null;
  $('#drGrip')?.classList.remove('hot');
  document.body.classList.remove('col-resizing');
});

window.addEventListener('resize', () => {
  drDocFit();
  // 窗口变窄之后，之前拖出来的宽度可能比视口还宽
  const el = $('#drawer');
  if (el && !el.classList.contains('doc-on')) {
    const cur = parseFloat(getComputedStyle(el).getPropertyValue('--dr-w')) || 480;
    if (cur > drWidthMax()) el.style.setProperty('--dr-w', drWidthMax() + 'px');
  }
});

// markdown：标题 / 列表 / 粗体 / 行内代码 / 链接 / 引用 / 分隔线 / 围栏代码 / 表格。
// 不引第三方库 —— 这个页面要能单文件双击打开，加一条 npm 依赖就多一条故障线。
// 安全前提：所有文本先 esc() 再过行内替换，标签是这里拼出来的，不是透传的。
function mdToHtml(src){
  const lines = String(src || '').split('\n');
  const out = [];
  let inList = null;     // 'ul' | 'ol'
  let fence = null;      // 围栏代码正在收集的行
  let quote = null;      // 引用块正在收集的行

  const closeList = () => { if (inList) { out.push('</' + inList + '>'); inList = null; } };
  // 逐行 inline 再用裸 <br> 拼：先 join 再 inline 的话，<br> 自己会被 esc 成 &lt;br&gt;
  const closeQuote = () => {
    if (quote) { out.push('<blockquote>' + quote.map(l => inline(l)).join('<br>') + '</blockquote>'); quote = null; }
  };
  const closeAll = () => { closeList(); closeQuote(); };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].replace(/\s+$/, '');

    // 围栏代码：里面的东西一律原样，不解析
    const f = line.match(/^\s*```\s*([\w+-]*)\s*$/);
    if (f) {
      if (fence === null) { closeAll(); fence = []; }
      else {
        out.push('<pre><code>' + esc(fence.join('\n')) + '</code></pre>');
        fence = null;
      }
      continue;
    }
    if (fence !== null) { fence.push(lines[i]); continue; }

    if (!line.trim()) { closeAll(); continue; }

    // 分隔线
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { closeAll(); out.push('<hr>'); continue; }

    // 表格：当前行是 |...| 且下一行是分隔行，就把连续的 | 行一起吃掉
    if (/^\s*\|/.test(line) && /^\s*\|?[\s:-]*-[\s:|-]*\|/.test(lines[i + 1] || '')) {
      closeAll();
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(line);
      i++;                                    // 跳过分隔行
      const body = [];
      while (i + 1 < lines.length && /^\s*\|/.test(lines[i + 1])) { i++; body.push(cells(lines[i])); }
      out.push('<table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead>'
        + (body.length ? '<tbody>' + body.map(r =>
            '<tr>' + head.map((_, k) => '<td>' + inline(r[k] || '') + '</td>').join('') + '</tr>').join('') + '</tbody>' : '')
        + '</table>');
      continue;
    }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeAll(); const lv = Math.min(h[1].length + 1, 4); out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'); continue; }

    const q = line.match(/^\s*>\s?(.*)$/);
    if (q) {
      closeList();
      if (!quote) quote = [];
      quote.push(q[1]);
      continue;
    }
    closeQuote();

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ul) {
      if (inList !== 'ul') { closeList(); out.push('<ul>'); inList = 'ul'; }
      out.push('<li>' + inline(ul[1]) + '</li>'); continue;
    }

    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) {
      if (inList !== 'ol') { closeList(); out.push('<ol>'); inList = 'ol'; }
      out.push('<li>' + inline(ol[1]) + '</li>'); continue;
    }

    closeAll();
    out.push('<p>' + inline(line) + '</p>');
  }
  if (fence !== null) out.push('<pre><code>' + esc(fence.join('\n')) + '</code></pre>');
  closeAll();
  return out.join('');

  function inline(x){
    // 链接先抽出 href，避免 esc 之后 & 变成 &amp; 拼进地址。
    // 只放行 http/https 和站内相对路径：javascript: 之类一律当普通文字。
    const parts = [];
    let s = esc(x).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => {
      if (!/^(https?:\/\/|\/)/i.test(href)) return m;
      parts.push('<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>');
      return '\u0000' + (parts.length - 1) + '\u0000';
    });
    s = s
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+?)`/g, '<code>$1</code>');
    return s.replace(/\u0000(\d+)\u0000/g, (m, n) => parts[Number(n)] || '');
  }
}

function buildSections(t){
  const secs = [];

  // 1. 原始描述
  const raw = [];
  if (t.payload?.text) raw.push(String(t.payload.text));
  if (t.payload?.urls?.length) raw.push('链接：\n' + t.payload.urls.join('\n'));

  // 原文就地编辑：抄进来的原始记录是唯一的「事实来源」，
  // 改它只能走 PATCH payload.text，不能让模型代写（chat.mjs 也不给它开字段）
  // 空原文也给这一节：没有它就没地方「补一句」，而补原文是修好一条模糊任务最快的手段
  secs.push({
    key: 'raw',
    title: '原始描述',
    action: '<button class="mini-btn" data-raw-edit="1">' + (raw.length ? '编辑' : '补一句') + '</button>',
    body: raw.length
      ? '<div>' + esc(raw.join('\n\n')) + '</div>'
      : '<span style="color:var(--text-3)">还没有原文。</span>'
  });

  // 2. 图片
  if (t.payload?.images?.length) {
    const imgs = t.payload.images.map(src =>
      '<img src="' + esc(imgUrl(src)) + '" alt="" loading="lazy">').join('');
    secs.push({ key: 'imgs', title: '图片 ' + t.payload.images.length, body: imgs });
  }

  // 3. 附件
  if (t.payload?.files?.length) {
    const links = t.payload.files.map(f => {
      const name = String(f).split(/[\\/]/).pop();
      return '<a href="/files/' + encodeURIComponent(name) + '" target="_blank">' + esc(name) + '</a>';
    }).join('');
    secs.push({ key: 'files', title: '附件 ' + t.payload.files.length, body: '<div class="files">' + links + '</div>' });
  }

  // 4. 关系（合并 / 拆分）：只在真的有关系时出现。
  //    合并出来的卡看「合并来源」，被拆过的原卡看「拆出去的」。
  //    两个动作按钮也挂在这儿 —— 它们是「这张卡和其他卡的关系」这件事的一部分，
  //    塞进头部主按钮区会和「确认可以开工」抢位置。
  const rel = relSection(t);
  if (rel) secs.push(rel);

  // 5. 需求说明
  secs.push({
    key: 'brief',
    title: '整理后的需求',
    action: (t.brief ? '<button class="mini-btn" data-doc-open="1">展开</button>' : '')
      + '<button class="mini-btn" data-brief="1">'
      + (t.brief ? '重新生成' : '生成需求') + '</button>',
    body: t.brief
      ? '<div class="md">' + mdToHtml(t.brief) + '</div>'
      : '<span style="color:var(--text-3)">还没有整理。点右上角生成一份能直接派给 agent 的需求说明。</span>'
  });

  return secs;
}

/* 关系区：列这张卡的所有关系，并给「合并到别的卡 / 拆成几条」两个入口。
   数据来自 drLinks（drLoad 时一并拉取），和卡片徽章的浮层读的是同一个接口 ——
   两处显示的必须永远一致，所以不各查一套。 */
function relSection(t){
  const asFrom = drLinks.asFrom || [];
  const asTo = drLinks.asTo || [];
  // 没有任何关系也要出这一区 —— 「合并到别的卡 / 拆成几条」两个入口就在这里，
  // 一张新卡恰恰最需要它们。之前这里 `if (!rows.length) return null`，
  // 结果没关系的卡永远看不到入口，第一次合并根本无从下手。
  const empty = !asFrom.length && !asTo.length;

  const rows = [];
  const group = (list, label) => {
    if (!list.length) return;
    rows.push('<div class="rel-cap">' + esc(label) + '</div>');
    for (const l of list) {
      const other = (l.from_id === t.id ? l.to : l.from) || {};
      // 依赖行和层级行多一个「取消」：合/拆是历史事实，不该随手删；
      // 依赖和上下级是当前的组织方式，判断错了就得能当场改。
      let cancel = '';
      if (!t.merged_into) {
        if (l.kind === 'depends_on') {
          cancel = '<button type="button" class="rel-x" data-dep-del="' + esc(l.id) + '"'
            + ' title="取消这条前置">✕</button>';
        } else if (l.kind === 'parent') {
          // 从子项看是「解除这个子项」，从上级看是「这张不再挂在它下面」
          const fromChild = l.from_id === t.id;
          cancel = '<button type="button" class="rel-x" data-parent-del="' + esc(l.id) + '"'
            + ' title="' + (fromChild ? '解除这个子项' : '不再挂在它下面') + '">✕</button>';
        }
      }
      rows.push('<div class="rel-row" role="button" tabindex="0" data-goto="' + esc(other.id) + '">'
        + '<span>' + esc(other.title || other.id) + '</span>'
        + '<span class="sub">' + esc(STATUS_LABEL[other.status] || other.status || '') + '</span>'
        + cancel + '</div>');
    }
  };
  group(asFrom.filter(l => l.kind === 'merge_parent'), '合并来源');
  group(asFrom.filter(l => l.kind === 'split_of'), '拆出去的');
  // 两种边的方向约定一样（from = 主语，to = 宾语），但「宾语」是什么不同：
  //   depends_on: from 等 → to 是前置，所以 asFrom 读作「等这些做完」
  //   parent:     from 子 → to 是父，所以 asFrom 读作「上级」、asTo 读作「子项」
  // 两处标签别写反 —— 写反了会把「我的上级」显示成「我的子项」。
  group(asFrom.filter(l => l.kind === 'parent'), '上级');
  group(asFrom.filter(l => l.kind === 'depends_on'), '等这些做完');
  group(asTo.filter(l => l.kind === 'merge_parent'), '被合并进');
  group(asTo.filter(l => l.kind === 'split_of'), '来自拆分');
  group(asTo.filter(l => l.kind === 'parent'), '子项');
  group(asTo.filter(l => l.kind === 'depends_on'), '挡住谁');

  // 前置断了（被删除 / 被合并）：关系区顶部挂一条警告，用户点了才清。
  const warn = t.link_warn
    ? '<div class="rel-warn"><span>' + esc(t.link_warn) + '</span>'
      + '<button type="button" class="mini-btn" data-warn-clear="1">知道了</button></div>'
    : '';

  // 四个动作。被合并的卡只读：不给任何改动入口（撤销在头部单独给，
  // 因为撤销合并是对「新卡」的操作，不是对旧卡）。
  const acts = t.merged_into ? '' :
    '<div class="rel-act">'
    + '<button type="button" class="mini-btn" data-merge="1" title="把这张卡和别的卡合并成一张新卡">合并到别的卡</button>'
    + '<button type="button" class="mini-btn" data-split="1" title="把这张卡拆成几条（原卡会标成已完成）">拆成几条</button>'
    + '<button type="button" class="mini-btn" data-add-dep="1" title="加一条前置：它做完这张才能开工">加前置</button>'
    + '<button type="button" class="mini-btn" data-set-parent="1" title="把这张卡挂到另一张卡下面">挂到父卡下</button>'
    + '</div>';

  const body = empty
    ? '<span class="rel-empty">还没有关系和这张卡关联。'
      + (t.merged_into ? '' : '可以把它和别的卡合并、拆成几条，或者给它加前置。') + '</span>'
    : '<div class="rel-list">' + rows.join('') + '</div>';

  return {
    key: 'rel',
    // 依赖也计入条数，否则「关系 2」点开看到四行会让人以为哪里错了
    title: empty ? '关系' : '关系 ' + (asFrom.length + asTo.length),
    body: warn + body + acts
  };
}

/* 「还缺这些」：只有待澄清、且初判真的说了缺什么时才出现。
   它跟原始描述分开放 —— 一个是用户抄进来的原话，一个是模型给的疑问，
   混在一个 section 里会让人以为那些疑问也是自己写的。 */
function gapsSection(t){
  if (t.dev_ready !== false || !(t.dev_gaps || []).length) return null;
  return {
    key: 'gaps',
    title: '还缺这些',
    body: '<ul class="dr-gaps">'
      + t.dev_gaps.map(g => '<li>' + esc(g) + '</li>').join('')
      + '</ul>'
  };
}

let drTask = null;

function drRenderDetail(t){
  drTask = t;
  const host = $('#drDetail');
  const secs = buildSections(t);
  const gaps = gapsSection(t);
  if (gaps) secs.unshift(gaps);      // 「还缺什么」排最前：它是这一屏最该看的东西

  // 记住哪些是展开的
  const opened = new Set([...host.querySelectorAll('.sect.open')].map(e => e.dataset.k));
  if (!host.dataset.init) { opened.add('raw'); opened.add('brief'); host.dataset.init = '1'; }
  if (gaps && !host.dataset.gapsInit) { opened.add('gaps'); host.dataset.gapsInit = '1'; }

  host.innerHTML = secs.map(sec => {
    const open = opened.has(sec.key) ? ' open' : '';
    return '<div class="sect' + open + '" data-k="' + sec.key + '">'
      + '<div class="sect-h"><span class="arw">▶</span><span>' + esc(sec.title) + '</span>'
      + '<span class="spacer"></span>' + (sec.action || '') + '</div>'
      + '<div class="sect-b">' + sec.body + '</div></div>';
  }).join('');

  // 折叠
  host.querySelectorAll('.sect-h').forEach(h => {
    h.addEventListener('click', (e) => {
      if (e.target.closest('[data-brief]') || e.target.closest('[data-doc-open]')
        || e.target.closest('[data-raw-edit]')) return;
      h.parentElement.classList.toggle('open');
    });
  });

  // 展开到右侧预览栏
  const openBtn = host.querySelector('[data-doc-open]');
  if (openBtn) openBtn.addEventListener('click', (e) => { e.stopPropagation(); drDocOpen('brief'); });

  // 原文就地编辑：「编辑」把正文换成 textarea，保存走 PATCH payload.text
  const rawBtn = host.querySelector('[data-raw-edit]');
  if (rawBtn) rawBtn.addEventListener('click', (e) => { e.stopPropagation(); drEditRaw(); });

  // 关系区的两个动作。挂在这里而不是 document 委托，因为它们只在这一屏幕里存在，
  // 而且要拿 drTask（当前这张卡的完整数据）去拼请求。
  const mergeBtn = host.querySelector('[data-merge]');
  if (mergeBtn) {
    mergeBtn.addEventListener('click', (e) => { e.stopPropagation(); drStartMerge(drTask); });
  }
  const splitBtn = host.querySelector('[data-split]');
  if (splitBtn) {
    splitBtn.addEventListener('click', (e) => { e.stopPropagation(); drStartSplit(drTask); });
  }
  // 关系行：点一下跳到对端那张卡。卡片徽章的浮层里有这套绑定了，
  // 抽屉里这份是另一处 DOM，不绑就点不动（第一版漏了，点上去像没反应）。
  host.querySelectorAll('.rel-row[data-goto]').forEach(row => {
    const go = (e) => {
      // 行尾的「取消」按钮有自己的行为，别让它顺手把对端那张卡打开
      if (e.target.closest('[data-dep-del]') || e.target.closest('[data-parent-del]')) return;
      e.stopPropagation();
      drOpen(row.dataset.goto);
    };
    row.addEventListener('click', go);
    row.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(e); }
    });
  });

  // 依赖：加前置 / 取消前置 / 清掉断链警告
  const depBtn = host.querySelector('[data-add-dep]');
  if (depBtn) {
    depBtn.addEventListener('click', (e) => { e.stopPropagation(); drAddDep(drTask); });
  }
  host.querySelectorAll('[data-dep-del]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('取消这条前置？\n\n它不影响任何已完成的状态，只是解掉「必须等它」这条约束。')) return;
      try {
        await api('DELETE', '/api/links/' + encodeURIComponent(btn.dataset.depDel));
        await drLoad();
        await refresh();
        toast('已取消这条前置');
      } catch (err) { toast('取消失败：' + err.message); }
    });
  });
  // 层级：挂到父卡下 / 解除上下级
  const parentBtn = host.querySelector('[data-set-parent]');
  if (parentBtn) {
    parentBtn.addEventListener('click', (e) => { e.stopPropagation(); drSetParent(drTask); });
  }
  host.querySelectorAll('[data-parent-del]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('解除这条上下级？\n\n不删任何卡，只是这张不再算作它的子项（或不再挂在它下面）。\n'
        + '如果有子项，它自己会重新变成可手改状态的卡。')) return;
      try {
        await api('DELETE', '/api/links/' + encodeURIComponent(btn.dataset.parentDel));
        await drLoad();
        await refresh();
        toast('已解除上下级');
      } catch (err) { toast('解除失败：' + err.message); }
    });
  });
  const warnClear = host.querySelector('[data-warn-clear]');
  if (warnClear) {
    warnClear.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        await api('PATCH', '/api/tasks/' + encodeURIComponent(drTask.id), { link_warn: '' });
        await drLoad();
        await refresh();
      } catch (err) { toast('清不掉：' + err.message); }
    });
  }

  // 生成 / 重新生成
  const btn = host.querySelector('[data-brief]');
  if (btn) {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const old = btn.textContent;
      btn.textContent = '整理中…';
      btn.disabled = true;
      try {
        const r = await api('POST', '/api/brief', { taskId: drTaskId, force: true });
        if (r.error) throw new Error(r.error);
        drTask.brief = r.brief;
        drTask.brief_at = r.brief_at;
        drRenderDetail(drTask);
        drDocRender();      // 预览栏开着的时候跟着刷新，别让两边说的不是一份
        host.querySelector('.sect[data-k="brief"]').classList.add('open');
        toast('需求已整理');
      } catch (err) {
        toast('失败：' + err.message);
        btn.textContent = old;
        btn.disabled = false;
      }
    });
  }
}

function drRenderHead(t){
  const locked = !!t.merged_into;         // 被合并的卡：历史记录，只读
  const into = locked ? (store.tasks || []).find(x => x.id === t.merged_into) : null;
  const titleEl = $('#drTitle');
  titleEl.textContent = t.title || '（无标题）';
  // 点标题进编辑态：只换 input，不用 contenteditable（那东西会把换行、
  // 粘贴富文本、IME 组合一堆行为一起放进来，收不住）
  // 被合并的卡不给这个入口 —— 后端也会拒，这里只是别让人白点一次。
  if (locked) {
    titleEl.dataset.edit = '';
    titleEl.style.cursor = 'default';
    titleEl.onclick = null;
  } else {
    titleEl.dataset.edit = '1';
    titleEl.onclick = () => drEditTitle(t);
  }

  const tags = [];
  tags.push('<span class="tag" style="color:' + (PRI_COLOR[t.priority] || 'var(--text-3)')
    + ';background:' + ((PRI_COLOR[t.priority] || 'var(--text-3)') + '22') + '">'
    + (PRI_LABEL[t.priority] || '普通') + '</span>');
  // 项目标签：『默认』要显式写成「未分配」，别让人以为有个叫默认的项目
  if (t.project) {
    tags.push('<span class="tag">'
      + esc(isInbox(t.project) ? '未分配' : t.project) + '</span>');
  }
  if (t.category) tags.push('<span class="tag cat">' + esc(t.category) + '</span>');
  // 状态用中文，别把 todo / doing 原样丢给用户看
  tags.push('<span class="tag">' + esc(STATUS_LABEL[t.status] || t.status) + '</span>');
  if (t.dev_ready === false) tags.push('<span class="tag draft">待澄清</span>');
  if (t.archived_at) tags.push('<span class="tag">已归档</span>');

  // 分类失败 / 卡住时给一个重判入口。以前这里什么都没有，
  // 判失败就只能删了重记 —— 而卡片上的「未判断」徽章又不可点。
  if (t.classify_state === 'failed' || t.classify_state === 'pending') {
    // 只挂 tag-retry，不挂 .tag —— .tag 是纯展示用的，混进按钮会让
    // 「按钮材质总则」那个检查把 .tag 也当成按钮
    tags.push('<button type="button" class="tag-retry" data-reclassify="1"'
      + ' title="' + esc(t.classify_reason || '') + '">'
      + (t.classify_state === 'pending' ? '判断中…' : '未判断 · 重试') + '</button>');
  }
  $('#drMeta').innerHTML = tags.join('');

  // 被合并的卡：一行灰字说明归属。这里用「已被合并进「xxx」，只读」这个说法 ——
  // 用户在卡片上看到的是【合】，点进来得能对上那句话。
  const lockEl = $('#drLock');
  if (lockEl) {
    lockEl.textContent = locked
      ? '已被合并进「' + (into?.title || t.merged_into) + '」，只读'
      : '';
  }

  // 头部主按钮：待澄清时是「确认可以开工」，归档时是「取回」，
  // 合并出来的卡是「撤销合并」。
  // 这三个都是「这一步唯一该做的事」，所以放头部而不是塞进字段行。
  const cta = [];
  if (t.dev_ready === false && !locked) {
    cta.push('<button type="button" class="primary" id="drReady">确认可以开工</button>');
  }
  if (t.archived_at) {
    cta.push('<button type="button" id="drUnarchive">取回</button>');
  }
  // 撤销合并只在这一屏出现一次：只有「合并出来的那张卡」才有 merge_parent 出边。
  // 用默认样式而不是 .primary —— 一屏只能有一个主动作（这里是「确认可以开工」/「取回」）。
  if (t.has_merge && !locked) {
    cta.push('<button type="button" id="drUnmerge" title="删掉合并关系，把原始卡片放回来">撤销合并</button>');
  }
  const ctaHost = $('#drCta');
  if (ctaHost) ctaHost.innerHTML = cta.join('');
  $('#drReady')?.addEventListener('click', () => drConfirmReady(t));
  $('#drUnarchive')?.addEventListener('click', () => drUnarchive(t));
  $('#drUnmerge')?.addEventListener('click', () => drUnmerge(t));

  // 快速改字段。项目条目后面带任务数 —— 重名时靠这个才分得清
  const opts = (store.projects || []).map(p => {
    const n = Number(p.taskCount || 0);
    const label = isInbox(p.name) ? '未分配（' + n + '）' : p.name + '（' + n + '）';
    return '<option value="' + esc(p.name) + '"' + (p.name === t.project ? ' selected' : '') + '>'
      + esc(label) + '</option>';
  }).join('');
  $('#drFields').innerHTML =
    '<select id="drPri" class="sel-native" data-sel="inline">'
      + ['p0','p1','p2','p3','p4'].map(k =>
          '<option value="' + k + '"' + (k === t.priority ? ' selected' : '') + '>'
          + PRI_LABEL[k] + '</option>').join('')
    + '</select>'
    + '<select id="drProj" class="sel-native" data-sel="inline"' + (locked ? ' disabled' : '') + '>'
      + opts + '</select>'
    // 状态下拉：被合并的卡禁用（它已经是历史，改状态等于改历史 —— 后端也会拒）
    // 有子项时状态是派生的，下拉禁用 —— 后端也会拒，这里只是别让人白点
    + '<select id="drStatus" class="sel-native" data-sel="inline"'
      + ((locked || t.has_children) ? ' disabled' : '') + '>'
      + [['todo','未开始'],['doing','进行中'],['done','已完成']].map(([k,l]) =>
          '<option value="' + k + '"' + (k === t.status ? ' selected' : '') + '>' + l + '</option>').join('')
    + '</select>';

  // 派生的状态要说明为什么点不动，否则就是个"坏掉的下拉"
  if (t.has_children) {
    const note = document.createElement('div');
    note.className = 'dr-lock';
    const st = t.subtree || { total: 0, done: 0 };
    note.textContent = '状态由 ' + (t.child_count || 0) + ' 个子项决定（' + st.done + '/' + st.total + ' 已完成）';
    $('#drFields').appendChild(note);
  }

  // 这三个是动态插进来的，得再包一次自定义下拉（buildSels 幂等，不会重复包）
  buildSels();
  // buildSels 只负责"套壳"，不回填显示值 —— 不调 selSync 三个下拉就都是空白，
  // 得等用户随便碰一个下拉（pickSel → selSync）才一起亮起来。
  selSync();

  $('#drPri').onchange = () => drQuick({ priority: $('#drPri').value });
  // 换项目要**名字和 id 一起发**。只发名字时后端得自己按名字找项目，
  // 早先那个版本会拿旧 project_id 把名字又套回去（200 但值没变）。
  // 前端本来就手握着 store.projects 里的 id，没有理由让它多猜一次。
  $('#drProj').onchange = () => {
    const name = $('#drProj').value;
    const p = (store.projects || []).find(x => x.name === name);
    drQuick(p ? { project: name, project_id: p.id } : { project: name });
  };
  $('#drStatus').onchange = () => drQuick({ status: $('#drStatus').value });

  // 「未判断 · 重试」按钮
  const retry = $('#drMeta [data-reclassify]');
  if (retry) {
    retry.addEventListener('click', async () => {
      retry.disabled = true;
      retry.textContent = '提交中…';
      try {
        const r = await api('POST', '/api/tasks/' + encodeURIComponent(t.id) + '/reclassify');
        if (r.queued === false) {
          toast('已经在判断了，稍等');
          await drLoad();
          return;
        }
        // 后端改成 pending 是异步的，轮询会把它带回来；这里主动刷一下先显示「判断中…」
        await drLoad();
        toast('已重新提交判断');
        // 等着看结果，完成或失败都会自己刷新
        watchClassify(t.id).then(() => { if (drTaskId === t.id) drLoad(); });
      } catch (e) {
        toast('提交失败：' + e.message);
        retry.disabled = false;
        retry.textContent = '未判断 · 重试';
      }
    });
  }
}

async function drQuick(patch){
  if (!drTaskId) return;
  try {
    const t = await api('PATCH', '/api/tasks/' + encodeURIComponent(drTaskId), patch);
    drRenderHead(t);
    await refresh();
  } catch (e) { toast('改不了：' + e.message); }
}

/* 对话附件：形状跟 tasks.payload 的 images/files 一样，
   所以图片能用 imgUrl()、文件能用 /files/<name> —— 不必另造一套。 */
function attsHTML(att){
  if (!att) return '';
  const imgs = (att.images || []).map(src =>
    '<img src="' + esc(imgUrl(src)) + '" alt="" loading="lazy">').join('');
  const links = (att.files || []).map(f => {
    const name = String(f).split(/[\\/]/).pop();
    return '<a href="/files/' + encodeURIComponent(name) + '" target="_blank" rel="noopener">'
      + esc(name) + '</a>';
  }).join('');
  return (imgs || links) ? '<div class="atts">' + imgs + links + '</div>' : '';
}

function drRenderThread(list){
  const body = $('#drBody');
  if (!list.length) {
    body.innerHTML = '<div class="dr-empty">这里可以补充信息、纠正判断、讨论方案。<br>'
      + '说的每句话都会直接改动这条任务。</div>';
    return;
  }
  body.innerHTML = list.map(m => {
    const applied = m.patch && Object.keys(m.patch).length
      ? '<span class="applied">已改 ' + Object.keys(m.patch)
          .map(k => ({title:'标题',priority:'优先级',category:'类别',project:'项目',status:'状态',note:'备注'}[k] || k))
          .join(' · ') + '</span>' : '';
    // 纯附件消息没有文字：给个空 div 会在气泡里留一条空白，跳过
    const bub = m.text ? '<div class="bub">' + esc(m.text) + '</div>' : '';
    return '<div class="dm ' + (m.role === 'user' ? 'me' : '') + '">'
      + bub + attsHTML(m.attachments) + applied + '</div>';
  }).join('');
  body.scrollTop = body.scrollHeight;
}

/* ---------- 抽屉里的待发附件 ----------
   独立一份状态，不跟底栏共用 images / files：底栏那批是「随手记新任务」的，
   抽屉这批是「给这条任务补话」的，共用一个数组会串（贴一张图到抽屉，
   底栏的「存下」按钮就自己亮了）。 */
let drImages = [];
let drFiles = [];

function drRenderThumbs(){
  const host = $('#drThumbs');
  if (!host) return;
  const parts = [];
  drImages.forEach((im, k) => {
    parts.push('<div class="thumb"><img src="' + esc(im.url) + '" alt="">'
      + '<button data-k="img" data-i="' + k + '" title="移除">✕</button></div>');
  });
  drFiles.forEach((f, k) => {
    const ext = (f.original || f.name || '').split('.').pop()?.slice(0, 4) || 'FILE';
    parts.push('<div class="thumb file" title="' + esc(f.original || f.name) + '">'
      + '<span class="fext">' + esc(ext) + '</span>'
      + '<small>' + esc(humanSize(f.size || 0)) + '</small>'
      + '<button data-k="file" data-i="' + k + '" title="移除">✕</button></div>');
  });
  host.innerHTML = parts.join('');
  host.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.k === 'img') drImages.splice(+b.dataset.i, 1);
      else drFiles.splice(+b.dataset.i, 1);
      drRenderThumbs();
    });
  });
}

// 跟底栏 uploadFile 同一套流程，但落到 drImages / drFiles。
// 没有直接复用它：那个函数把结果 push 进底栏的 images/files，是它的一部分语义。
async function drUpload(f){
  try {
    const dataUrl = await readAsDataUrl(f);
    const isImage = f.type.startsWith('image/');
    const body = isImage ? { dataUrl } : { dataUrl, filename: f.name };
    const d = await api('POST', '/api/upload', body);
    if (isImage) drImages.push({ path: d.path, url: d.url, name: f.name });
    else drFiles.push({ path: d.path, name: d.name, original: d.original || d.name, size: d.size || f.size });
    drRenderThumbs();
    return true;
  } catch (e) {
    toast('上传失败：' + e.message);
    return false;
  }
}

async function drSend(){
  const input = $('#drInput');
  const text = input.value.trim();
  const imgs = drImages.map(i => i.path);
  const fls = drFiles.map(f => f.path);
  // 三者全空才算"什么都没说"：纯文件、纯图片也要能发出去
  if ((!text && !imgs.length && !fls.length) || drBusy || !drTaskId) return;

  drBusy = true;
  $('#drSend').disabled = true;
  input.value = '';
  input.style.height = 'auto';
  const pendingImgs = imgs.slice();
  const pendingFiles = fls.slice();
  drImages = [];
  drFiles = [];
  drRenderThumbs();

  // 先乐观渲染用户这句（附件也用同一套渲染，发完再被服务端返回值覆盖）
  const body = $('#drBody');
  if (body.querySelector('.dr-empty')) body.innerHTML = '';
  body.insertAdjacentHTML('beforeend',
    '<div class="dm me">' + (text ? '<div class="bub">' + esc(text) + '</div>' : '')
    + attsHTML({ images: pendingImgs, files: pendingFiles }) + '</div>');
  body.scrollTop = body.scrollHeight;

  const thinking = document.createElement('div');
  thinking.className = 'dm';
  thinking.innerHTML = '<div class="bub" style="color:var(--text-3)">…</div>';
  body.appendChild(thinking);
  body.scrollTop = body.scrollHeight;

  try {
    const r = await api('POST', '/api/chat',
      { taskId: drTaskId, text, images: pendingImgs, files: pendingFiles });
    thinking.remove();
    drRenderThread((await api('GET', '/api/tasks/' + encodeURIComponent(drTaskId))).messages || []);
    if (r.task) drRenderHead(r.task);
    await refresh();
  } catch (e) {
    thinking.innerHTML = '<div class="bub bad">失败：' + esc(e.message) + '</div>';
    // 发失败要把附件放回去，否则用户得重新传一遍（文件已经在磁盘上了，重建引用就够）
    pendingImgs.forEach(p => drImages.push({ path: p, url: imgUrl(p), name: '' }));
    pendingFiles.forEach(p => drFiles.push({ path: p, name: p, original: String(p).split(/[\\/]/).pop(), size: 0 }));
    drRenderThumbs();
  } finally {
    drBusy = false;
    $('#drSend').disabled = false;
    input.focus();
  }
}

/* ---------- 标题 / 原文就地编辑 ---------- */

/* 标题：点 b 变 input。Enter 提交、Esc 取消（值回滚、不发请求）、失焦提交。
   空标题前端就拦掉 —— 后端也拦，但让用户等一个来回才知道不行是没必要的。 */
function drEditTitle(t){
  const titleEl = $('#drTitle');
  if (!titleEl || titleEl._editing) return;
  const before = t.title || '';
  const input = document.createElement('input');
  input.className = 'dr-title-in';
  input.value = before;
  input.setAttribute('aria-label', '任务标题');
  titleEl._editing = true;
  titleEl.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const restore = () => {
    titleEl._editing = false;
    input.replaceWith(titleEl);
  };
  const cancel = () => {
    if (done) return;
    done = true;
    restore();
  };
  const commit = async () => {
    if (done) return;
    const next = input.value.trim();
    // 没改就什么都不发：点一下标题再点别处不应该产生 PATCH
    if (next === before) { cancel(); return; }
    if (!next) { toast('标题不能为空'); input.focus(); return; }
    done = true;
    try {
      const r = await api('PATCH', '/api/tasks/' + encodeURIComponent(t.id), { title: next });
      restore();
      drRenderHead(r);
      // 就地更新那条任务再重绘，不整页刷新 —— 卡片的滚动位置和展开态都留着
      const hit = (store.tasks || []).find(x => x.id === t.id);
      if (hit) hit.title = r.title;
      render();
      toast('标题已改');
    } catch (e) {
      toast('改不了：' + e.message);
      done = false;
      input.focus();
    }
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancel(); }
  });
  input.addEventListener('blur', () => { commit(); });
}

/* 原文：把「原始描述」的正文换成 textarea。
   保存走 PATCH { payload: { text } } —— core.patch 是深合并，images/files 原样留着。 */
function drEditRaw(){
  const host = $('#drDetail');
  const sect = host?.querySelector('.sect[data-k="raw"]');
  if (!sect || !drTask) return;
  const bodyEl = sect.querySelector('.sect-b');
  if (!bodyEl || bodyEl.querySelector('.sect-edit')) return;

  const before = String(drTask.payload?.text || '');
  bodyEl.innerHTML = '<textarea class="sect-edit" aria-label="原始描述"></textarea>'
    + '<div class="dr-row" style="margin-top:7px">'
    + '<span class="hint">保存只改原文，不动图片和附件</span>'
    + '<button type="button" data-raw-cancel="1">取消</button>'
    + '<button type="button" class="primary" data-raw-save="1">保存</button>'
    + '</div>';
  const ta = bodyEl.querySelector('.sect-edit');
  ta.value = before;
  sect.classList.add('open');
  // 高度自适应内容：先归零再读 scrollHeight，否则只会越来越矮
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 420) + 'px'; };
  fit();
  ta.addEventListener('input', fit);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  const cancel = () => drRenderDetail(drTask);
  bodyEl.querySelector('[data-raw-cancel]').addEventListener('click', cancel);
  bodyEl.querySelector('[data-raw-save]').addEventListener('click', async () => {
    const next = ta.value;
    if (next === before) { cancel(); return; }
    try {
      const r = await api('PATCH', '/api/tasks/' + encodeURIComponent(drTaskId),
        { payload: { text: next } });
      drTask = r;
      drRenderDetail(r);
      drDocRender();          // 预览栏的「原始描述」页签跟着变，别让两边说的不是一份
      const hit = (store.tasks || []).find(x => x.id === r.id);
      if (hit) hit.payload = r.payload;
      toast('原文已保存');
    } catch (e) { toast('保存失败：' + e.message); }
  });
  ta.addEventListener('keydown', e => {
    // Ctrl/Cmd+Enter 保存：Enter 本身要留给换行（原文是多行的）
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      bodyEl.querySelector('[data-raw-save]').click();
    } else if (e.key === 'Escape') {
      e.preventDefault(); e.stopPropagation(); cancel();
    }
  });
}

/* 「确认可以开工」：这是流水线上的放行闸门。
   放行后落哪一列由后端已有的项目决定，前端只负责把结果说清楚 ——
   不然用户点完看不出任务去哪了（可能直接进了未分配筐，看板上没有）。 */
async function drConfirmReady(t){
  const btn = $('#drReady');
  if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }
  try {
    const r = await api('PATCH', '/api/tasks/' + encodeURIComponent(t.id), { dev_ready: true });
    drRenderHead(r);
    drRenderDetail(r);
    await refresh();
    const inbox = isInbox(r.project);
    toast(inbox ? '已进未分配（点侧栏「默认」筐分项目）' : '已进看板');
  } catch (e) {
    toast('操作失败：' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '确认可以开工'; }
  }
}

async function drUnarchive(t){
  try {
    await api('PATCH', '/api/tasks/' + encodeURIComponent(t.id), { archived_at: null });
    await refresh();
    // 取回后它就不在当前（归档）视图里了，留着抽屉看一条已经不在这儿的任务没意义
    drClose();
    toast('已取回，回到已完成列');
  } catch (e) { toast('取回失败：' + e.message); }
}

/* ---------------- 合并 / 拆分 ----------------
   两个动作都要「先选/先填，再提交」，而抽屉里没有富余空间摆一个多选列表。
   所以用一个小浮层（复用 .picker 的材质和 72 层的层级）承载输入，
   提交成功后关浮层 → 刷新 → 关抽屉（当前这张卡的状态已经变了，留在原地看着更糊涂）。

   为什么合并要先选「被合并掉的卡」而不是「合并进哪张」：
   合并的产物永远是一张**新卡**（见 docs/relations-and-table.md 1.1），
   不存在「合并进某张已有的卡」。 */

function relDialog({ title, hint, submitLabel, bodyHTML, onSubmit }){
  closeRel();
  closePicker();
  const wrap = document.createElement('div');
  wrap.className = 'sel-menu links-pick rel-dlg';
  wrap.innerHTML = '<div class="rel-dlg-h">' + esc(title) + '</div>'
    + (hint ? '<div class="rel-dlg-hint">' + esc(hint) + '</div>' : '')
    + bodyHTML
    + '<div class="rel-act"><button type="button" class="mini-btn" data-cancel="1">取消</button>'
    + '<button type="button" class="primary" data-ok="1">' + esc(submitLabel) + '</button></div>';
  document.body.appendChild(wrap);
  relEl = wrap;

  const ok = wrap.querySelector('[data-ok]');
  const cancel = wrap.querySelector('[data-cancel]');
  cancel.addEventListener('click', () => closeRel());
  ok.addEventListener('click', async () => {
    ok.disabled = true;
    const old = ok.textContent;
    ok.textContent = '提交中…';
    try {
      await onSubmit();
      closeRel();
    } catch (e) {
      toast('失败：' + e.message);
      ok.disabled = false;
      ok.textContent = old;
    }
  });
  // 浮层贴在屏幕中间偏上：它是"需要你做决定"的，不该跟着某个按钮漂
  wrap.style.left = Math.max(8, (window.innerWidth - wrap.offsetWidth) / 2) + 'px';
  wrap.style.top = Math.max(8, window.innerHeight * 0.22) + 'px';
  return wrap;
}

/* 合并：从「最近 20 张」里勾选要被合并掉的卡 —— 不让人手敲 id。
   当前这张卡自己不出现在候选里（自己不能和自己合并）。 */
async function drStartMerge(t){
  if (!t) return;
  const pool = (store.tasks || [])
    .filter(x => x.id !== t.id && !x.merged_into && !x.archived_at)
    .slice(0, 20);
  if (!pool.length) { toast('没有可以合并的卡'); return; }

  const rows = pool.map(x =>
    '<label class="rel-pick"><input type="checkbox" value="' + esc(x.id) + '">'
    + '<span>' + esc(x.title) + '</span>'
    + '<span class="sub">' + esc(x.project || '') + '</span></label>').join('');

  relDialog({
    title: '合并成一张新卡',
    hint: '勾选要和「' + t.title + '」合并的卡（至少 1 张）。会新建一张卡，原卡全部保留并标为只读。',
    submitLabel: '合并',
    bodyHTML: '<div class="rel-picks">' + rows + '</div>',
    onSubmit: async () => {
      const picked = [...relEl.querySelectorAll('input[type=checkbox]:checked')].map(el => el.value);
      if (!picked.length) throw new Error('至少要选一张');
      const r = await api('POST', '/api/tasks/merge', { targetIds: [t.id, ...picked] });
      await refresh();
      drClose();
      toast('已合并成「' + (r.task?.title || '新卡') + '」');
    }
  });
}

/* 拆分：一行一条，最傻瓜的输入方式。
   原卡会被标成已完成（已定决策：不引入 split 状态），备注里记子项。 */
async function drStartSplit(t){
  if (!t) return;
  relDialog({
    title: '拆成几条',
    hint: '一行一条。原卡会标成「已完成」，备注里记下拆出了哪几条。',
    submitLabel: '拆分',
    bodyHTML: '<textarea class="rel-split" rows="6" placeholder="第一件事&#10;第二件事&#10;第三件事"></textarea>',
    onSubmit: async () => {
      const raw = relEl.querySelector('.rel-split').value;
      const parts = raw.split('\n').map(s => s.trim()).filter(Boolean);
      if (parts.length < 2) throw new Error('至少写两条（一行一条）');
      const r = await api('POST', '/api/tasks/' + encodeURIComponent(t.id) + '/split',
        { parts: parts.map(title => ({ title })) });
      await refresh();
      drClose();
      toast('已拆成 ' + (r.children?.length || parts.length) + ' 条');
    }
  });
}

async function drUnmerge(t){
  if (!t) return;
  if (!confirm('撤销这次合并？\n\n原始卡片的只读状态会解除，合并出来的这张会被归档留档。')) return;
  try {
    const r = await api('POST', '/api/tasks/' + encodeURIComponent(t.id) + '/unmerge');
    await refresh();
    drClose();
    toast('已撤销合并，' + (r.restored?.length || 0) + ' 张原始卡恢复可编辑');
  } catch (e) { toast('撤销失败：' + e.message); }
}

/* ---------------- 依赖（前置） ----------------
   「这张要等那些做完」。和合并/拆分的区别：那两种是历史事实，
   依赖是当前约束 —— 前置一做完，约束就自动消失，不需要人记着。 */

/* 被拦时的提示文案。要问一次 /blocked：state 里只带条数不带标题
   （每张卡都挂一串前置对象会让返回体膨胀），而被拦只有这一次额外请求。 */
async function blockedText(t){
  try {
    const r = await api('GET', '/api/tasks/' + encodeURIComponent(t.id) + '/blocked');
    const names = (r.waiting || []).map(x => '「' + x.title + '」').slice(0, 3).join('、');
    const more = (r.waiting || []).length > 3 ? ' 等 ' + r.waiting.length + ' 条' : '';
    return '还等' + more + '：' + (names || '前置任务');
  } catch {
    // 拿不到细节就退回条数，别让提示变成一句报错
    return '还等 ' + (t.waiting_count || 0) + ' 条前置没做完';
  }
}

/* 点【等 N】徽章：列出在等谁。和【合】【拆】的浮层同一套材质和位置算法。 */
async function blockedPicker(taskId, anchor){
  closeRel();
  closePicker();
  const wrap = document.createElement('div');
  wrap.className = 'sel-menu links-pick';
  wrap.innerHTML = '<div class="link-list"><div class="sel-empty">读取中…</div></div>';
  document.body.appendChild(wrap);
  relEl = wrap;
  anchor.classList.add('open');

  let data;
  try {
    data = await api('GET', '/api/tasks/' + encodeURIComponent(taskId) + '/blocked');
  } catch (e) {
    wrap.querySelector('.link-list').innerHTML = '<div class="sel-empty">读不到：' + esc(e.message) + '</div>';
    return;
  }
  const list = wrap.querySelector('.link-list');
  const waiting = data.waiting || [];
  list.innerHTML = waiting.length
    ? '<div class="link-cap">还等 ' + waiting.length + ' 条</div>' + waiting.map(x =>
        '<div class="sel-opt" role="option" tabindex="0" data-goto="' + esc(x.id) + '">'
        + '<span>' + esc(x.title) + '</span>'
        + '<span class="sub">' + esc(STATUS_LABEL[x.status] || x.status || '') + '</span></div>').join('')
    : '<div class="sel-empty">前置都做完了，可以开工</div>';

  list.addEventListener('click', e => {
    const row = e.target.closest('[data-goto]');
    if (!row) return;
    closeRel();
    drOpen(row.dataset.goto);
  });

  const r = anchor.getBoundingClientRect();
  wrap.style.left = Math.max(8, Math.min(r.left, window.innerWidth - wrap.offsetWidth - 8)) + 'px';
  const below = r.bottom + 6;
  wrap.style.top = (below + wrap.offsetHeight > window.innerHeight - 8
    ? Math.max(8, r.top - wrap.offsetHeight - 6) : below) + 'px';
}

/* 加前置：从「最近 20 张未完成」里勾选。
   已经等着的、自己、已归档、被合并的都不进候选 —— 列出来只会让人选错。 */
async function drAddDep(t){
  if (!t) return;
  const already = new Set([
    ...(drLinks.asFrom || []).filter(l => l.kind === 'depends_on').map(l => l.to_id)
  ]);
  const pool = (store.tasks || [])
    .filter(x => x.id !== t.id && !x.merged_into && !x.archived_at
      && x.status !== 'done' && !already.has(x.id))
    .slice(0, 20);
  if (!pool.length) { toast('没有可以当前置的卡'); return; }

  const rows = pool.map(x =>
    '<label class="rel-pick"><input type="checkbox" value="' + esc(x.id) + '">'
    + '<span>' + esc(x.title) + '</span>'
    + '<span class="sub">' + esc(x.project || '') + '</span></label>').join('');

  relDialog({
    title: '加前置',
    hint: '勾选「必须先把它们做完」的卡。它们没完成时，这张拖不进「进行中」。',
    submitLabel: '加上',
    bodyHTML: '<div class="rel-picks">' + rows + '</div>',
    onSubmit: async () => {
      const picked = [...relEl.querySelectorAll('input[type=checkbox]:checked')].map(el => el.value);
      if (!picked.length) throw new Error('至少要选一张');
      // 逐条提交：接口是「一对」，而且成环时要知道是哪一条挂在环上
      for (const onId of picked) {
        await api('POST', '/api/tasks/' + encodeURIComponent(t.id) + '/depends', { onTaskId: onId });
      }
      await drLoad();
      await refresh();
      toast('加了 ' + picked.length + ' 条前置');
    }
  });
}

/* 挂到父卡下：单选。
   候选排除：自己 / 自己的后代（会成环）/ 已归档 / 被合并 / 已经有父卡的
   —— 后者的语义是「换父卡」，那属于高级操作，不做进第一版的列表里。 */
async function drSetParent(t){
  if (!t) return;
  // 自己的后代不能当父卡：后端也会拒（成环），但让它出现在列表里就是误导
  const ban = new Set([t.id]);
  const stack = [t.id];
  while (stack.length) {
    const cur = stack.pop();
    for (const x of (store.tasks || [])) {
      if (x.parent_id === cur && !ban.has(x.id)) { ban.add(x.id); stack.push(x.id); }
    }
  }
  const pool = (store.tasks || [])
    .filter(x => !ban.has(x.id) && !x.merged_into && !x.archived_at && !x.parent_id)
    .slice(0, 20);
  if (!pool.length) { toast('没有可以当父卡的卡'); return; }

  const rows = pool.map(x =>
    '<label class="rel-pick"><input type="radio" name="parentpick" value="' + esc(x.id) + '">'
    + '<span>' + esc(x.title) + '</span>'
    + '<span class="sub">' + esc(x.project || '') + '</span></label>').join('');

  relDialog({
    title: '挂到父卡下',
    hint: '选一张卡当上级。层级最多 5 层，超过就该拆项目。挂上之后这张的状态由兄弟项一起决定。',
    submitLabel: '挂上',
    bodyHTML: '<div class="rel-picks">' + rows + '</div>',
    onSubmit: async () => {
      const picked = relEl.querySelector('input[name=parentpick]:checked');
      if (!picked) throw new Error('选一张父卡');
      await api('POST', '/api/tasks/' + encodeURIComponent(t.id) + '/parent', { parentId: picked.value });
      await drLoad();
      await refresh();
      toast('已挂到父卡下');
    }
  });
}

/* ---------------- 目录浏览 ---------------- */

let pickState = { path: null, parent: null, onPick: null };

async function openPicker(startPath, onPick) {
  pickState.onPick = onPick;
  $('#pickDlg').showModal();

  // 起点优先级：已填的路径（存在就进去）→ 它父目录 → 项目里第一个目录 → 用户目录
  let start = String(startPath || '').trim();
  if (start) {
    if (await loadDir(start)) return;          // 能打开就直接用
    // 打不开（路径不存在 / 没权限）：退到父目录
    const cut = start.replace(/[\\/]+$/, '').split(/[\\/]/);
    cut.pop();
    // 分隔符要跟着路径本身走：mac/Linux 是 /，Windows 是 \
    start = cut.length ? cut.join(start.includes('\\') ? '\\' : '/') : '';
  }

  if (!start) {
    const withDir = (store.projects || []).find(p => (p.dirs || []).length);
    if (withDir) start = withDir.dirs[0].path;
  }

  if (start && await loadDir(start)) return;

  // 最后一档：用户目录 -> 第一个盘符
  const r = await api('GET', '/api/browse');
  await loadDir(r.home || (r.roots && r.roots[0] && r.roots[0].path));
}

async function loadDir(target) {
  const list = $('#pickList');
  list.innerHTML = '<div class="pick-empty">读取中…</div>';
  try {
    const r = await api('GET', '/api/browse?path=' + encodeURIComponent(target || ''));
    pickState.path = r.path || null;
    pickState.parent = r.parent || null;
    $('#pickPath').value = r.path || r.home || '';
    $('#pickUp').disabled = !r.parent;

    // 没给 path 时是盘符列表
    if (r.roots) {
      list.innerHTML = r.roots.map(x => `
        <div class="pick-item" data-go="${esc(x.path)}">
          <span class="ico">💽</span><span>${esc(x.name)}</span>
        </div>`).join('') || '<div class="pick-empty">没有可读的盘符</div>';
    } else {
      const parts = [];
      if (r.isProject) parts.push(`<span class="tag2">${r.isGitRepo ? 'git 仓库' : '像项目目录'}</span>`);
      const head = `<div class="pick-item" data-go="${esc(r.path)}" style="cursor:default">
        <span class="ico">📂</span><span style="color:var(--text-3)">当前：${esc(r.path)}</span>${parts.join('')}
      </div>`;
      const rows = (r.dirs || []).map(d => `
        <div class="pick-item" data-go="${esc(d.path)}">
          <span class="ico">📁</span><span>${esc(d.name)}</span>
        </div>`).join('');
      list.innerHTML = head + (rows || '<div class="pick-empty">这个目录下没有子目录</div>');
    }

    list.querySelectorAll('.pick-item[data-go]').forEach((el) => {
      el.addEventListener('click', () => loadDir(el.dataset.go));
    });
    return true;
  } catch (e) {
    list.innerHTML = `<div class="pick-empty">打不开：${esc(e.message)}</div>`;
    return false;
  }
}

$('#pickUp')?.addEventListener('click', () => { if (pickState.parent) loadDir(pickState.parent); });
$('#pickCancel')?.addEventListener('click', () => $('#pickDlg').close());
$('#pickOk')?.addEventListener('click', () => {
  const chosen = pickState.path || $('#pickPath').value;
  if (chosen && pickState.onPick) pickState.onPick(chosen);
  $('#pickDlg').close();
});

let editingProjectId = null;

function renderProjList(){
  const host = $('#projList');
  if (!host) return;
  const list = store.projects || [];
  host.innerHTML = list.map((p, i) => {
    const dirs = (p.dirs || []).map(d => {
      const base = String(d.path || '').split(/[\\/]/).filter(Boolean).pop() || d.path;
      return base + (d.note ? '（' + d.note + '）' : '');
    }).join('、');
    // 手机上 HTML5 拖拽整个不工作（没有 dragstart/drop），
    // 所以排序不能只靠拖。这两个按钮是触屏上唯一能改顺序的入口，
    // 桌面端也留着 —— 一次挪一位比拖拽更准，不会插错位置。
    const fixed = isInbox(p.name);
    const canUp = !fixed && i > 1;                 // 0 号永远是「默认」，1 号上面就是它
    const canDown = !fixed && i < list.length - 1;
    return `<div class="proj-row" data-pid="${p.id}" data-idx="${i}">
      <div>
        <div class="pn">${esc(p.name)}</div>
        ${dirs ? `<div class="dirs">${esc(dirs)}</div>` : ''}
      </div>
      <span class="pc">${p.taskCount || 0}</span>
      ${fixed ? '' : `<button type="button" class="mini-btn proj-step" data-step="-1" data-pid="${p.id}"
        title="上移一位" ${canUp ? '' : 'disabled'}>↑</button>
      <button type="button" class="mini-btn proj-step" data-step="1" data-pid="${p.id}"
        title="下移一位" ${canDown ? '' : 'disabled'}>↓</button>`}
    </div>`;
  }).join('') || '<div class="proj-row"><div class="pn" style="color:var(--text-3)">还没有项目</div></div>';

  host.querySelectorAll('.proj-row[data-pid]').forEach(row => {
    row.addEventListener('click', (e) => {
      // 上下移按钮有自己的行为，别让它顺手把项目编辑器也打开
      if (e.target.closest('.proj-step')) return;
      openProjectEditor(row.dataset.pid);
    });
  });
  host.querySelectorAll('.proj-step').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await moveProjectStep(btn.dataset.pid, Number(btn.dataset.step));
    });
  });
}

/* 把项目往上/下挪一位。和拖拽走同一个接口，只是用「相邻交换」算目标顺序 —
   挪一位不需要知道落点在哪一行，比拖拽更不容易插错。 */
async function moveProjectStep(id, step){
  const list = (store.projects || []).slice();
  const from = list.findIndex(p => p.id === id);
  if (from < 0) return;
  // 「默认」钉在 0，「其它项目」从 1 开始，所以越界判断是 1 和 length-1
  const to = from + step;
  if (to < 1 || to >= list.length) return;
  const [moved] = list.splice(from, 1);
  list.splice(to, 0, moved);
  store.projects = list;
  renderProjList();
  try {
    const r = await api('POST', '/api/projects/reorder',
      { ids: list.filter(p => !isInbox(p.name)).map(p => p.id) });
    if (r.projects) { store.projects = r.projects; renderProjList(); renderSidebar(); }
    else renderSidebar();
  } catch (err) {
    toast('排序没存上：' + err.message);
    await refresh();
    renderProjList();
  }
}

function dirRow(d = {}){
  const wrap = document.createElement('div');
  wrap.className = 'dir-row';
  // 两行：路径独占一行（它最长），说明 + 主副 + 删除挤第二行。
  // 挤成一行时总宽 430 > 弹窗可用宽 394，底部就多一条横向滚动条。
  wrap.innerHTML = `
    <div class="dir-line">
      <input class="dp" placeholder="点右边选目录，或直接粘贴路径" value="${esc(d.path || '')}">
      <button type="button" class="pick" title="浏览目录">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
    </div>
    <div class="dir-line">
      <input class="dn" placeholder="说明（可选）" value="${esc(d.note || '')}">
      <select class="dm sel-native" data-sel="inline" title="这个目录是不是该项目的主目录">
        <option value="">副目录</option>
        <option value="1" ${d.primary ? 'selected' : ''}>主要目录</option>
      </select>
      <button type="button" class="rm" title="移除这个目录" aria-label="移除这个目录">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M10 11v6M14 11v6"/></svg>
      </button>
    </div>
  `;
  // 目录行还没插进文档，只能在自己的容器里找（传 document 会找不到）
  buildSels(wrap);
  // buildSels 只"套壳"，不填菜单内容 —— 不调 selSync 的话这个「副/主要」
  // 下拉点开是个空菜单（菜单里 0 条），用户看到的就是"点开什么也没有"。
  // STYLE.md 第八节第 6 条记的就是这个坑。
  selSync();
  wrap.querySelector('.rm').addEventListener('click', () => wrap.remove());
  wrap.querySelector('.pick').addEventListener('click', async () => {
    const input = wrap.querySelector('.dp');
    const current = input.value.trim();

    // 先试系统原生对话框 —— 一次点完，不用逐层走
    const btn = wrap.querySelector('.pick');
    const ico = btn.innerHTML;          // 图标要还原，不能把 svg 换成文字
    btn.disabled = true;
    btn.classList.add('busy');
    try {
      const r = await api('POST', '/api/pickdir', { initial: current });
      if (r.path) { input.value = r.path; return; }
      return;                       // 用户取消了，什么都不做
    } catch (e) {
      // 系统对话框不可用（非 Windows / 缺脚本），退到页面浏览
      console.warn('原生对话框不可用，改用页面浏览：', e.message);
    } finally {
      btn.disabled = false;
      btn.classList.remove('busy');
      btn.innerHTML = ico;
    }

    openPicker(current, (chosen) => { input.value = chosen; });
  });
  return wrap;
}

    return;
  }

  // 【合】/【拆】徽章：被合并的旧卡在看板上不占位，这块浮层是它们唯一的入口
  const rel = e.target.closest('[data-rel]');
  if (rel) {
    e.stopPropagation();
    if (relEl) { closeRel(); return; }        // 再点一次收起
    relPicker(rel.dataset.rel, rel);
    return;
  }

  // 【等 N】徽章：列出在等哪几条前置。和【合】【拆】是同一排徽章、同一套浮层。
  const blocked = e.target.closest('[data-blocked]');
  if (blocked) {
    e.stopPropagation();
    if (relEl) { closeRel(); return; }
    blockedPicker(blocked.dataset.blocked, blocked);
    return;
  }

  // 点浮层外面收起
  if (pickerEl && !pickerEl.contains(e.target)) closePicker();
  if (relEl && !relEl.contains(e.target)) closeRel();

  const unarchive = e.target.closest('[data-unarchive]');
  if (unarchive) {
    e.stopPropagation();
    const t = (store.tasks || []).find(x => x.id === unarchive.dataset.unarchive);
    try {
      await api('PATCH', '/api/tasks/' + encodeURIComponent(unarchive.dataset.unarchive),
        { archived_at: null });
      await refresh();
      toast('已取回' + (t ? '：「' + t.title + '」' : ''));
    } catch (err) { toast('取回失败：' + err.message); }
    return;
  }

  // 缩略图和对话气泡里的图都能点开放大
  const img = e.target.closest('.shots img, .dm .atts img');
  if (img) {
    const lb = $('#lightbox');
    lb.querySelector('img').src = img.src;
    lb.classList.add('on');
  }
});
$('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('on'));

// 拖图进窗口
let dragDepth = 0;
document.addEventListener('dragenter', e => {
  if (e.dataTransfer?.types?.includes('Files')) { e.preventDefault(); dragDepth++; $('#drop').classList.add('on'); }
});
document.addEventListener('dragleave', e => {
  if (e.dataTransfer?.types?.includes('Files')) { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); } }
});
document.addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
document.addEventListener('drop', async e => {
  const dropped = [...(e.dataTransfer?.files || [])];
  if (!dropped.length) return;
  e.preventDefault();
  dragDepth = 0;
  $('#drop').classList.remove('on');
  if (collapsed) setCollapsed(false);
  for (const f of dropped) await uploadFile(f);
});

// 快捷键
document.addEventListener('keydown', e => {
  const typing = /input|textarea|select/i.test(document.activeElement.tagName);

  if (e.key === 'Escape') {
    $('#lightbox').classList.remove('on');
    if (relEl) { closeRel(); return; }
    if (docDrag) { docDrag = null; $('#drSplit')?.classList.remove('hot'); return; }
    // 一层一层退：先收预览栏，再关抽屉
    if ($('#drawer')?.classList.contains('doc-on')) { drDocClose(); return; }
    if ($('#drawer')?.classList.contains('on')) drClose();
    return;
  }

  if (e.key === '[' && !typing && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); setCollapsed(!collapsed); return;
  }
  if (e.key === ',' && !typing && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); openSettings(); return;
  }
  if (e.key === 'n' && !typing && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    if (collapsed) setCollapsed(false);
    setTimeout(() => $('#text')?.focus(), 200);
  }
});

/* ---------------- 首屏加载 + 轮询 ---------------- */

// 首屏失败不能只插一行红字：用户除了刷新没别的办法，而且不知道能不能恢复。
// 给个「重试」，点一下重新拉。
function ensureBootBar(){
  let bar = document.getElementById('bootBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'bootBar';
    document.body.insertBefore(bar, document.body.firstChild);
  }
  document.body.classList.add('boot-open');
  return bar;
}

function clearBootBar(){
  document.getElementById('bootBar')?.remove();
  document.body.classList.remove('boot-open');
}

function showBootError(err){
  const bar = ensureBootBar();
  bar.className = 'boot-bar bad';
  bar.innerHTML = '连不上任务服务：' + esc(err.message)
    + ' <button type="button" id="bootRetry">重试</button>';
  document.getElementById('bootRetry').onclick = () => boot();
}

function showStaleBar(info){
  const bar = ensureBootBar();
  bar.className = 'boot-bar warn';
  bar.innerHTML = '后端还是旧版本（v' + esc(info.version || '?') + '），'
    + '改过的代码没有生效。<b>重启服务</b>后这里会自己消失。';
}

async function boot(){
  clearBootBar();
  try {
    await refresh();
  } catch (e) {
    showBootError(e);
    return;
  }
  if (store.build?.stale) showStaleBar(store.build);
}

// 页面在后台时不轮询：看板全量拉一次不便宜（2000 条任务约 0.93MB），
// 而隐藏的标签页没人看。切回来立刻补一次，不会出现数据是旧的。
const POLL_MS = 3000;
let pollTimer = null;

function startPolling(){
  if (pollTimer) return;
  pollTimer = setInterval(() => {
    if (document.hidden) return;
    refresh({ poll: true }).then(() => {
      if (store.build?.stale) showStaleBar(store.build);
    }).catch(() => {});
  }, POLL_MS);
}

// 切回前台不能拿 since：后台这段时间库里可能变过，但轮询没跑，
// 手上的 revision 是旧的。用 since 会走到 unchanged 分支，看板停在上次的样子。
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  refresh().then(() => {
    if (store.build?.stale) showStaleBar(store.build);
  }).catch(() => {});
});

boot().finally(startPolling);
</script>
