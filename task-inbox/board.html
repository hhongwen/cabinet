/* ---------------- 自定义下拉 ----------------
   原生 select 保留为状态源（.sel-native，视觉隐藏），
   上面盖一层 .sel：自定义按钮 + 玻璃菜单，样式可控、键盘可用。 */

const selList = [];

// root 默认是 document；动态生成还没插进文档的片段要传自己的容器，
// 否则 querySelectorAll 找不到里面的 select（目录行就踩过这个坑）。
function buildSels(root = document){
  // 筛选条用紧凑档；data-sel="field" 表单档；data-sel="inline" 行内小号。
  // 幂等：已经包过的跳过，这样动态新增的 select 可以再调一次。
  root.querySelectorAll('select.sel-native').forEach(native => {
    if (native.previousElementSibling?.classList?.contains('sel')) return;
    const wrap = document.createElement('div');
    const mode = native.dataset.sel || '';
    wrap.className = 'sel' + (mode === 'field' ? ' sel--field' : mode === 'inline' ? ' sel--inline' : '');
    wrap.innerHTML =
      '<button type="button" class="sel-btn" aria-haspopup="listbox" aria-expanded="false">'
        + '<span class="lbl"></span>'
        + '<svg class="carw" viewBox="0 0 12 12" fill="none" aria-hidden="true">'
        + '<path d="M2.6 4.6L6 8l3.4-3.4" stroke="currentColor" stroke-width="1.5" '
        + 'stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '</button>'
      + '<div class="sel-menu" role="listbox" tabindex="-1"></div>';
    native.parentNode.insertBefore(wrap, native);
    native.setAttribute('tabindex', '-1');
    native.setAttribute('aria-hidden', 'true');

    const btn = wrap.querySelector('.sel-btn');
    const menu = wrap.querySelector('.sel-menu');
    const rec = { native, wrap, btn, menu, hot: -1 };
    selList.push(rec);

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = wrap.classList.contains('open');
      closeAllSels();
      if (!open) openSel(rec);
    });
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault(); openSel(rec); focusHot(rec, 0);
      }
    });
    menu.addEventListener('click', (e) => {
      const opt = e.target.closest('.sel-opt');
      if (opt) pickSel(rec, opt.dataset.value);
    });
    wrap.addEventListener('keydown', (e) => {
      if (!wrap.classList.contains('open')) return;
      if (e.key === 'Escape') { e.preventDefault(); closeAllSels(); btn.focus(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); focusHot(rec, rec.hot + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); focusHot(rec, rec.hot - 1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        const opt = menu.querySelectorAll('.sel-opt')[rec.hot];
        if (opt) pickSel(rec, opt.dataset.value);
      }
    });
    native.addEventListener('change', () => selSync());
  });

  // 全局收起只挂一次：buildSels 会被目录行重复调用，
  // 每次都加一对 document 监听就是内存泄漏（还会让 Escape 逻辑跑 N 遍）。
  if (!buildSels.bound) {
    buildSels.bound = true;
    document.addEventListener('click', closeAllSels);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAllSels();
    });
  }
}

function selSync(){
  selList.forEach(rec => {
    const { native, wrap, btn, menu } = rec;
    const val = native.value;
    const opts = [...native.options];
    const hit = opts.find(o => o.value === val);
    btn.querySelector('.lbl').textContent = hit ? hit.textContent : (opts[0]?.textContent || '');
    // 只有筛选条那档才有"已筛选"高亮；表单/行内档永远有值，高亮反而像报错
    const isCompact = !wrap.classList.contains('sel--field') && !wrap.classList.contains('sel--inline');
    wrap.classList.toggle('on', isCompact && !!val && !!hit && hit.value !== '');
    menu.innerHTML = opts.length
      ? opts.map(o => {
          const sel = o.value === val ? 'true' : 'false';
          return '<div class="sel-opt" role="option" aria-selected="' + sel
            + '" data-value="' + esc(o.value) + '"><span>' + esc(o.textContent) + '</span></div>';
        }).join('')
      : '<div class="sel-empty">没有可选项</div>';
    if (rec.hot >= opts.length) rec.hot = opts.length - 1;
  });
}

function openSel(rec){
  closeAllSels();
  rec.wrap.classList.add('open');
  rec.btn.setAttribute('aria-expanded', 'true');
  const sel = [...rec.menu.querySelectorAll('.sel-opt')]
    .findIndex(o => o.getAttribute('aria-selected') === 'true');
  rec.hot = sel;
  // 菜单超出视口右边就翻到右侧对齐
  rec.menu.style.left = '0';
  rec.menu.style.right = 'auto';
  requestAnimationFrame(() => {
    const r = rec.menu.getBoundingClientRect();
    if (r.right > window.innerWidth - 8) {
      rec.menu.style.left = 'auto';
      rec.menu.style.right = '0';
      rec.menu.style.transformOrigin = 'top right';
    }
  });
}

function closeAllSels(){
  selList.forEach(rec => {
    rec.wrap.classList.remove('open');
    rec.btn.setAttribute('aria-expanded', 'false');
    rec.menu.querySelectorAll('.hot').forEach(el => el.classList.remove('hot'));
  });
}

function focusHot(rec, i){
  const opts = [...rec.menu.querySelectorAll('.sel-opt')];
  if (!opts.length) return;
  rec.hot = Math.max(0, Math.min(i, opts.length - 1));
  opts.forEach((el, k) => el.classList.toggle('hot', k === rec.hot));
  const el = opts[rec.hot];
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function pickSel(rec, value){
  rec.native.value = value;
  rec.native.dispatchEvent(new Event('change', { bubbles: true }));
  closeAllSels();
  rec.btn.focus();
}

/* ---------------- 模型选择：可搜索组合框 ----------------
   原来是一个 input + <datalist>，弹出层是浏览器原生的，
   跟页面材质完全不搭（灰底、无圆角、条目挤成一行）。
   现在自己渲染菜单：输入即过滤，上下键选，Enter 确认，也允许自由输入。 */

let modelItems = [];        // [{ id, name, vision }]
let modelHot = -1;
let modelOpen = false;

function modelFilter(q){
  const s = String(q || '').trim().toLowerCase();
  if (!s) return modelItems;
  return modelItems.filter(m =>
    String(m.id).toLowerCase().includes(s) || String(m.name || '').toLowerCase().includes(s));
}

function renderModelMenu(q){
  const menu = $('#modelMenu');
  if (!menu) return;
  const list = modelFilter(q);
  if (!modelItems.length) {
    menu.innerHTML = '<div class="sel-empty">没有拉到模型清单</div>';
    return;
  }
  if (!list.length) {
    menu.innerHTML = '<div class="sel-empty">没有匹配的模型，回车就用你输入的这句</div>';
    return;
  }
  const cur = $('#c-model').value.trim();
  menu.innerHTML = list.map((m, i) => {
    const sel = m.id === cur ? 'true' : 'false';
    const sub = m.vision ? '<span class="sub">图片</span>' : '';
    return '<div class="sel-opt" role="option" aria-selected="' + sel
      + '" data-idx="' + i + '"><span>' + esc(m.id) + '</span>' + sub + '</div>';
  }).join('');
  modelHot = Math.min(Math.max(modelHot, 0), list.length - 1);
  markModelHot();
}

function markModelHot(){
  const opts = [...document.querySelectorAll('#modelMenu .sel-opt')];
  opts.forEach((el, k) => el.classList.toggle('hot', k === modelHot));
  const el = opts[modelHot];
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function openModelMenu(q){
  const wrap = $('#modelCombo');
  if (!wrap) return;
  modelOpen = true; modelHot = 0;
  wrap.classList.add('open');
  $('#c-model').setAttribute('aria-expanded', 'true');
  renderModelMenu(q);
}

function closeModelMenu(){
  const wrap = $('#modelCombo');
  if (!wrap) return;
  modelOpen = false;
  wrap.classList.remove('open');
  $('#c-model').setAttribute('aria-expanded', 'false');
}

function pickModel(id){
  $('#c-model').value = id;
  closeModelMenu();
  $('#c-model').focus();
}

function wireModelCombo(){
  const wrap = $('#modelCombo');
  const input = $('#c-model');
  const menu = $('#modelMenu');
  if (!wrap || !input || !menu) return;

  input.addEventListener('focus', () => openModelMenu(input.value));
  input.addEventListener('input', () => { modelHot = 0; openModelMenu(input.value); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!modelOpen) return openModelMenu(input.value);
      modelHot = Math.min(modelHot + 1, modelFilter(input.value).length - 1);
      markModelHot();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      modelHot = Math.max(modelHot - 1, 0);
      markModelHot();
    } else if (e.key === 'Enter') {
      const list = modelFilter(input.value);
      if (modelOpen && list[modelHot]) { e.preventDefault(); pickModel(list[modelHot].id); }
      else closeModelMenu();
    } else if (e.key === 'Escape') {
      closeModelMenu();
    }
  });

  $('#modelToggle')?.addEventListener('click', (e) => {
    e.preventDefault();
    if (modelOpen) closeModelMenu();
    else { input.focus(); openModelMenu(''); }
  });

  menu.addEventListener('click', (e) => {
    const opt = e.target.closest('.sel-opt');
    if (!opt) return;
    const m = modelFilter(input.value)[Number(opt.dataset.idx)];
    if (m) pickModel(m.id);
  });

  // 点别处收起
  document.addEventListener('click', (e) => {
    if (!modelOpen) return;
    if (!wrap.contains(e.target)) closeModelMenu();
  });
}

function syncFilterUI(){
  const proj = $('#project');
  if (proj) proj.value = navProject;
  // 选中的筛选项高亮，未选中的低调。项目那格看 navProject ——
  // 项目筛选只有一个来源，filters.project 那一路已经删掉了
  [['#project', navProject], ['#priority', filters.priority], ['#category', filters.category]]
    .forEach(([sel, val]) => { const el = $(sel); if (el) el.classList.toggle('on', !!val); });
  selSync();
  const reset = $('#fltReset');
  if (reset) reset.hidden = !(navProject || filters.priority || filters.category);
  const crumb = $('#crumbView');
  // 面包屑跟着视图走：它回答「我现在在哪一层」，不是装饰
  const VIEW_CRUMB = { clarify: 'CLARIFY', archived: 'ARCHIVED' };
  if (crumb) {
    crumb.textContent = navProject
      ? (isInbox(navProject) ? 'INBOX' : navProject.toUpperCase())
      : (VIEW_CRUMB[navView] || 'OVERVIEW');
  }
  const h1 = document.querySelector('header.top h1');
  if (h1) {
    const map = { all: '全部任务', todo: '未开始', doing: '进行中', done: '已完成',
      clarify: '待澄清', archived: '归档' };
    // 「默认」是收件筐，标题不能只写「默认」两个字 —— 那看起来像个普通项目
    const title = isInbox(navProject) ? '未分配' : navProject;
    h1.textContent = title || (navView === 'board'
      ? (map[navFilter] || '全部任务')
      : (map[navView] || '全部任务'));
  }
}

/* 顶部状态导航（全部 / 未开始 / 进行中 / 已完成）*/
document.querySelectorAll('#navMenu .nav-link[data-filter]').forEach(el => {
  el.addEventListener('click', () => {
    navFilter = el.dataset.filter;
    navView = 'board';
    navProject = '';

/* ---------------- 布局：底栏收起 / 自动撑高 ---------------- */

const LS_C = 'ti.dockCollapsed';
let collapsed = false;

function autoGrow(){
  const ta = $('#text');
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
}

function initLayout(){
  if (SOLO) { document.body.classList.add('solo'); return; }

  if (localStorage.getItem(LS_SIDE) === '1') setSidebar(true);

  collapsed = localStorage.getItem(LS_C) === '1';
  $('#app').classList.toggle('collapsed', collapsed);

  autoGrow();
  $('#text').addEventListener('input', autoGrow);
  window.addEventListener('resize', autoGrow);

function setCollapsed(v){

  $('#app').classList.toggle('collapsed', v);
  localStorage.setItem(LS_C, v ? '1' : '0');
  if (!v) setTimeout(() => { autoGrow(); $('#text')?.focus(); }, 60);

/* ---------------- 看板 ---------------- */

/* 视图内部还要过的两道门：状态列（只在 board 有意义）+ 顶部筛选条的优先级 / 类别。
   项目筛选不在这里 —— 它已经由 inView() 按「默认」的收件筐语义处理过了。 */
function matches(t){
  if (navView === 'board' && navFilter !== 'all' && t.status !== navFilter) return false;
  if (filters.priority && t.priority !== filters.priority) return false;
  if (filters.category && t.category !== filters.category) return false;
  return true;
}

/* 当前视图里该看见的任务。归档视图按 done_at 倒序 —— 那是个"翻旧账"的清单，
   新的在上面才符合直觉。 */
function visibleTasks(){
  const list = (store.tasks || []).filter(t => inView(t) && matches(t));
  if (navView === 'archived') {
    list.sort((a, b) => String(b.done_at || b.archived_at || '')
      .localeCompare(String(a.done_at || a.archived_at || '')));
  }
  return list;
}

/* 单列铺开：待澄清 / 归档 / 未分配筐都不是流水线三列，只是一串任务 */
function singleColumn(){
  if (navView === 'clarify') return { key: 'clarify', label: '待澄清', color: 'var(--draft-ink)' };
  if (navView === 'archived') return { key: 'archived', label: '归档', color: 'var(--text-3)' };
  if (isInbox(navProject)) return { key: 'inbox', label: '未分配', color: 'var(--neutral-ink)' };
  return null;
}

function cardHTML(t){
  const meta = [];
  const isDraft = t.dev_ready === false;
  const isArch = !!t.archived_at;
  meta.push(`<span class="tag" style="color:${PRI_COLOR[t.priority] || 'var(--text-3)'};background:${(PRI_COLOR[t.priority]||'var(--text-3)')}22">${PRI_LABEL[t.priority] || '普通'}</span>`);
  if (t.category) meta.push(`<span class="tag cat">${esc(t.category)}</span>`);
  if (t.project && !isInbox(t.project)) meta.push(`<span class="tag">${esc(t.project)}</span>`);
  if (t.kind && t.kind !== 'text') meta.push(`<span class="kind">${KIND_LABEL[t.kind] || ''}</span>`);
  // 待澄清：淡紫标签。它表示"卡住了等人"，不是待办也不是完成
  if (isDraft) meta.push('<span class="tag draft">待澄清</span>');
  const shots = (t.payload && t.payload.images && t.payload.images.length)
    ? '<div class="shots">' + t.payload.images.slice(0, 4).map(src => `<img src="${esc(imgUrl(src))}" alt="" loading="lazy">`).join('') + '</div>'
    : '';
  const fileCount = (t.payload && t.payload.files && t.payload.files.length) || 0;
  const fileRow = fileCount
    ? `<div class="files">📎 ${fileCount} 个附件</div>` : '';
  const cls = t.classify_state === 'pending'
    ? '<span class="tag pending">判断中…</span>'
    : t.classify_state === 'failed'
      ? `<span class="tag failed" title="${esc(t.classify_reason||'')}">未判断</span>` : '';
  /* 项目入口：两种状态都要有，位置也必须在同一处。
     - 模型判不出项目（needs_project）→ 橙色「选项目」，是"来处理一下"
     - 明确归到「默认」但没标 needs_project → 灰色「默认」，是"记着它未分配"
     待澄清的卡片不给这个入口：它还没到分项目那一步，给出来会让人以为能跳过澄清。 */
  let projBadge = '';
  if (!isDraft && !isArch) {
    if (t.needs_project) projBadge = '<span class="badge-need" data-assign="' + t.id + '">选项目</span>';
    else if (isInbox(t.project)) projBadge = '<span class="badge-default" data-assign="' + t.id + '" title="它还在未分配筐里，点一下归到真项目">默认</span>';
  }
  // 归档视图里唯一要干的事就是取回。单独一行 —— meta 行是 nowrap+18px 定高，
  // 塞进去会被 overflow 裁掉，正好落在"最该点的按钮点不到"这个坑里
  const act = isArch
    ? '<div class="card-foot"><button type="button" class="card-act" data-unarchive="'
      + esc(t.id) + '" title="取回：回到已完成列">取回</button></div>'
    : '';
  // 待澄清卡片：只露第一条缺什么，其余去抽屉里看。整串塞进卡片会把高度撑爆
  const gap = (isDraft && t.dev_gaps && t.dev_gaps.length)
    ? `<div class="card-gap" title="${esc(t.dev_gaps.join('；'))}">还缺：${esc(t.dev_gaps[0])}${t.dev_gaps.length > 1 ? ' …' : ''}</div>`
    : '';
  const klass = ['card', t.status === 'done' ? 'done' : '', isArch ? 'archived' : '']
    .filter(Boolean).join(' ');
  return `
    <div class="${klass}" draggable="${isArch ? 'false' : 'true'}" data-id="${esc(t.id)}"
         style="--bar:${PRI_COLOR[t.priority] || 'var(--p3)'}">
      <div class="t">${esc(t.title)}</div>
      ${gap}
      <div class="meta">${meta.join('')}${projBadge}${cls}<span class="time">${ago(t.created_at)}</span></div>
      ${shots}${fileRow}${act}
    </div>`;
}

function emptyHint(){
  if (navView === 'clarify') return '都澄清完了';
  if (navView === 'archived') return '还没有归档的任务';
  if (isInbox(navProject)) return '筐是空的';
  return '空';
}

function bindDrag(){
  document.querySelectorAll('.card').forEach(el => {
    // 归档的卡片不可拖：它已经出了流水线，拖回去要显式「取回」
    if (el.getAttribute('draggable') === 'false') {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.shots img') || e.target.closest('[data-unarchive]')) return;
        drOpen(el.dataset.id);
      });
      return;
    }
    el.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', el.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      el.style.opacity = '.4';
    });
    el.addEventListener('dragend', () => { el.style.opacity = ''; });
    el.addEventListener('click', (e) => {
      // 缩略图、徽章、取回按钮有自己的行为，别抢
      if (e.target.closest('.shots img') || e.target.closest('[data-assign]')
        || e.target.closest('[data-unarchive]')) return;
      drOpen(el.dataset.id);
    });
  });

  // 单列视图（待澄清 / 归档 / 未分配）没有「列」可落，就不绑 dragover/drop
  if (navView !== 'board' || isInbox(navProject)) return;
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', async e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const status = col.dataset.col;
      if (!id || !status) return;
      const t = store.tasks.find(x => x.id === id);
      // 待澄清的任务还没到能开工那一步：拖到进行中/已完成一律不动
      if (t && t.dev_ready === false) { toast('先去「待澄清」确认可以开工'); return; }
      if (t && t.archived_at) return;
      try {
        await api('POST', `/api/tasks/${encodeURIComponent(id)}/move`, { status });
        await refresh();
        toast(status === 'done' ? '完成' : status === 'doing' ? '进行中' : '已挪回未开始');
      } catch (err) { toast('失败：' + err.message); }
    });
  });
}

async function api(method, url, body){
  const res = await fetch(url, {
    method,
    headers: body ? { 'content-type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

// 轮询带 since=上次的 revision。库里没变时后端只回几十字节，
// 前端直接跳过 —— 不做 syncFilters/render，滚动位置也就不会被重置。
//
// 全量一次拿（include_archived=1），视图过滤全在前端做：轮询只发一条请求，
// 切视图是纯本地操作，不用来回打服务端。只有这一个 URL，所以 since 逻辑不会串。
async function refresh(opts){
  const since = opts && opts.poll ? store.revision : null;
  const qs = ['include_archived=1'];
  if (since) qs.push('since=' + encodeURIComponent(since));
  const url = '/api/state?' + qs.join('&');
  const next = await api('GET', url);
  if (next.unchanged) {
    // 库没变，但 build 信息可能变了（比如磁盘代码被改了）——顺手更新一下
    if (next.build) store.build = next.build;
    return false;
  }
  store = next;
  syncFilters();
  syncFilterUI();
  render();
  return true;
}

function syncFilters(){

  const names = store.projects.map(p => p.name);
  if (names.includes(keep)) proj.value = keep;

  const cats = [...new Set(store.tasks.map(t => t.category).filter(Boolean))].sort();
  const cat = $('#category');
  const keepCat = cat.value;
  cat.innerHTML = '<option value="">全部类别</option>' +
    cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if (cats.includes(keepCat)) cat.value = keepCat;


}

let images = [];   // {path,url,name}
let files = [];    // {path,name,original,size}
let pending = 0;

// 提示只活 6 秒。以前只写不清，判完那条「P2 常规 · 工作」会一直卡在底栏，
// 看着像默认标签 —— 其实它是上一次判断的回声（DOCK-1）。
const SAY_TTL = 6000;
function say(t, cls){
  const el = $('#msg');
  el.textContent = t;
  el.className = 'cap-msg ' + (cls||'');
  clearTimeout(say._t);
  if (!t) return;
  say._t = setTimeout(() => {
    // 只清自己写的那句：这 6 秒里可能又有新提示写进来了，别把新的抹掉
    if (el.textContent === t) { el.textContent = ''; el.className = 'cap-msg'; }
  }, SAY_TTL);
}

function refreshGo(){
  $('#go').disabled = (! $('#text').value.trim()) && !images.length && !files.length;
}

function humanSize(n){
  if (n < 1024) return n + 'B';
  if (n < 1024*1024) return Math.round(n/1024) + 'KB';
  return (n/1024/1024).toFixed(1) + 'MB';
}

function renderThumbs(){
  const parts = [];
  images.forEach((im, k) => {
    parts.push(`<div class="thumb"><img src="${esc(im.url)}" alt="">
      <button data-k="img" data-i="${k}" title="移除">✕</button></div>`);
  });
  files.forEach((f, k) => {
    parts.push(`<div class="thumb file" title="${esc(f.original || f.name)}">
      <span class="fext">${esc((f.original||'').split('.').pop()?.slice(0,4) || 'FILE')}</span>
      <small>${esc(humanSize(f.size||0))}</small>
      <button data-k="file" data-i="${k}" title="移除">✕</button></div>`);
  });
  $('#thumbs').innerHTML = parts.join('');
  $('#thumbs').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.k === 'img') images.splice(+b.dataset.i, 1);
      else files.splice(+b.dataset.i, 1);
      renderThumbs(); refreshGo();
    });
  });
  refreshGo();
}

function readAsDataUrl(f){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.readAsDataURL(f);
  });
}

// 图片走 /api/upload（会自动落到 images/），其他文件带 filename
async function uploadFile(f){
  pending++;
  try {
    const dataUrl = await readAsDataUrl(f);
    const isImage = f.type.startsWith('image/');
    const body = isImage ? { dataUrl } : { dataUrl, filename: f.name };
    const d = await api('POST', '/api/upload', body);
    if (isImage) images.push({ path: d.path, url: d.url, name: f.name });
    else files.push({ path: d.path, name: d.name, original: d.original || d.name, size: d.size || f.size });
    renderThumbs();
    return true;
  } catch (e) {
    say('上传失败：' + e.message, 'err');
    return false;
  } finally {
    pending--;
  }
}

async function submit(){
  const text = $('#text').value.trim();
  if (!text && !images.length && !files.length) return;
  if (pending) { say('还有文件正在上传…', 'err'); return; }

  // 类型和优先级都交给模型判断，这里只给个兜底标题
  const fallback = text || (images.length ? '截图' : files[0]?.original || '附件');

  const body = {
    title: fallback.split('\n')[0].slice(0, 120),
    text: text || null,
    images: images.map(i => i.path),
    files: files.map(f => f.path),
    source: 'quick'
  };

  $('#go').disabled = true;
  try {
    const t = await api('POST', '/api/tasks', body);
    $('#text').value = '';
    images = [];
    files = [];
    renderThumbs();
    autoGrow();
    refreshGo();
    say('已收下，正在判断…', 'ok');
    $('#text').focus();
    await refresh();
    watchClassify(t.id);
  } catch (err) {
    say(err.message, 'err');
    refreshGo();
  }
}

// 盯着这一条，分类完成后刷新看板
async function watchClassify(id){
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 700));
    const t = store.tasks.find(x => x.id === id);
    if (!t) { await refresh(); continue; }
    if (t.classify_state && t.classify_state !== 'pending') {
      await refresh();
      const now = store.tasks.find(x => x.id === id);
      if (now) say((PRI_LABEL[now.priority] || '') + ' · ' + (now.category || '未分类'), 'ok');
      return;
    }
  }
}

/* ---------------- 文档预览栏 ----------------
   为什么要有：抽屉里那块 44vh 的详情区，一条需求只能露出三分之一。
   这里给一份占满高度的阅读窗，左栏留着改字段和对话。

   宽度只有一个来源：--dr-pane-w（左栏）。整条抽屉 = 左栏 + 分隔条 + 预览，
   所以改左栏宽度就等于改预览宽度，不需要第二个变量跟着同步。 */

const LS_DRW = 'ti.drPaneW';
let drDocMode = 'brief';        // brief | raw
let docDrag = null;

function drDocPaneW(){
  const v = Number(localStorage.getItem(LS_DRW));
  return Number.isFinite(v) && v >= 360 ? v : 460;
}

/* 视口太窄就不并排了：两栏各剩不到 400，左右都难受。
   这时让预览铺满整条抽屉（.doc-full），左栏暂时收起。 */
function drDocFit(){
  const el = $('#drawer');
  if (!el?.classList.contains('doc-on')) return;
  const vw = window.innerWidth;
  const full = vw < 1080;
  el.classList.toggle('doc-full', full);
  if (full) return;
  const total = Math.min(1180, vw - 24);
  const pane = Math.min(drDocPaneW(), Math.max(360, total - 380));
  el.style.setProperty('--dr-wide-w', total + 'px');
  el.style.setProperty('--dr-pane-w', pane + 'px');
}

function drDocOpen(mode){
  drDocMode = mode || 'brief';
  const el = $('#drawer');
  if (!el) return;
  el.classList.add('doc-on');
  drDocFit();
  drDocSyncTabs();
  drDocRender();
}

function drDocClose(){
  const el = $('#drawer');
  if (!el) return;
  el.classList.remove('doc-on', 'doc-full');
  el.style.removeProperty('--dr-wide-w');
  el.style.removeProperty('--dr-pane-w');
}

function drDocSyncTabs(){
  $('#drDocTabs')?.querySelectorAll('.doc-tab').forEach(b => {
    b.classList.toggle('on', b.dataset.doc === drDocMode);
  });
}

function drDocSource(t){
  const task = t || drTask;
  if (!task) return '';
  if (drDocMode === 'raw') {
    const parts = [];
    if (task.payload?.text) parts.push(String(task.payload.text));
    if (task.payload?.urls?.length) parts.push('链接：\n' + task.payload.urls.join('\n'));
    return parts.join('\n\n');
  }
  return String(task.brief || '');
}

function drDocRender(){
  const host = $('#drDocBody');
  if (!host || !$('#drawer')?.classList.contains('doc-on')) return;
  const src = drDocSource();
  host.innerHTML = src ? '<div class="doc-md">' + mdToHtml(src) + '</div>' : '';
  host.scrollTop = 0;
}

$('#drDocClose')?.addEventListener('click', drDocClose);
$('#drDocTabs')?.addEventListener('click', (e) => {
  const btn = e.target.closest('.doc-tab');
  if (!btn) return;
  drDocMode = btn.dataset.doc;
  drDocSyncTabs();
  drDocRender();
});
$('#drDocCopy')?.addEventListener('click', async () => {
  const src = drDocSource();
  if (!src) { toast('没有内容可复制'); return; }
  try {
    await navigator.clipboard.writeText(src);
    toast('已复制 markdown 原文');
  } catch {
    toast('复制失败：浏览器不给剪贴板权限');
  }
});

/* 拖动分隔条。宽度在 pointermove 里就写进 --dr-pane-w：
   等到 pointerup 才算的话，整个拖动过程没有反馈，像卡住了。 */
$('#drSplit')?.addEventListener('pointerdown', (e) => {
  const el = $('#drawer');
  if (!el?.classList.contains('doc-on') || el.classList.contains('doc-full')) return;
  docDrag = { left: el.getBoundingClientRect().left, max: el.getBoundingClientRect().width - 340 };
  e.target.setPointerCapture?.(e.pointerId);
  e.target.classList.add('hot');
  e.preventDefault();
});

$('#drSplit')?.addEventListener('pointermove', (e) => {
  if (!docDrag) return;
  const w = Math.max(360, Math.min(docDrag.max, e.clientX - docDrag.left));
  $('#drawer').style.setProperty('--dr-pane-w', Math.round(w) + 'px');
});

$('#drSplit')?.addEventListener('pointerup', (e) => {
  if (!docDrag) return;
  docDrag = null;
  e.target.classList.remove('hot');
  const w = parseInt(getComputedStyle($('#drawer')).getPropertyValue('--dr-pane-w'), 10);
  if (Number.isFinite(w)) localStorage.setItem(LS_DRW, String(w));
  drDocFit();
});

$('#drSplit')?.addEventListener('pointercancel', () => {
  docDrag = null;
  $('#drSplit').classList.remove('hot');
});

window.addEventListener('resize', drDocFit);

// markdown：标题 / 列表 / 粗体 / 行内代码 / 链接 / 引用 / 分隔线 / 围栏代码 / 表格。
// 不引第三方库 —— 这个页面要能单文件双击打开，加一条 npm 依赖就多一条故障线。
// 安全前提：所有文本先 esc() 再过行内替换，标签是这里拼出来的，不是透传的。
function mdToHtml(src){
  const lines = String(src || '').split('\n');
  const out = [];
  let inList = null;     // 'ul' | 'ol'
  let fence = null;      // 围栏代码正在收集的行
  let quote = null;      // 引用块正在收集的行

  const closeList = () => { if (inList) { out.push('</' + inList + '>'); inList = null; } };
  // 逐行 inline 再用裸 <br> 拼：先 join 再 inline 的话，<br> 自己会被 esc 成 &lt;br&gt;
  const closeQuote = () => {
    if (quote) { out.push('<blockquote>' + quote.map(l => inline(l)).join('<br>') + '</blockquote>'); quote = null; }
  };
  const closeAll = () => { closeList(); closeQuote(); };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].replace(/\s+$/, '');

    // 围栏代码：里面的东西一律原样，不解析
    const f = line.match(/^\s*```\s*([\w+-]*)\s*$/);
    if (f) {
      if (fence === null) { closeAll(); fence = []; }
      else {
        out.push('<pre><code>' + esc(fence.join('\n')) + '</code></pre>');
        fence = null;
      }
      continue;
    }
    if (fence !== null) { fence.push(lines[i]); continue; }

    if (!line.trim()) { closeAll(); continue; }

    // 分隔线
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { closeAll(); out.push('<hr>'); continue; }

    // 表格：当前行是 |...| 且下一行是分隔行，就把连续的 | 行一起吃掉
    if (/^\s*\|/.test(line) && /^\s*\|?[\s:-]*-[\s:|-]*\|/.test(lines[i + 1] || '')) {
      closeAll();
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(line);
      i++;                                    // 跳过分隔行
      const body = [];
      while (i + 1 < lines.length && /^\s*\|/.test(lines[i + 1])) { i++; body.push(cells(lines[i])); }
      out.push('<table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead>'
        + (body.length ? '<tbody>' + body.map(r =>
            '<tr>' + head.map((_, k) => '<td>' + inline(r[k] || '') + '</td>').join('') + '</tr>').join('') + '</tbody>' : '')
        + '</table>');
      continue;
    }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeAll(); const lv = Math.min(h[1].length + 1, 4); out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'); continue; }

    const q = line.match(/^\s*>\s?(.*)$/);
    if (q) {
      closeList();
      if (!quote) quote = [];
      quote.push(q[1]);
      continue;
    }
    closeQuote();

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ul) {
      if (inList !== 'ul') { closeList(); out.push('<ul>'); inList = 'ul'; }
      out.push('<li>' + inline(ul[1]) + '</li>'); continue;
    }

    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) {
      if (inList !== 'ol') { closeList(); out.push('<ol>'); inList = 'ol'; }
      out.push('<li>' + inline(ol[1]) + '</li>'); continue;
    }

    closeAll();
    out.push('<p>' + inline(line) + '</p>');
  }
  if (fence !== null) out.push('<pre><code>' + esc(fence.join('\n')) + '</code></pre>');
  closeAll();
  return out.join('');

  function inline(x){
    // 链接先抽出 href，避免 esc 之后 & 变成 &amp; 拼进地址。
    // 只放行 http/https 和站内相对路径：javascript: 之类一律当普通文字。
    const parts = [];
    let s = esc(x).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => {
      if (!/^(https?:\/\/|\/)/i.test(href)) return m;
      parts.push('<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>');
      return '\u0000' + (parts.length - 1) + '\u0000';
    });
    s = s
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+?)`/g, '<code>$1</code>');
    return s.replace(/\u0000(\d+)\u0000/g, (m, n) => parts[Number(n)] || '');
  }
}

function buildSections(t){
  const secs = [];

  // 1. 原始描述
  const raw = [];
  if (t.payload?.text) raw.push(String(t.payload.text));
  if (t.payload?.urls?.length) raw.push('链接：\n' + t.payload.urls.join('\n'));

  // 原文就地编辑：抄进来的原始记录是唯一的「事实来源」，
  // 改它只能走 PATCH payload.text，不能让模型代写（chat.mjs 也不给它开字段）
  // 空原文也给这一节：没有它就没地方「补一句」，而补原文是修好一条模糊任务最快的手段
  secs.push({
    key: 'raw',
    title: '原始描述',
    action: '<button class="mini-btn" data-raw-edit="1">' + (raw.length ? '编辑' : '补一句') + '</button>',
    body: raw.length
      ? '<div>' + esc(raw.join('\n\n')) + '</div>'
      : '<span style="color:var(--text-3)">还没有原文。</span>'
  });

  // 2. 图片
  if (t.payload?.images?.length) {
    const imgs = t.payload.images.map(src =>
      '<img src="' + esc(imgUrl(src)) + '" alt="" loading="lazy">').join('');
    secs.push({ key: 'imgs', title: '图片 ' + t.payload.images.length, body: imgs });
  }

  // 3. 附件
  if (t.payload?.files?.length) {
    const links = t.payload.files.map(f => {
      const name = String(f).split(/[\\/]/).pop();
      return '<a href="/files/' + encodeURIComponent(name) + '" target="_blank">' + esc(name) + '</a>';
    }).join('');
    secs.push({ key: 'files', title: '附件 ' + t.payload.files.length, body: '<div class="files">' + links + '</div>' });
  }

  // 4. 需求说明
  secs.push({
    key: 'brief',
    title: '整理后的需求',
    action: (t.brief ? '<button class="mini-btn" data-doc-open="1">展开</button>' : '')
      + '<button class="mini-btn" data-brief="1">'
      + (t.brief ? '重新生成' : '生成需求') + '</button>',
    body: t.brief
      ? '<div class="md">' + mdToHtml(t.brief) + '</div>'
      : '<span style="color:var(--text-3)">还没有整理。点右上角生成一份能直接派给 agent 的需求说明。</span>'
  });

  return secs;
}

/* 「还缺这些」：只有待澄清、且初判真的说了缺什么时才出现。
   它跟原始描述分开放 —— 一个是用户抄进来的原话，一个是模型给的疑问，
   混在一个 section 里会让人以为那些疑问也是自己写的。 */
function gapsSection(t){
  if (t.dev_ready !== false || !(t.dev_gaps || []).length) return null;
  return {
    key: 'gaps',
    title: '还缺这些',
    body: '<ul class="dr-gaps">'
      + t.dev_gaps.map(g => '<li>' + esc(g) + '</li>').join('')
      + '</ul>'
  };
}

let drTask = null;

function drRenderDetail(t){
  drTask = t;
  const host = $('#drDetail');
  const secs = buildSections(t);
  const gaps = gapsSection(t);
  if (gaps) secs.unshift(gaps);      // 「还缺什么」排最前：它是这一屏最该看的东西

  // 记住哪些是展开的
  const opened = new Set([...host.querySelectorAll('.sect.open')].map(e => e.dataset.k));
  if (!host.dataset.init) { opened.add('raw'); opened.add('brief'); host.dataset.init = '1'; }
  if (gaps && !host.dataset.gapsInit) { opened.add('gaps'); host.dataset.gapsInit = '1'; }

  host.innerHTML = secs.map(sec => {
    const open = opened.has(sec.key) ? ' open' : '';
    return '<div class="sect' + open + '" data-k="' + sec.key + '">'
      + '<div class="sect-h"><span class="arw">▶</span><span>' + esc(sec.title) + '</span>'
      + '<span class="spacer"></span>' + (sec.action || '') + '</div>'
      + '<div class="sect-b">' + sec.body + '</div></div>';
  }).join('');

  // 折叠
  host.querySelectorAll('.sect-h').forEach(h => {
    h.addEventListener('click', (e) => {
      if (e.target.closest('[data-brief]') || e.target.closest('[data-doc-open]')
        || e.target.closest('[data-raw-edit]')) return;
      h.parentElement.classList.toggle('open');
    });
  });

  // 展开到右侧预览栏
  const openBtn = host.querySelector('[data-doc-open]');
  if (openBtn) openBtn.addEventListener('click', (e) => { e.stopPropagation(); drDocOpen('brief'); });

  // 原文就地编辑：「编辑」把正文换成 textarea，保存走 PATCH payload.text
  const rawBtn = host.querySelector('[data-raw-edit]');
  if (rawBtn) rawBtn.addEventListener('click', (e) => { e.stopPropagation(); drEditRaw(); });

  // 生成 / 重新生成
  const btn = host.querySelector('[data-brief]');
  if (btn) {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const old = btn.textContent;
      btn.textContent = '整理中…';
      btn.disabled = true;
      try {
        const r = await api('POST', '/api/brief', { taskId: drTaskId, force: true });
        if (r.error) throw new Error(r.error);
        drTask.brief = r.brief;
        drTask.brief_at = r.brief_at;
        drRenderDetail(drTask);
        drDocRender();      // 预览栏开着的时候跟着刷新，别让两边说的不是一份
        host.querySelector('.sect[data-k="brief"]').classList.add('open');
        toast('需求已整理');
      } catch (err) {
        toast('失败：' + err.message);
        btn.textContent = old;
        btn.disabled = false;
      }
    });
  }
}

function drRenderHead(t){
  const titleEl = $('#drTitle');
  titleEl.textContent = t.title || '（无标题）';
  // 点标题进编辑态：只换 input，不用 contenteditable（那东西会把换行、
  // 粘贴富文本、IME 组合一堆行为一起放进来，收不住）
  titleEl.dataset.edit = '1';
  titleEl.onclick = () => drEditTitle(t);

  const tags = [];
  tags.push('<span class="tag" style="color:' + (PRI_COLOR[t.priority] || 'var(--text-3)')
    + ';background:' + ((PRI_COLOR[t.priority] || 'var(--text-3)') + '22') + '">'
    + (PRI_LABEL[t.priority] || '普通') + '</span>');
  // 项目标签：『默认』要显式写成「未分配」，别让人以为有个叫默认的项目
  if (t.project) {
    tags.push('<span class="tag">'
      + esc(isInbox(t.project) ? '未分配' : t.project) + '</span>');
  }
  if (t.category) tags.push('<span class="tag cat">' + esc(t.category) + '</span>');
  // 状态用中文，别把 todo / doing 原样丢给用户看
  tags.push('<span class="tag">' + esc(STATUS_LABEL[t.status] || t.status) + '</span>');
  if (t.dev_ready === false) tags.push('<span class="tag draft">待澄清</span>');
  if (t.archived_at) tags.push('<span class="tag">已归档</span>');

  // 分类失败 / 卡住时给一个重判入口。以前这里什么都没有，
  // 判失败就只能删了重记 —— 而卡片上的「未判断」徽章又不可点。
  if (t.classify_state === 'failed' || t.classify_state === 'pending') {
    // 只挂 tag-retry，不挂 .tag —— .tag 是纯展示用的，混进按钮会让
    // 「按钮材质总则」那个检查把 .tag 也当成按钮
    tags.push('<button type="button" class="tag-retry" data-reclassify="1"'
      + ' title="' + esc(t.classify_reason || '') + '">'
      + (t.classify_state === 'pending' ? '判断中…' : '未判断 · 重试') + '</button>');
  }
  $('#drMeta').innerHTML = tags.join('');

  // 头部主按钮：待澄清时是「确认可以开工」，归档时是「取回」。
  // 这两个都是「这一步唯一该做的事」，所以放头部而不是塞进字段行。
  const cta = [];
  if (t.dev_ready === false) {
    cta.push('<button type="button" class="primary" id="drReady">确认可以开工</button>');
  }
  if (t.archived_at) {
    cta.push('<button type="button" id="drUnarchive">取回</button>');
  }
  const ctaHost = $('#drCta');
  if (ctaHost) ctaHost.innerHTML = cta.join('');
  $('#drReady')?.addEventListener('click', () => drConfirmReady(t));
  $('#drUnarchive')?.addEventListener('click', () => drUnarchive(t));

  // 快速改字段。项目条目后面带任务数 —— 重名时靠这个才分得清
  const opts = (store.projects || []).map(p => {
    const n = Number(p.taskCount || 0);
    const label = isInbox(p.name) ? '未分配（' + n + '）' : p.name + '（' + n + '）';
    return '<option value="' + esc(p.name) + '"' + (p.name === t.project ? ' selected' : '') + '>'
      + esc(label) + '</option>';
  }).join('');
  $('#drFields').innerHTML =
    '<select id="drPri" class="sel-native" data-sel="inline">'
      + ['p0','p1','p2','p3','p4'].map(k =>
          '<option value="' + k + '"' + (k === t.priority ? ' selected' : '') + '>'
          + PRI_LABEL[k] + '</option>').join('')
    + '</select>'
    + '<select id="drProj" class="sel-native" data-sel="inline">' + opts + '</select>'
    + '<select id="drStatus" class="sel-native" data-sel="inline">'
      + [['todo','未开始'],['doing','进行中'],['done','已完成']].map(([k,l]) =>
          '<option value="' + k + '"' + (k === t.status ? ' selected' : '') + '>' + l + '</option>').join('')
    + '</select>';

  // 这三个是动态插进来的，得再包一次自定义下拉（buildSels 幂等，不会重复包）
  buildSels();
  // buildSels 只负责"套壳"，不回填显示值 —— 不调 selSync 三个下拉就都是空白，
  // 得等用户随便碰一个下拉（pickSel → selSync）才一起亮起来。
  selSync();

  $('#drPri').onchange = () => drQuick({ priority: $('#drPri').value });
  $('#drProj').onchange = () => drQuick({ project: $('#drProj').value });
  $('#drStatus').onchange = () => drQuick({ status: $('#drStatus').value });

  // 「未判断 · 重试」按钮
  const retry = $('#drMeta [data-reclassify]');
  if (retry) {
    retry.addEventListener('click', async () => {
      retry.disabled = true;
      retry.textContent = '提交中…';
      try {
        const r = await api('POST', '/api/tasks/' + encodeURIComponent(t.id) + '/reclassify');
        if (r.queued === false) {
          toast('已经在判断了，稍等');
          await drLoad();
          return;
        }
        // 后端改成 pending 是异步的，轮询会把它带回来；这里主动刷一下先显示「判断中…」
        await drLoad();
        toast('已重新提交判断');
        // 等着看结果，完成或失败都会自己刷新
        watchClassify(t.id).then(() => { if (drTaskId === t.id) drLoad(); });
      } catch (e) {
        toast('提交失败：' + e.message);
        retry.disabled = false;
        retry.textContent = '未判断 · 重试';
      }
    });
  }
}

async function drQuick(patch){
  if (!drTaskId) return;
  try {
    const t = await api('PATCH', '/api/tasks/' + encodeURIComponent(drTaskId), patch);
    drRenderHead(t);
    await refresh();
  } catch (e) { toast('改不了：' + e.message); }
}

/* 对话附件：形状跟 tasks.payload 的 images/files 一样，
   所以图片能用 imgUrl()、文件能用 /files/<name> —— 不必另造一套。 */
function attsHTML(att){
  if (!att) return '';
  const imgs = (att.images || []).map(src =>
    '<img src="' + esc(imgUrl(src)) + '" alt="" loading="lazy">').join('');
  const links = (att.files || []).map(f => {
    const name = String(f).split(/[\\/]/).pop();
    return '<a href="/files/' + encodeURIComponent(name) + '" target="_blank" rel="noopener">'
      + esc(name) + '</a>';
  }).join('');
  return (imgs || links) ? '<div class="atts">' + imgs + links + '</div>' : '';
}

function drRenderThread(list){
  const body = $('#drBody');
  if (!list.length) {
    body.innerHTML = '<div class="dr-empty">这里可以补充信息、纠正判断、讨论方案。<br>'
      + '说的每句话都会直接改动这条任务。</div>';
    return;
  }
  body.innerHTML = list.map(m => {
    const applied = m.patch && Object.keys(m.patch).length
      ? '<span class="applied">已改 ' + Object.keys(m.patch)
          .map(k => ({title:'标题',priority:'优先级',category:'类别',project:'项目',status:'状态',note:'备注'}[k] || k))
          .join(' · ') + '</span>' : '';
    // 纯附件消息没有文字：给个空 div 会在气泡里留一条空白，跳过
    const bub = m.text ? '<div class="bub">' + esc(m.text) + '</div>' : '';
    return '<div class="dm ' + (m.role === 'user' ? 'me' : '') + '">'
      + bub + attsHTML(m.attachments) + applied + '</div>';
  }).join('');
  body.scrollTop = body.scrollHeight;
}

/* ---------- 抽屉里的待发附件 ----------
   独立一份状态，不跟底栏共用 images / files：底栏那批是「随手记新任务」的，
   抽屉这批是「给这条任务补话」的，共用一个数组会串（贴一张图到抽屉，
   底栏的「存下」按钮就自己亮了）。 */
let drImages = [];
let drFiles = [];

function drRenderThumbs(){
  const host = $('#drThumbs');
  if (!host) return;
  const parts = [];
  drImages.forEach((im, k) => {
    parts.push('<div class="thumb"><img src="' + esc(im.url) + '" alt="">'
      + '<button data-k="img" data-i="' + k + '" title="移除">✕</button></div>');
  });
  drFiles.forEach((f, k) => {
    const ext = (f.original || f.name || '').split('.').pop()?.slice(0, 4) || 'FILE';
    parts.push('<div class="thumb file" title="' + esc(f.original || f.name) + '">'
      + '<span class="fext">' + esc(ext) + '</span>'
      + '<small>' + esc(humanSize(f.size || 0)) + '</small>'
      + '<button data-k="file" data-i="' + k + '" title="移除">✕</button></div>');
  });
  host.innerHTML = parts.join('');
  host.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.k === 'img') drImages.splice(+b.dataset.i, 1);
      else drFiles.splice(+b.dataset.i, 1);
      drRenderThumbs();
    });
  });
}

// 跟底栏 uploadFile 同一套流程，但落到 drImages / drFiles。
// 没有直接复用它：那个函数把结果 push 进底栏的 images/files，是它的一部分语义。
async function drUpload(f){
  try {
    const dataUrl = await readAsDataUrl(f);
    const isImage = f.type.startsWith('image/');
    const body = isImage ? { dataUrl } : { dataUrl, filename: f.name };
    const d = await api('POST', '/api/upload', body);
    if (isImage) drImages.push({ path: d.path, url: d.url, name: f.name });
    else drFiles.push({ path: d.path, name: d.name, original: d.original || d.name, size: d.size || f.size });
    drRenderThumbs();
    return true;
  } catch (e) {
    toast('上传失败：' + e.message);
    return false;
  }
}

async function drSend(){
  const input = $('#drInput');
  const text = input.value.trim();
  const imgs = drImages.map(i => i.path);
  const fls = drFiles.map(f => f.path);
  // 三者全空才算"什么都没说"：纯文件、纯图片也要能发出去
  if ((!text && !imgs.length && !fls.length) || drBusy || !drTaskId) return;

  drBusy = true;
  $('#drSend').disabled = true;
  input.value = '';
  input.style.height = 'auto';
  const pendingImgs = imgs.slice();
  const pendingFiles = fls.slice();
  drImages = [];
  drFiles = [];
  drRenderThumbs();

  // 先乐观渲染用户这句（附件也用同一套渲染，发完再被服务端返回值覆盖）
  const body = $('#drBody');
  if (body.querySelector('.dr-empty')) body.innerHTML = '';
  body.insertAdjacentHTML('beforeend',
    '<div class="dm me">' + (text ? '<div class="bub">' + esc(text) + '</div>' : '')
    + attsHTML({ images: pendingImgs, files: pendingFiles }) + '</div>');
  body.scrollTop = body.scrollHeight;

  const thinking = document.createElement('div');
  thinking.className = 'dm';
  thinking.innerHTML = '<div class="bub" style="color:var(--text-3)">…</div>';
  body.appendChild(thinking);
  body.scrollTop = body.scrollHeight;

  try {
    const r = await api('POST', '/api/chat',
      { taskId: drTaskId, text, images: pendingImgs, files: pendingFiles });
    thinking.remove();
    drRenderThread((await api('GET', '/api/tasks/' + encodeURIComponent(drTaskId))).messages || []);
    if (r.task) drRenderHead(r.task);
    await refresh();
  } catch (e) {
    thinking.innerHTML = '<div class="bub bad">失败：' + esc(e.message) + '</div>';
    // 发失败要把附件放回去，否则用户得重新传一遍（文件已经在磁盘上了，重建引用就够）
    pendingImgs.forEach(p => drImages.push({ path: p, url: imgUrl(p), name: '' }));
    pendingFiles.forEach(p => drFiles.push({ path: p, name: p, original: String(p).split(/[\\/]/).pop(), size: 0 }));
    drRenderThumbs();
  } finally {
    drBusy = false;
    $('#drSend').disabled = false;
    input.focus();
  }
}

/* ---------- 标题 / 原文就地编辑 ---------- */

/* 标题：点 b 变 input。Enter 提交、Esc 取消（值回滚、不发请求）、失焦提交。
   空标题前端就拦掉 —— 后端也拦，但让用户等一个来回才知道不行是没必要的。 */
function drEditTitle(t){
  const titleEl = $('#drTitle');
  if (!titleEl || titleEl._editing) return;
  const before = t.title || '';
  const input = document.createElement('input');
  input.className = 'dr-title-in';
  input.value = before;
  input.setAttribute('aria-label', '任务标题');
  titleEl._editing = true;
  titleEl.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const restore = () => {
    titleEl._editing = false;
    input.replaceWith(titleEl);
  };
  const cancel = () => {
    if (done) return;
    done = true;
    restore();
  };
  const commit = async () => {
    if (done) return;
    const next = input.value.trim();
    // 没改就什么都不发：点一下标题再点别处不应该产生 PATCH
    if (next === before) { cancel(); return; }
    if (!next) { toast('标题不能为空'); input.focus(); return; }
    done = true;
    try {
      const r = await api('PATCH', '/api/tasks/' + encodeURIComponent(t.id), { title: next });
      restore();
      drRenderHead(r);
      // 就地更新那条任务再重绘，不整页刷新 —— 卡片的滚动位置和展开态都留着
      const hit = (store.tasks || []).find(x => x.id === t.id);
      if (hit) hit.title = r.title;
      render();
      toast('标题已改');
    } catch (e) {
      toast('改不了：' + e.message);
      done = false;
      input.focus();
    }
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancel(); }
  });
  input.addEventListener('blur', () => { commit(); });
}

/* 原文：把「原始描述」的正文换成 textarea。
   保存走 PATCH { payload: { text } } —— core.patch 是深合并，images/files 原样留着。 */
function drEditRaw(){
  const host = $('#drDetail');
  const sect = host?.querySelector('.sect[data-k="raw"]');
  if (!sect || !drTask) return;
  const bodyEl = sect.querySelector('.sect-b');
  if (!bodyEl || bodyEl.querySelector('.sect-edit')) return;

  const before = String(drTask.payload?.text || '');
  bodyEl.innerHTML = '<textarea class="sect-edit" aria-label="原始描述"></textarea>'
    + '<div class="dr-row" style="margin-top:7px">'
    + '<span class="hint">保存只改原文，不动图片和附件</span>'
    + '<button type="button" data-raw-cancel="1">取消</button>'
    + '<button type="button" class="primary" data-raw-save="1">保存</button>'
    + '</div>';
  const ta = bodyEl.querySelector('.sect-edit');
  ta.value = before;
  sect.classList.add('open');
  // 高度自适应内容：先归零再读 scrollHeight，否则只会越来越矮
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 420) + 'px'; };
  fit();
  ta.addEventListener('input', fit);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  const cancel = () => drRenderDetail(drTask);
  bodyEl.querySelector('[data-raw-cancel]').addEventListener('click', cancel);
  bodyEl.querySelector('[data-raw-save]').addEventListener('click', async () => {
    const next = ta.value;
    if (next === before) { cancel(); return; }
    try {
      const r = await api('PATCH', '/api/tasks/' + encodeURIComponent(drTaskId),
        { payload: { text: next } });
      drTask = r;
      drRenderDetail(r);
      drDocRender();          // 预览栏的「原始描述」页签跟着变，别让两边说的不是一份
      const hit = (store.tasks || []).find(x => x.id === r.id);
      if (hit) hit.payload = r.payload;
      toast('原文已保存');
    } catch (e) { toast('保存失败：' + e.message); }
  });
  ta.addEventListener('keydown', e => {
    // Ctrl/Cmd+Enter 保存：Enter 本身要留给换行（原文是多行的）
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      bodyEl.querySelector('[data-raw-save]').click();
    } else if (e.key === 'Escape') {
      e.preventDefault(); e.stopPropagation(); cancel();
    }
  });
}

/* ---------------- 目录浏览 ---------------- */

let pickState = { path: null, parent: null, onPick: null };

async function openPicker(startPath, onPick) {
  pickState.onPick = onPick;
  $('#pickDlg').showModal();

  // 起点优先级：已填的路径（存在就进去）→ 它父目录 → 项目里第一个目录 → 用户目录
  let start = String(startPath || '').trim();
  if (start) {
    if (await loadDir(start)) return;          // 能打开就直接用
    // 打不开（路径不存在 / 没权限）：退到父目录
    const cut = start.replace(/[\\/]+$/, '').split(/[\\/]/);
    cut.pop();
    // 分隔符要跟着路径本身走：mac/Linux 是 /，Windows 是 \
    start = cut.length ? cut.join(start.includes('\\') ? '\\' : '/') : '';
  }

  if (!start) {
    const withDir = (store.projects || []).find(p => (p.dirs || []).length);
    if (withDir) start = withDir.dirs[0].path;
  }

  if (start && await loadDir(start)) return;

  // 最后一档：用户目录 -> 第一个盘符
  const r = await api('GET', '/api/browse');
  await loadDir(r.home || (r.roots && r.roots[0] && r.roots[0].path));
}

async function loadDir(target) {
  const list = $('#pickList');
  list.innerHTML = '<div class="pick-empty">读取中…</div>';
  try {
    const r = await api('GET', '/api/browse?path=' + encodeURIComponent(target || ''));
    pickState.path = r.path || null;
    pickState.parent = r.parent || null;
    $('#pickPath').value = r.path || r.home || '';
    $('#pickUp').disabled = !r.parent;

    // 没给 path 时是盘符列表
    if (r.roots) {
      list.innerHTML = r.roots.map(x => `
        <div class="pick-item" data-go="${esc(x.path)}">
          <span class="ico">💽</span><span>${esc(x.name)}</span>
        </div>`).join('') || '<div class="pick-empty">没有可读的盘符</div>';
    } else {
      const parts = [];
      if (r.isProject) parts.push(`<span class="tag2">${r.isGitRepo ? 'git 仓库' : '像项目目录'}</span>`);
      const head = `<div class="pick-item" data-go="${esc(r.path)}" style="cursor:default">
        <span class="ico">📂</span><span style="color:var(--text-3)">当前：${esc(r.path)}</span>${parts.join('')}
      </div>`;
      const rows = (r.dirs || []).map(d => `
        <div class="pick-item" data-go="${esc(d.path)}">
          <span class="ico">📁</span><span>${esc(d.name)}</span>
        </div>`).join('');
      list.innerHTML = head + (rows || '<div class="pick-empty">这个目录下没有子目录</div>');
    }

    list.querySelectorAll('.pick-item[data-go]').forEach((el) => {
      el.addEventListener('click', () => loadDir(el.dataset.go));
    });
    return true;
  } catch (e) {
    list.innerHTML = `<div class="pick-empty">打不开：${esc(e.message)}</div>`;
    return false;
  }
}

$('#pickUp')?.addEventListener('click', () => { if (pickState.parent) loadDir(pickState.parent); });
$('#pickCancel')?.addEventListener('click', () => $('#pickDlg').close());
$('#pickOk')?.addEventListener('click', () => {
  const chosen = pickState.path || $('#pickPath').value;
  if (chosen && pickState.onPick) pickState.onPick(chosen);
  $('#pickDlg').close();
});

let editingProjectId = null;

function renderProjList(){
  const host = $('#projList');
  if (!host) return;
  const list = store.projects || [];
  host.innerHTML = list.map((p, i) => {
    const dirs = (p.dirs || []).map(d => {
      const base = String(d.path || '').split(/[\\/]/).filter(Boolean).pop() || d.path;
      return base + (d.note ? '（' + d.note + '）' : '');
    }).join('、');
    // 手机上 HTML5 拖拽整个不工作（没有 dragstart/drop），
    // 所以排序不能只靠拖。这两个按钮是触屏上唯一能改顺序的入口，
    // 桌面端也留着 —— 一次挪一位比拖拽更准，不会插错位置。
    const fixed = isInbox(p.name);
    const canUp = !fixed && i > 1;                 // 0 号永远是「默认」，1 号上面就是它
    const canDown = !fixed && i < list.length - 1;
    return `<div class="proj-row" data-pid="${p.id}" data-idx="${i}">
      <div>
        <div class="pn">${esc(p.name)}</div>
        ${dirs ? `<div class="dirs">${esc(dirs)}</div>` : ''}
      </div>
      <span class="pc">${p.taskCount || 0}</span>
      ${fixed ? '' : `<button type="button" class="mini-btn proj-step" data-step="-1" data-pid="${p.id}"
        title="上移一位" ${canUp ? '' : 'disabled'}>↑</button>
      <button type="button" class="mini-btn proj-step" data-step="1" data-pid="${p.id}"
        title="下移一位" ${canDown ? '' : 'disabled'}>↓</button>`}
    </div>`;
  }).join('') || '<div class="proj-row"><div class="pn" style="color:var(--text-3)">还没有项目</div></div>';

  host.querySelectorAll('.proj-row[data-pid]').forEach(row => {
    row.addEventListener('click', (e) => {
      // 上下移按钮有自己的行为，别让它顺手把项目编辑器也打开
      if (e.target.closest('.proj-step')) return;
      openProjectEditor(row.dataset.pid);
    });
  });
  host.querySelectorAll('.proj-step').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await moveProjectStep(btn.dataset.pid, Number(btn.dataset.step));
    });
  });
}

/* 把项目往上/下挪一位。和拖拽走同一个接口，只是用「相邻交换」算目标顺序 —
   挪一位不需要知道落点在哪一行，比拖拽更不容易插错。 */
async function moveProjectStep(id, step){
  const list = (store.projects || []).slice();
  const from = list.findIndex(p => p.id === id);
  if (from < 0) return;
  // 「默认」钉在 0，「其它项目」从 1 开始，所以越界判断是 1 和 length-1
  const to = from + step;
  if (to < 1 || to >= list.length) return;
  const [moved] = list.splice(from, 1);
  list.splice(to, 0, moved);
  store.projects = list;
  renderProjList();
  try {
    const r = await api('POST', '/api/projects/reorder',
      { ids: list.filter(p => !isInbox(p.name)).map(p => p.id) });
    if (r.projects) { store.projects = r.projects; renderProjList(); renderSidebar(); }
    else renderSidebar();
  } catch (err) {
    toast('排序没存上：' + err.message);
    await refresh();
    renderProjList();
  }
}

function dirRow(d = {}){
  const wrap = document.createElement('div');
  wrap.className = 'dir-row';
  wrap.innerHTML = `
    <input class="dp" placeholder="点右边选，或直接粘贴路径" value="${esc(d.path || '')}">
    <button type="button" class="pick" title="浏览目录">📁</button>
    <input class="dn" placeholder="说明（可选）" value="${esc(d.note || '')}" style="max-width:110px">
    <select class="dm sel-native" data-sel="inline">
      <option value="">副</option>
      <option value="1" ${d.primary ? 'selected' : ''}>主要</option>
    </select>
    <button type="button" class="rm" title="移除">✕</button>
  `;
  // 目录行还没插进文档，只能在自己的容器里找（传 document 会找不到）
  buildSels(wrap);
  wrap.querySelector('.rm').addEventListener('click', () => wrap.remove());
  wrap.querySelector('.pick').addEventListener('click', async () => {
    const input = wrap.querySelector('.dp');
    const current = input.value.trim();

    // 先试系统原生对话框 —— 一次点完，不用逐层走
    const btn = wrap.querySelector('.pick');
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const r = await api('POST', '/api/pickdir', { initial: current });
      if (r.path) { input.value = r.path; return; }
      return;                       // 用户取消了，什么都不做
    } catch (e) {
      // 系统对话框不可用（非 Windows / 缺脚本），退到页面浏览
      console.warn('原生对话框不可用，改用页面浏览：', e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '📁';
    }

    openPicker(current, (chosen) => { input.value = chosen; });
  });
  return wrap;
}

    $('#lightbox').classList.remove('on');
    if (docDrag) { docDrag = null; $('#drSplit')?.classList.remove('hot'); return; }
    // 一层一层退：先收预览栏，再关抽屉
    if ($('#drawer')?.classList.contains('doc-on')) { drDocClose(); return; }
    if ($('#drawer')?.classList.contains('on')) drClose();
    return;
  }

  if (e.key === '[' && !typing && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); setCollapsed(!collapsed); return;
  }
  if (e.key === ',' && !typing && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); openSettings(); return;
  }
  if (e.key === 'n' && !typing && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    if (collapsed) setCollapsed(false);
    setTimeout(() => $('#text')?.focus(), 200);
  }
});

/* ---------------- 首屏加载 + 轮询 ---------------- */

// 首屏失败不能只插一行红字：用户除了刷新没别的办法，而且不知道能不能恢复。
// 给个「重试」，点一下重新拉。
function ensureBootBar(){
  let bar = document.getElementById('bootBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'bootBar';
    document.body.insertBefore(bar, document.body.firstChild);
  }
  document.body.classList.add('boot-open');
  return bar;
}

function clearBootBar(){
  document.getElementById('bootBar')?.remove();
  document.body.classList.remove('boot-open');
}

function showBootError(err){
  const bar = ensureBootBar();
  bar.className = 'boot-bar bad';
  bar.innerHTML = '连不上任务服务：' + esc(err.message)
    + ' <button type="button" id="bootRetry">重试</button>';
  document.getElementById('bootRetry').onclick = () => boot();
}

function showStaleBar(info){
  const bar = ensureBootBar();
  bar.className = 'boot-bar warn';
  bar.innerHTML = '后端还是旧版本（v' + esc(info.version || '?') + '），'
    + '改过的代码没有生效。<b>重启服务</b>后这里会自己消失。';
}

async function boot(){
  clearBootBar();
  try {
    await refresh();
  } catch (e) {
    showBootError(e);
    return;
  }
  if (store.build?.stale) showStaleBar(store.build);
}

// 页面在后台时不轮询：看板全量拉一次不便宜（2000 条任务约 0.93MB），
// 而隐藏的标签页没人看。切回来立刻补一次，不会出现数据是旧的。
const POLL_MS = 3000;
let pollTimer = null;

function startPolling(){
  if (pollTimer) return;
  pollTimer = setInterval(() => {
    if (document.hidden) return;
    refresh({ poll: true }).then(() => {
      if (store.build?.stale) showStaleBar(store.build);
    }).catch(() => {});
  }, POLL_MS);
}

// 切回前台不能拿 since：后台这段时间库里可能变过，但轮询没跑，
// 手上的 revision 是旧的。用 since 会走到 unchanged 分支，看板停在上次的样子。
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  refresh().then(() => {
    if (store.build?.stale) showStaleBar(store.build);
  }).catch(() => {});
});

boot().finally(startPolling);
</script>
